<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAGE-Mat 知识森林</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{--ground:#F1F4F7;--panel:#FFFFFF;--line:#D7DEE6;--line-2:#BFC9D4;--text:#13202C;--muted:#5A6A7A;--faint:#8A97A5;
--tele:#1E8FA8;--tele-2:#5FB3C9;--heat:#E06A1B;--heat-soft:rgba(224,106,27,.12);--ok:#1F9D62;--gold:#B0841A;--blue:#3D63D6;--purple:#7A4FD6;--crit:#C93D2C;--grey:#8A97A5;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--text);font-family:"IBM Plex Sans","Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px}
#app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr 380px;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font:700 18px/1.1 "Chakra Petch","IBM Plex Sans","Noto Sans SC",sans-serif;margin:0;letter-spacing:.2px}
header h1 small{display:block;font:500 11px/1.3 "IBM Plex Sans","Noto Sans SC",sans-serif;color:var(--muted);margin-top:2px;letter-spacing:0}
.stages{display:flex;gap:4px;align-items:center}
.stages button{font:500 12px/1 "IBM Plex Sans","Noto Sans SC",sans-serif;padding:7px 10px;border:1px solid var(--line-2);background:#fff;border-radius:6px;cursor:pointer;color:var(--muted)}
.stages button.on{background:var(--text);color:#fff;border-color:var(--text)}
.stages button.done{border-color:var(--tele);color:var(--tele)}
.stages button.play{border-color:var(--heat);color:var(--heat);font-weight:600}
.stagedesc{flex:1;min-width:0;color:var(--muted);font-size:12px;line-height:1.35}
.stagedesc b{color:var(--text)}
.tools{display:flex;gap:6px;align-items:center}
.tools input{font:400 12px "IBM Plex Sans","Noto Sans SC",sans-serif;padding:6px 9px;border:1px solid var(--line-2);border-radius:6px;width:190px;background:#fff}
.tools button,.tools label{font:500 12px "IBM Plex Sans","Noto Sans SC",sans-serif;padding:6px 9px;border:1px solid var(--line-2);background:#fff;border-radius:6px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.tools label input{width:auto;margin:0}
#stage{position:relative;overflow:hidden;background:var(--ground)}
svg{width:100%;height:100%;display:block;cursor:grab}
svg:active{cursor:grabbing}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 16px;font-size:12.5px;line-height:1.5}
aside h2{font:700 15px/1.25 "Chakra Petch","IBM Plex Sans","Noto Sans SC",sans-serif;margin:0 0 6px}
aside h3{font:600 11px/1.2 "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
aside .kicker{font:500 11px "IBM Plex Mono",monospace;color:var(--tele);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
aside .src{font:400 11px "IBM Plex Mono",monospace;color:var(--faint);margin-top:10px;word-break:break-all;border-top:1px dashed var(--line);padding-top:8px}
aside a{color:var(--tele);text-decoration:none}
aside a:hover{text-decoration:underline}
aside code{font:400 11px "IBM Plex Mono",monospace;background:#F1F4F7;padding:1px 4px;border-radius:3px}
.chip{display:inline-block;font:500 11px "IBM Plex Sans","Noto Sans SC",sans-serif;padding:2px 7px;border:1px solid var(--line-2);border-radius:999px;margin:2px 3px 2px 0;cursor:pointer;background:#fff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.chip:hover{border-color:var(--tele);color:var(--tele)}
.chip.lvl-D0{border-color:var(--heat);color:var(--heat)}.chip.lvl-D1{border-color:var(--gold);color:var(--gold)}.chip.lvl-N1{border-color:var(--tele);color:var(--tele)}.chip.lvl-P1{border-color:var(--blue);color:var(--blue)}.chip.lvl-X{border-color:var(--grey);color:var(--grey)}.chip.lvl-H{border-color:var(--purple);color:var(--purple);border-style:dashed}
.tag{display:inline-block;font:600 10.5px "IBM Plex Mono",monospace;padding:1px 6px;border-radius:4px;color:#fff;background:var(--muted);margin-right:4px;vertical-align:middle}
.tag.ok{background:var(--ok)}.tag.heat{background:var(--heat)}.tag.tele{background:var(--tele)}.tag.grey{background:var(--grey)}.tag.crit{background:var(--crit)}.tag.purple{background:var(--purple)}.tag.gold{background:var(--gold)}
.kv{display:grid;grid-template-columns:78px 1fr;gap:3px 8px;margin:6px 0}
.kv div:nth-child(odd){color:var(--muted);font-size:11.5px}
.kv .na{color:var(--faint)}
.claimtext{border-left:3px solid var(--tele);padding:4px 8px;background:#F7FAFB;margin:6px 0;border-radius:0 4px 4px 0}
.ev{margin:5px 0;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#FBFCFD}
.ev .t{font-size:12px}
.ev .n{color:var(--muted);font-size:11.5px;margin-top:2px}
footer{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:6px 16px;background:var(--panel);border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
footer .lg{display:inline-flex;align-items:center;gap:5px}
footer .sw{width:11px;height:11px;border-radius:3px;border:1.5px solid var(--line-2);display:inline-block}
footer .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
footer .ln{width:20px;height:0;border-top:2px solid var(--line-2);display:inline-block}
.stats{display:flex;gap:10px;flex-wrap:wrap;font:500 11px "IBM Plex Mono",monospace;color:var(--muted)}
.stats b{color:var(--text);font-size:12px}
/* svg */
.n text{font-family:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;pointer-events:none;fill:var(--text)}
.n .lab{font-size:11px}
.n.dim{opacity:.10}
.n.hit rect,.n.hit circle{stroke-width:2.5px}
.e{fill:none;stroke:var(--line-2);stroke-width:1;opacity:.55}
.e.dim{opacity:.03}
.e.hi{opacity:.95;stroke-width:1.8}
.e.k-tree{stroke:#9AA8B6;opacity:.7}
.e.k-support{stroke:var(--tele);opacity:.28}
.e.k-cites{stroke:#7F8C9A;opacity:.18}
.e.k-mentions{stroke:var(--tele);opacity:.12;stroke-dasharray:2 3}
.e.k-reports,.e.k-produces{stroke:var(--heat);opacity:.30}
.e.k-records,.e.k-route,.e.k-uses,.e.k-characterised,.e.k-traces{stroke:var(--tele);opacity:.22}
.e.k-defines,.e.k-maps,.e.k-serves{stroke:#9AA8B6;opacity:.35;stroke-dasharray:3 3}
.e.k-answers{stroke:var(--ok);opacity:.55;stroke-width:1.6}
.e.k-grows{stroke:var(--heat);opacity:.8;stroke-width:2}
.e.k-about,.e.k-candidate,.e.k-predicts_for,.e.k-evidence{stroke:var(--purple);opacity:.30}
.e.k-duplicate{stroke:var(--grey);stroke-dasharray:2 2}
.e.k-contains{stroke:#9AA8B6;opacity:.25}
.n.old{opacity:.32}
.e.old{opacity:.08}
.old.band{opacity:.6}
.colhead{font:600 12px "Chakra Petch","IBM Plex Sans","Noto Sans SC",sans-serif;fill:var(--muted);letter-spacing:.06em}
.colsub{font:400 10.5px "IBM Plex Sans","Noto Sans SC",sans-serif;fill:var(--faint)}
.band{fill:#fff;stroke:var(--line);rx:10}
.grp{font:500 10px "IBM Plex Mono",monospace;fill:var(--faint);letter-spacing:.06em}
body.poster #app{grid-template-columns:1fr;grid-template-rows:1fr}
body.poster header,body.poster aside,body.poster footer{display:none}
body.poster svg{cursor:default}
.poster-title{font:700 30px "Chakra Petch","IBM Plex Sans","Noto Sans SC",sans-serif;fill:var(--text)}
.poster-sub{font:500 14px "IBM Plex Sans","Noto Sans SC",sans-serif;fill:var(--muted)}
.poster-stage{font:600 13px "IBM Plex Mono",monospace;fill:var(--tele);letter-spacing:.08em}
.poster-legend{font:500 11.5px "IBM Plex Sans","Noto Sans SC",sans-serif;fill:var(--muted)}
@media (max-width:1000px){#app{grid-template-columns:1fr}aside{display:none}}
</style>
</head>

<div id="app">
  <header>
    <h1>SAGE-Mat 知识森林<small id="subtitle"></small></h1>
    <div class="stages" id="stages"></div>

    <div class="tools">
      <input id="q" placeholder="搜索：化合物 / 文献 / 主张 / 路线…">
      <label title="平时只画结构连线；勾选后画出全部引用与实体连线"><input type="checkbox" id="alledges">全部连线</label>
      <button id="fit">适配视图</button>

  <div id="stage"><svg id="svg"></svg></div>
  <aside id="panel"></aside>
  <footer id="legend"></footer>
</div>

r":"按 D0 / D1 / N1 / P1 / X 五级证据距离隔离\"同一相\"、\"结构近邻\"与\"仅可借鉴工艺\"；组成相近不等于结构近邻。","src":"正式案例 inputs/scope.md · 核心问题"},{"id":"Q3","type":"question","stage":0,"label":"目标 3 · 路线与条件","text":"目标相及近邻相分别通过何种路线获得，其可复现实验条件是什么？","status":"部分回答","answer":"近邻体系的 29 条条件记录已按统一字段表格化；目标相本身除\"开放体系高温溶液 + SCXRD\"外，投料 / 温程 / 坩埚 / 助熔 / 冷却全部记 NA。","src":"正式案例 inputs/scope.md · 核心问题"},{"id":"Q4","type":"question","stage":0,"label":"目标 4 · 取代与成相控制","text":"阳离子取代、阴离子基团变化、助熔剂和热处理如何影响成相窗口、杂相与晶体尺寸？","status":"部分回答","answer":"Ba↔Sr、Zn↔Mg/Co、MoO₃ 用量、冷却路径与气氛的影响来自近邻体系；Zn 在四方 Ba–Y 谱系中的固溶范围与占位没有直接证据（缺口 4）。","src":"正式案例 inputs/scope.md · 核心问题"},{"id":"Q5","type":"question","stage":0,"label":"目标 5 · 原始实测 vs 推断","text":"文献中哪些条件为原始实测，哪些仅由数据库、二手来源或结构类比推断？","status":"已回答","answer":"每条条件记录标注来源定位（实验部分 / 摘要 / 题名）；36 条主张带原始条件溯源，54 条主张的证据全文在包内；缺失字段记 NA，不得类比补值。","src":"正式案例 inputs/scope.md · 核心问题"},{"id":"S1","type":"subtopic","stage":0,"label":"S1 身份与记号核验","text":"规范式、别名、数据库编号、氧计量、价态与电荷平衡。","src":"正式案例 inputs/scope.md · MECE 子主题"},{"id":"S2","type":"subtopic","stage":0,"label":"S2 目标相结构基线","text":"晶系、空间群、晶胞、配位多面体、位点占据和结构原型。","src":"正式案例 inputs/scope.md · MECE 子主题"},{"id":"S3","type":"subtopic","stage":0,"label":"S3 结构近邻判据与谱系","text":"同构/同型、等结构、超结构、同一拓扑、固溶体及明确结构派生物；给出纳入证据等级。","src":"正式案例 inputs/scope.md · MECE 子主题"},{"id":"S4","type":"subtopic","stage":0,"label":"S4 固相与陶瓷路线","text":"原料、预处理、配比、研磨/压片、温度—时间程序、气氛、坩埚、复烧与冷却。","src":"正式案例 inputs/scope.md · MECE 子主题"},{"id":"S5","type":"subtopic","stage":0,"label":"S5 晶体生长及助熔路线","text":"自熔/助熔、熔体组成、最高温度、保温、降温速率、籽晶/成核及洗涤分离。","src":"正式案例 inputs/scope.md · MECE 子主题"},{"id":"S6","type":"subtopic","stage":0,"label":"S6 替代与成相控制","text":"Ba/Y/Zn 位替代、硅酸根相关替换、缺陷/非化学计量、相图或组成窗口。","src":"正式案例 inputs/scope.md · MECE 子主题"},{"id":"S7","type":"subtopic","stage":0,"label":"S7 产物与证据质量","text":"粉末/单晶、产率、晶粒尺寸、PXRD/SCXRD/Rietveld/元素分析及是否有独立复现。","src":"正式案例 inputs/scope.md · MECE 子主题"},{"id":"S8","type":"subtopic","stage":0,"label":"S8 条件对照与可复现建议","text":"将已报道条件标准化为统一字段，区分直接证据、二手转述和合理推断，识别信息缺口。","src":"正式案例 inputs/scope.md · MECE 子主题"},{"id":"B_A","type":"branch","stage":1,"label":"A 目标相身份与原始报道","text":"目标相身份与原始报道","src":"证据包 notes/taxonomy.md §2"},{"id":"L_A1","type":"leaf","stage":1,"label":"A1 精确含 Zn 目标相：直接证据稀缺","levels":["D0"],"fields":{"判定":"直接报告 Ba5Y12Zn[O(SiO4)]8、高温溶液法、开放体系和单晶 X 射线结构鉴定。","解释":"这是唯一允许少于三篇的直接目标叶。该文自称 Ba–Y–Zn–Si–O 体系首个化合物；现有证据边界内没有第二篇精确同式的独立复现。原始式中的 O 计量、Zn 是否占据独立四面体以及与无 Zn 四方 Ba–Y 相的关系，必须保留为核验问题，不能先验合并。"},"keys":["ababaikeri2024ba5y12zn"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_A2","type":"leaf","stage":1,"label":"A2 四方 Ba–Y 硅酸盐身份谱系与重审","levels":["D1"],"fields":{"判定":"早期助熔生长的 Ba5+xY13Si8O41 谱系、系统助熔筛选、2024 年非整比/调制结构重审，以及 Ba5Y13[SiO4]8O8.5 的独立精修证据。","用途":"建立“历史命名—规范化学计量—现代精修”对照，不把 D1 当成 D0。"},"keys":["kolitsch2009crystal","wierzbickawieczorek2017high","yamane2024synthesis","yamane2024microstructure","gulay2024navigation"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_A3","type":"leaf","stage":1,"label":"A3 Ba–Y 体系中的竞争/伴生相身份","levels":["D1","N1"],"fields":{"判定":"同一成分空间内经结构或相场实验确认、会影响目标相归属或相纯度的 Ba–Y 正硅酸盐/焦硅酸盐及非整比陶瓷相。","用途":"回答“产物是否真为目标相”以及偏离配比时优先出现何种相，而不是扩张目标相定义。"},"keys":["yamane2024synthesis","yamane2024microstructure","gulay2024navigation","motozawa2022bay16si4o33"],"src":"证据包 notes/taxonomy.md §2"},{"id":"B_B","type":"branch","stage":1,"label":"B 结构拓扑与晶体化学近邻","text":"结构拓扑与晶体化学近邻","src":"证据包 notes/taxonomy.md §2"},{"id":"L_B1","type":"leaf","stage":1,"label":"B1 I-42m 四方 Ba–Y 主谱系","levels":["D1","N1"],"fields":{"判定":"空间群/结构精修或系统研究把相放入同一四方 Ba–Y 主谱系；含 Zn 目标只作为需要比较的 D0 端点。","核心比较字段":"空间群、调制/超胞、Ba/Y 位点占据、孤立 [SiO4] 与复合四面体单元、氧盈亏。"},"keys":["ababaikeri2024ba5y12zn","kolitsch2009crystal","wierzbickawieczorek2017high","yamane2024synthesis","gulay2024navigation"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_B2","type":"leaf","stage":1,"label":"B2 Ba–Y 正硅酸根/焦硅酸根多面体近邻","levels":["N1"],"fields":{"判定":"含 Ba 与 Y，且有明确结构数据展示孤立正硅酸根、焦硅酸根或 Ba–Y–O 多面体组织方式；不要求与 B1 同型。","用途":"比较配位与硅酸根聚合度对成相路线的影响，不用作精确目标配方复现证据。"},"keys":["kolitsch2009crystal","gulay2024navigation","motozawa2022bay16si4o33","felsche1973the"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_B3","type":"leaf","stage":1,"label":"B3 Ba–Zn–Si 四面体网络近邻","levels":["N1","P1"],"fields":{"判定":"ZnO4/SiO4 连接、stuffed-tridymite、焦硅酸根或相关 Ba–Zn–Si 网络有结构鉴定；元素集合相似但结构距离高于 B1/B2。","用途":"用于 Zn 挥发、ZnO4 网络形成、烧结和晶型转变的工艺类比；不能证明这些相与目标相同构。"},"keys":["liu1993structures","lin1999phase","kaiser2002crystal","zou2021crystal","ababaikeri2024ba3zn4si4o15","cai2024optimized","gorelova2016thermal"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_B4","type":"leaf","stage":1,"label":"B4 Y–Si–O 多型与高温结构对照","levels":["P1"],"fields":{"判定":"Y2SiO5/Y2Si2O7 或稀土硅酸盐的多型、熔体生成和结构修订证据。","用途":"解释 Y–Si–O 竞争相与高温多型，不列为目标结构近邻。"},"keys":["christensen1994investigation","dolan2008structures","redhammer2003beta","becerro2004revisiting","becerro2004revision","sun2014recent","felsche1973the"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_B5","type":"leaf","stage":1,"label":"B5 Ba–Si–O 框架负对照","levels":["P1","X"],"fields":{"判定":"Ba 硅酸盐中不同链、层、benitoite 或高压网络已有结构数据，但缺 Y/Zn 位点对应关系。","用途":"界定“组成相近不等于结构近邻”，并提示硅酸根聚合度和压力路径会改变结构终点。"},"keys":["finger1995refinement","hazen1999crystal","tillmanns1978refinement","katscher1973the","zhong2020combining","yusa2007rhombohedral","gorelova2016thermal"],"src":"证据包 notes/taxonomy.md §2"},{"id":"B_C","type":"branch","stage":1,"label":"C 组成替代关系","text":"组成替代关系","src":"证据包 notes/taxonomy.md §2"},{"id":"L_C1","type":"leaf","stage":1,"label":"C1 Ba/Y/O 非整比与目标附近组成窗口","levels":["D1"],"fields":{"判定":"直接改变或重审 Ba/Y/O 化学计量、x 范围、位点占据或相场。","迁移价值":"最高；用于设计目标式附近的小步长组成矩阵，但 Zn 维度仍无独立系列证据。"},"keys":["kolitsch2009crystal","wierzbickawieczorek2017high","yamane2024synthesis","yamane2024microstructure","gulay2024navigation"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_C2","type":"leaf","stage":1,"label":"C2 Ba 位的 Ba↔Sr 替代","levels":["N1","P1"],"fields":{"判定":"Ba–Zn 硅酸盐固溶或玻璃陶瓷中以 Sr 系统替换 Ba，并有结构/热膨胀证据。","边界":"属于 BaZn2Si2O7 派生体系，不能直接推定 B1 主谱系的 Sr 容限。"},"keys":["thieme2015ba1","thieme2017variable","thieme2016negative","thieme2022solid"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_C3","type":"leaf","stage":1,"label":"C3 Zn 位的 Zn↔Mg/Co 替代","levels":["N1","P1"],"fields":{"判定":"Ba–M–Si–O 中 M = Zn/Mg/Co 的同型、固溶或结构/热稳定性比较。","迁移价值":"用于选择 Zn 位扰动范围和监测晶型变化；因主结构不同，权重低于 C1。"},"keys":["liu1993structures","kerstan2012thermal","aitasalo2006crystal","kerstan2013bazn2si2o7","zhao2026crystal","thieme2022solid"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_C4","type":"leaf","stage":1,"label":"C4 稀土/痕量激活离子扰动","levels":["P1"],"fields":{"判定":"稀土正硅酸盐系列或 Ba/Zn/Y 硅酸盐中的 RE/过渡金属掺杂，且实验涉及晶体生长、固相反应或结构/成分表征。","边界":"只支持“掺杂会引入新的配比、分凝或价态控制问题”这一工艺框架，不支持目标相具体掺杂限度。"},"keys":["felsche1973the","tejas2024structural","pires2001luminescence","alizadeh2021spectroscopy","shoudu1999czochralski","brandle1986czochralski"],"src":"证据包 notes/taxonomy.md §2"},{"id":"B_D","type":"branch","stage":1,"label":"D 合成与晶体生长路线","text":"合成与晶体生长路线","src":"证据包 notes/taxonomy.md §2"},{"id":"L_D1","type":"leaf","stage":1,"label":"D1 外加助熔剂的高温溶液/助熔生长","levels":[],"fields":{"判定":"相从外加助熔/矿化介质中结晶；包括 MoO3 类助熔体系、含氟/含铅熔盐或论文明确称 high-temperature solution 的实验。","必录字段":"原料摩尔比、助熔剂/矿化剂及其比例、开放/封闭体系、坩埚、峰值温度、保温、降温速率、洗涤/分离和晶体尺寸。"},"keys":["ababaikeri2024ba5y12zn","kolitsch2009crystal","wierzbickawieczorek2017high","ababaikeri2024ba3zn4si4o15","leonyuk1999high","giess1982zn2sio4"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_D2","type":"leaf","stage":1,"label":"D2 自熔、熔体自发结晶与无坩埚熔制","levels":[],"fields":{"判定":"不把外加助熔剂作为主导介质，由反应物自熔、熔体自发成核或无坩埚熔制形成晶相。","必录字段":"液相组成、最高温度、熔体均化、成核方式、容器接触、冷却程序与玻璃/晶相竞争。"},"keys":["yamane2024synthesis","gulay2024navigation","christensen1994investigation","leonyuk1999high","leonyuk1999crystal"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_D3","type":"leaf","stage":1,"label":"D3 传统固相反应与陶瓷烧结","levels":[],"fields":{"判定":"氧化物/碳酸盐等粉体经混合、煅烧、压制、烧结或复烧形成块体/粉体。","必录字段":"试剂与纯度、预处理、名义配比、湿/干混与介质、压片、温度—时间、复磨复烧、气氛、坩埚和冷却。"},"keys":["yamane2024synthesis","yamane2024microstructure","lin1999phase","zou2021crystal","kerstan2012thermal","cai2024optimized","zou2019anti","tejas2024structural","pires2001luminescence","zhao2026crystal","kerstan2015kristallphasen"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_D4","type":"leaf","stage":1,"label":"D4 机械化学与固液辅助预活化","levels":[],"fields":{"判定":"高能球磨或固液相辅助步骤实质改变反应性/成相温度，而非普通混匀。","边界":"需要同时记录研磨材质与污染；行星球磨的结果不能与普通玛瑙研钵处理合并比较。"},"keys":["yamane2024microstructure","yldrm2009y2sio5","tzvetkov2001effects"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_D5","type":"leaf","stage":1,"label":"D5 Czochralski 熔体提拉","levels":[],"fields":{"判定":"射频加热、坩埚熔体、籽晶/提拉形成 Y2SiO5 或稀土正硅酸盐晶体。","迁移边界":"仅作为高温熔体稳定性、SiO2 挥发、Ir 坩埚与气氛控制的 P1 对照；当前没有目标相 Czochralski 证据。"},"keys":["pang2005study","alizadeh2021spectroscopy","shoudu1999czochralski","brandle1986czochralski"],"src":"证据包 notes/taxonomy.md §2"},{"id":"B_E","type":"branch","stage":1,"label":"E 温度、时间、气氛、坩埚与矿化剂变量","text":"温度、时间、气氛、坩埚与矿化剂变量","src":"证据包 notes/taxonomy.md §2"},{"id":"L_E1","type":"leaf","stage":1,"label":"E1 起始配比、试剂形态与挥发补偿","levels":[],"fields":{"判定":"主张针对名义组成、试剂形态/纯度、过量补偿或组成扫描。","对照重点":"BaCO3/氧化物来源、Zn/Si 挥发、x 步长、称量后与烧后组成差异。"},"keys":["wierzbickawieczorek2017high","yamane2024synthesis","yamane2024microstructure","lin1999phase","zou2021crystal","shoudu1999czochralski"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_E2","type":"leaf","stage":1,"label":"E2 温度—时间、复磨复烧与升降温程序","levels":[],"fields":{"判定":"主张针对峰值温度、保温时长、升降温速率、中间研磨或重复热处理。","现有可抽取锚点":"近邻固相工作覆盖约 1000–1475 °C、数小时及中间复磨；这些数值是路线对照，不是目标相窗口。"},"keys":["wierzbickawieczorek2017high","yamane2024microstructure","lin1999phase","zou2021crystal","kerstan2012thermal","tejas2024structural","kerstan2015kristallphasen"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_E3","type":"leaf","stage":1,"label":"E3 开放体系、氧化/还原气氛与气流","levels":[],"fields":{"判定":"主张针对 open system、空气、O2、N2 或还原性混合气氛。","对照重点":"Zn 挥发/价态、坩埚氧化、相稳定性及开放体系的物质损失。"},"keys":["ababaikeri2024ba5y12zn","ababaikeri2024ba3zn4si4o15","zou2019anti","tejas2024structural","pang2005study"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_E4","type":"leaf","stage":1,"label":"E4 坩埚、助熔剂/矿化剂与研磨介质","levels":[],"fields":{"判定":"主张针对 MoO3/钼酸盐、含氟/含铅助熔剂、Ir/Al2O3 等坩埚或研磨介质。","对照重点":"容器相容性、助熔剂残留、Pb/F 危害与废物分流、玛瑙/球磨介质带入 SiO2。"},"keys":["kolitsch2009crystal","wierzbickawieczorek2017high","pang2005study","shoudu1999czochralski","giess1982zn2sio4","tejas2024structural"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_E5","type":"leaf","stage":1,"label":"E5 冷却、成核、提拉与晶体分离","levels":[],"fields":{"判定":"主张针对慢冷、分段炉冷、自发成核、籽晶提拉、晶体洗涤或机械分离。","对照重点":"晶体尺寸与降温速率的对应关系；当前证据内 giess1982zn2sio4 给出 1300→960 °C、1 °C h−1 的明确类比，但它使用含铅/含氟体系，迁移等级低。"},"keys":["ababaikeri2024ba5y12zn","zou2021crystal","pang2005study","leonyuk1999high","shoudu1999czochralski","giess1982zn2sio4"],"src":"证据包 notes/taxonomy.md §2"},{"id":"B_F","type":"branch","stage":1,"label":"F 相纯度、结构与产物表征","text":"相纯度、结构与产物表征","src":"证据包 notes/taxonomy.md §2"},{"id":"L_F1","type":"leaf","stage":1,"label":"F1 单晶/先进衍射的身份确认","levels":[],"fields":{"判定":"SCXRD、CRED、同步辐射 PXRD 或中子精修承担规范式、空间群、位点占据或调制结构确认。","成功标准":"不能只凭峰位相似或功能性能认相；应报告结构模型、拟合质量和组成约束。"},"keys":["ababaikeri2024ba5y12zn","kolitsch2009crystal","yamane2024synthesis","gulay2024navigation","motozawa2022bay16si4o33","zou2021crystal"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_F2","type":"leaf","stage":1,"label":"F2 PXRD/Rietveld 的批量相纯度与杂相审计","levels":[],"fields":{"判定":"粉末衍射或 Rietveld 用于批量相含量、晶型或次生相判断。","成功标准":"报告未索引峰、相分数/检出限和热处理历史；“主相出现”不等于“相纯”。"},"keys":["yamane2024microstructure","gulay2024navigation","lin1999phase","zou2021crystal","kerstan2012thermal","cai2024optimized"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_F3","type":"leaf","stage":1,"label":"F3 元素组成、显微结构与污染追踪","levels":[],"fields":{"判定":"EDS/EDX、元素分析、SEM/显微镜或烧前后组成用于验证位点化学、晶粒与外来污染。","成功标准":"把名义配比、局域点分析和体平均分开；尤其审计玛瑙研磨导致的 SiO2 污染。"},"keys":["yamane2024microstructure","gulay2024navigation","thieme2015ba1","tejas2024structural","pang2005study"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_F4","type":"leaf","stage":1,"label":"F4 高温相稳定性、热分析与气氛耐受","levels":[],"fields":{"判定":"HT-XRD、热分析、膨胀测量或多气氛烧结用于界定转变/分解边界。","成功标准":"区分室温回收相与原位高温相，不能把可逆高温结构直接当成冷却后产品。"},"keys":["lin1999phase","kerstan2012thermal","kerstan2013bazn2si2o7","thieme2016negative","zou2019anti"],"src":"证据包 notes/taxonomy.md §2"},{"id":"B_G","type":"branch","stage":1,"label":"G 失败模式与适用边界","text":"失败模式与适用边界","src":"证据包 notes/taxonomy.md §2"},{"id":"L_G1","type":"leaf","stage":1,"label":"G1 配比偏离导致竞争相、玻璃或宽相场","levels":[],"fields":{"判定":"系统组成扫描或重复实验直接显示杂相、玻璃区、非整比宽度或相竞争。","含义":"不存在一个可脱离组成坐标的“单点万能温度”；配方必须和相场/相纯度结果绑定。"},"keys":["wierzbickawieczorek2017high","yamane2024synthesis","yamane2024microstructure","gulay2024navigation","tzvetkov2001effects"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_G2","type":"leaf","stage":1,"label":"G2 研磨污染、挥发与助熔剂副作用","levels":[],"fields":{"判定":"原料/介质损失、研磨介质带入、SiO2 挥发或助熔剂改变晶体形貌/纯度。","含义":"配比偏差应先排除工艺污染和挥发，不应一律解释成真实固溶。"},"keys":["yamane2024microstructure","shoudu1999czochralski","tzvetkov2001effects","giess1982zn2sio4"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_G3","type":"leaf","stage":1,"label":"G3 气氛诱导变化与热致晶型边界","levels":[],"fields":{"判定":"气氛、温度或取代使晶型、相稳定性或还原耐受发生变化。","含义":"空气中成功的 Ba–Zn 对照配方不能无条件迁移至还原气氛；高温原位相也不能等同于室温相。"},"keys":["lin1999phase","kerstan2012thermal","kerstan2013bazn2si2o7","thieme2016negative","zou2019anti"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_G4","type":"leaf","stage":1,"label":"G4 当前证据边界内实验字段不完整","levels":[],"fields":{"判定":"papers.jsonl 的摘要/检索证据只确认路线或结构，未同时暴露配比、温度、时间、气氛、坩埚和冷却全字段。","含义":"这是“当前证据包不完整”，不是断言原论文没有细节。进入后续阶段前需回到原始实验部分补齐；本阶段不得猜值。"},"keys":["ababaikeri2024ba5y12zn","ababaikeri2024ba3zn4si4o15","kaiser2002crystal","cai2024optimized","zhao2026crystal"],"src":"证据包 notes/taxonomy.md §2"},{"id":"B_H","type":"branch","stage":1,"label":"H 可迁移配方篮子（比较框架，不是实验建议）","text":"可迁移配方篮子（比较框架，不是实验建议）","src":"证据包 notes/taxonomy.md §2"},{"id":"L_H1","type":"leaf","stage":1,"label":"H1 D0 目标相复现起点：直接证据稀缺","levels":[],"fields":{"纳入":"只收精确含 Zn 目标相的原始高温溶液路线。","用法":"作为唯一直接起点；在实验段完整字段未抽取前，不输出具体推荐配方。"},"keys":["ababaikeri2024ba5y12zn"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_H2","type":"leaf","stage":1,"label":"H2 D1 同一 Ba–Y 身份谱系的组成—路线矩阵","levels":[],"fields":{"纳入":"MoO3 助熔、系统 151-run 参数筛选、非整比组成扫描、陶瓷复现和独立相场确认。","可迁移内容":"组成步长、相场设计、杂相审计和结构核验流程；不能把无 Zn 配比直接改名为目标配方。"},"keys":["kolitsch2009crystal","wierzbickawieczorek2017high","yamane2024synthesis","yamane2024microstructure","gulay2024navigation"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_H3","type":"leaf","stage":1,"label":"H3 N1/P1 高温溶液与助熔生长工具箱","levels":[],"fields":{"纳入":"Ba–Y、Ba–Zn 或 Y–Si–O 结构/工艺近邻的外加助熔和慢冷条件。","可迁移内容":"变量表结构、慢冷/分离策略和助熔剂筛选方法；具体温度与 Pb/F 助熔剂不直接迁移。"},"keys":["kolitsch2009crystal","wierzbickawieczorek2017high","ababaikeri2024ba3zn4si4o15","leonyuk1999high","leonyuk1999crystal","giess1982zn2sio4"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_H4","type":"leaf","stage":1,"label":"H4 N1/P1 固相成相与相纯度筛选工具箱","levels":[],"fields":{"纳入":"组成系列、复磨复烧、温度窗口、多气氛烧结及 PXRD/EDS 审计。","可迁移内容":"小步长配比 × 温度 × 气氛的筛选设计，以及主相/杂相判据；近邻的数值窗口只能作为下限/上限探索的参考。"},"keys":["yamane2024synthesis","yamane2024microstructure","lin1999phase","zou2021crystal","kerstan2012thermal","cai2024optimized","zou2019anti","tejas2024structural"],"src":"证据包 notes/taxonomy.md §2"},{"id":"L_H5","type":"leaf","stage":1,"label":"H5 P1 熔体提拉与挥发控制工具箱","levels":[],"fields":{"纳入":"Y2SiO5/稀土正硅酸盐的 Czochralski 原料预烧、Ir 坩埚、保护气氛、提拉和后退火。","可迁移内容":"高温熔体稳定性和挥发/坩埚控制清单；当前不支持把目标相改走 Czochralski 路线。"},"keys":["pang2005study","alizadeh2021spectroscopy","shoudu1999czochralski","brandle1986czochralski"],"src":"证据包 notes/taxonomy.md §2"},{"id":"P_ababaikeri2024ba5y12zn","type":"paper","stage":1,"key":"ababaikeri2024ba5y12zn","label":"Ababaikeri et al. 2024","title":"Ba<sub>5</sub>Y<sub>12</sub>Zn[O(SiO<sub>4</sub>)]<sub>8</sub>: a novel non-centrosymmetric silicate with a short ultraviolet cut-off edge featuring [ZnSi<sub>4</sub>O<sub>16</sub>] and [SiO<sub>4</sub>] units","year":"2024","venue":"New Journal of Chemistry","doi":"10.1039/D3NJ04480G","url":"https://doi.org/10.1039/D3NJ04480G","authors":"Aihaimaitijiang Ababaikeri and Xueting Pan and Gulimeikereyi Tuniyazi and Xiangzhan Jiang and Yanhui Z 温正交相，适合支撑“原位高温相不等于冷却回收相”的边界。","trace":[]},{"key":"kerstan2013bazn2si2o7","strength":"strong","fulltext":true,"note":"高温 XRD 跟踪 BaZn2−xCoxSi2O7 的 Zn/Co 固溶系列相稳定性，可支撑取代量与热稳定性必须联动报告。","trace":[]},{"key":"zou2019anti","strength":"weak","fulltext":true,"note":"Ba2ZnSi2O7 陶瓷的抗还原与介电损耗研究可作为气氛耐受的 P1 对照，不能证明目标相在还原条件下稳定。","trace":[]}],"src":"证据包 claim_evidence.jsonl"},{"id":"T_gaps","type":"tree","stage":4,"label":"证据缺口（8）","text":"taxonomy §5：现有证据边界内尚未闭合的问题；每条缺口都是下一轮检索或实验的入口。","src":"证据包 notes/taxonomy.md §5"},{"id":"GAP01","type":"gap","stage":4,"label":"D0 独立复现缺口","text":"精确 Ba5Y12Zn[O(SiO4)]8 只有一个通过闸门的直接 key；尚不能判断报道式与 Ba–Y 四方谱系是取代、共生、误指认还是不同相。","src":"证据包 notes/taxonomy.md §5"},{"id":"GAP02","type":"gap","stage":4,"label":"完整配方字段缺口","text":"目标相 D0 的当前摘要只确认开放体系高温溶液法与 SCXRD，未在允许证据包中同时给出原料比、助熔剂、峰值温度、保温、坩埚和冷却程序。","src":"证据包 notes/taxonomy.md §5"},{"id":"GAP03","type":"gap","stage":4,"label":"结构可比性缺口","text":"Ba–Zn–Si、Y–Si–O 与 Ba–Si–O 多数只是 N1/P1 对照；缺少统一拓扑描述符、位点映射或定量结构距离，不能笼统称“同构”。","src":"证据包 notes/taxonomy.md §5"},{"id":"GAP04","type":"gap","stage":4,"label":"Zn 取代系列缺口","text":"D1 文献系统扫描 Ba/Y/O 非整比，但没有至少三篇直接建立 Zn 在四方 Ba–Y 主谱系中固溶范围与占位的证据。","src":"证据包 notes/taxonomy.md §5"},{"id":"GAP05","type":"gap","stage":4,"label":"水热/溶剂热空白","text":"当前通过闸门的引用池没有目标或 N1 近邻的水热/溶剂热制备证据。","src":"证据包 notes/taxonomy.md §5"},{"id":"GAP06","type":"gap","stage":4,"label":"相纯窗口与重复性缺口","text":"虽有 Ba–Y 组成扫描、独立结构精修和陶瓷过程比较，但精确 D0 尚无跨实验室、同配方的相纯复现。","src":"证据包 notes/taxonomy.md §5"},{"id":"GAP07","type":"gap","stage":4,"label":"关键工艺字段缺口","text":"气氛、坩埚、冷却速率和产率在多条记录中缺失；缺失应记 NA/未报告，不能从相似路线推测。","src":"证据包 notes/taxonomy.md §5"},{"id":"GAP08","type":"gap","stage":4,"label":"安全迁移缺口","text":"含 Pb/F 助熔条件只能作为历史工艺对照；在 EHS、坩埚相容性和废物分流未审核前，不应转写成推荐方案。","src":"证据包 notes/taxonomy.md §5"},{"id":"T_recipe","type":"tree","stage":4,"label":"RECIPE 前驱体预测","text":"两步无机逆合成 MCP（goai-retro）：Stage 1 单前驱体检索 → 化学硬过滤 → Stage 2 组合重排；每个目标取 Top-5，枚举 4928 个 2–5 元组合。所有路线 chemical_route_verified=false，是模型排序，不是实验验证。","src":"正式案例 ideas/precursor_predictions.md；tool_calls.jsonl"},{"id":"RC_Ba5Y12ZnSi8O40_1","type":"recipe","stage":4,"label":"ZnO + Y<sub>2</sub>O<sub>3</sub> + SiO<sub>2</sub> + BaCO<sub>3</sub>","rank":1,"p":0.5941,"target":"cmp_target","top":true,"note":"只有排名 1 同时具有较高组合概率和常规、可解释的氧化物/碳酸盐原料集合。排名 2--5 包含冗余 Ba 源、含氟盐、非常规数据库标签或低概率附加物，只保留为模型失效模式与候选池诊断；其中 BaF2 还会引入额外 EHS 与坩埚相容性问题。","src":"正式案例 ideas/precursor_predictions.md"},{"id":"RC_Ba5Y12ZnSi8O40_2","type":"recipe","stage":4,"label":"ZnO + Y<sub>2</sub>O<sub>3</sub> + SiO<sub>2</sub> + BaCO<sub>3</sub> + BaO","rank":2,"p":0.0302,"target":"cmp_target","top":false,"note":"","src":"正式案例 ideas/precursor_predictions.md"},{"id":"RC_Ba5Y12ZnSi8O40_3","type":"recipe","stage":4,"label":"ZnO + Y<sub>2</sub>O<sub>3</sub> + SiO<sub>2</sub> + BaCO<sub>3</sub> + BaF<sub>2</sub>","rank":3,"p":0.0211,"target":"cmp_target","top":false,"note":"","src":"正式案例 ideas/precursor_predictions.md"},{"id":"RC_Ba5Y12ZnSi8O40_4","type":"recipe","stage":4,"label":"ZnO + Y<sub>2</sub>O<sub>3</sub> + SiO<sub>2</sub> + BaCO<sub>3</sub> + SiH<sub>2</sub>O<sub>3</sub>","rank":4,"p":0.0151,"target":"cmp_target","top":false,"note":"","src":"正式案例 ideas/precursor_predictions.md"},{"id":"RC_Ba5Y12ZnSi8O40_5","type":"recipe","stage":4,"label":"ZnO + Y<sub>2</sub>O<sub>3</sub> + SiO<sub>2</sub> + BaCO<sub>3</sub> + Ba(NO<sub>3</sub>)<sub>2</sub>","rank":5,"p":0.0132,"target":"cmp_target","top":false,"note":"","src":"正式案例 ideas/precursor_predictions.md"},{"id":"RC_Ba5Y12MgSi8O40_1","type":"recipe","stage":4,"label":"Y<sub>2</sub>O<sub>3</sub> + BaCO<sub>3</sub> + SiO<sub>2</sub> + MgO","rank":1,"p":0.522,"target":"cmp_mg_target","top":true,"note":"排名 1 明显优于其余组合。Mg 类比实验若开展，应以 MgO 作为首选 Mg 源；MgCO3 只适合作为单独的前驱体形态对照，不与 MgO 同时加入。","src":"正式案例 ideas/precursor_predictions.md"},{"id":"RC_Ba5Y12MgSi8O40_2","type":"recipe","stage":4,"label":"Y<sub>2</sub>O<sub>3</sub> + BaCO<sub>3</sub> + SiO<sub>2</sub> + Mg<sub>5</sub>H<sub>2</sub>(C<sub>2</sub>O<sub>7</sub>)<sub>2</sub>","rank":2,"p":0.0316,"target":"cmp_mg_target","top":false,"note":"","src":"正式案例 ideas/precursor_predictions.md"},{"id":"RC_Ba5Y12MgSi8O40_3","type":"recipe","stage":4,"label":"Y<sub>2</sub>O<sub>3</sub> + BaCO<sub>3</sub> + SiO<sub>2</sub> + MgCO<sub>3</sub>","rank":3,"p":0.0302,"target":"cmp_mg_target","top":false,"note":"","src":"正式案例 ideas/precursor_predictions.md"},{"id":"RC_Ba5Y12MgSi8O40_4","type":"recipe","stage":4,"label":"Y<sub>2</sub>O<sub>3</sub> + BaCO<sub>3</sub> + SiO<sub>2</sub> + MgO + BaO","rank":4,"p":0.0279,"target":"cmp_mg_target","top":false,"note":"","src":"正式案例 ideas/precursor_predictions.md"},{"id":"RC_Ba5Y12MgSi8O40_5","type":"recipe","stage":4,"label":"Y<sub>2</sub>O<sub>3</sub> + BaCO<sub>3</sub> + SiO<sub>2</sub> + MgO + MgCO<sub>3</sub>","rank":5,"p":0.0269,"target":"cmp_mg_target","top":false,"note":"","src":"正式案例 ideas/precursor_predictions.md"},{"id":"RC_Ba5Y12CoSi8O40_1","type":"recipe","stage":4,"label":"Y<sub>2</sub>O<sub>3</sub> + BaCO<sub>3</sub> + SiO<sub>2</sub> + Co<sub>3</sub>O<sub>4</sub>","rank":1,"p":0.2978,"target":"cmp_co_target","top":true,"note":"Co 的前三条路线反映氧化态不确定性，而不是三条等价处方。若用 Co 作为位点/价态探针，必须把氧分压、烧前后 Co 价态与相组成联合测量；正文只把 Co3O4 作为空气条件下的首个模型候选，不把排序解释为热力学稳定性。","src":"正式案例 ideas/precursor_predictions.md"},{"id":"RC_Ba5Y12CoSi8O40_2","type":"recipe","stage":4,"label":"Y<sub>2</sub>O<sub>3</sub> + BaCO<sub>3</sub> + SiO<sub>2</sub> + CoO","rank":2,"p":0.0953,"target":"cmp_co_target","top":false,"note":"","src":"正式案例 ideas/precursor_predictions.md"},{"id":"RC_Ba5Y12CoSi8O40_3","type":"recipe","stage":4,"label":"Y<sub>2</sub>O<sub>3</sub> + BaCO<sub>3</sub> + SiO<sub>2</sub> + Co<sub>2</sub>O<sub>3</sub>","rank":3,"p":0.089,"target":"cmp_co_target","top":false,"note":"","src":"正式案例 ideas/precursor_predictions.md"},{"id":"RC_Ba5Y12CoSi8O40_4","type":"recipe","stage":4,"label":"Y<sub>2</sub>O<sub>3</sub> + BaCO<sub>3</sub> + SiO<sub>2</sub> + CoCO<sub>3</sub>","rank":4,"p":0.0375,"target":"cmp_co_target","top":false,"note":"","src":"正式案例 ideas/precursor_predictions.md"},{"id":"RC_Ba5Y12CoSi8O40_5","type":"recipe","stage":4,"label":"Y<sub>2</sub>O<sub>3</sub> + BaCO<sub>3</sub> + SiO<sub>2</sub> + Co<sub>3</sub>O<sub>4</sub> + BaO","rank":5,"p":0.0167,"target":"cmp_co_target","top":false,"note":"","src":"正式案例 ideas/precursor_predictions.md"},{"id":"T_dir","type":"tree","stage":4,"label":"优先实验方向（4）","text":"由既有证据和模型候选共同提出，均为实验假设；按\"局部相图 → 占位 / 氧计量 → 晶体生长 → 类比替代\"的顺序推进。","src":"正式案例 ideas/experiment_directions.md；最终输出 §8"},{"id":"DIR_D1","type":"direction","stage":4,"label":"方向 1 · 围绕目标组成建立局部相图","text":"以 BaCO3、Y2O3、ZnO 和 SiO2 为基础前驱体，在目标组成附近同时改变 Ba/Y 比和 Zn 含量，形成二维小步长组成网格。先用与已发表无 Zn 固相工作同量级的分段煅烧、复磨与高温退火作筛查，再以 PXRD/Rietveld 和 EDS/EPMA 记录每个坐标的主相、杂相与实际组成。出现玻璃或多相交界时，加密而非跨越该区域。该实验直接回答目标相是否存在可重复的批量相区，以及它与 Ba5Y13[SiO4]8O8.5 / BaxY26Si16O71+x 谱系如何连接。","src":"正式案例 ideas/experiment_directions.md"},{"id":"DIR_D2","type":"direction","stage":4,"label":"方向 2 · Zn--Y--氧空位耦合系列","text":"围绕 Ba--Y 四方谱系设计 Zn 含量的细步长系列，但不预设 Zn 一定替代某一 Y 位。名义组成、烧后总组成、单晶占位与氧含量应分别报告。至少采用 PXRD/Rietveld、EPMA/ICP、必要时中子衍射或价态/氧含量测量。目标是辨别“有限固溶—独立线化合物—两相共存”三种情形，而不是只寻找一条可长晶的配方。","src":"正式案例 ideas/experiment_directions.md"},{"id":"DIR_D3","type":"direction","stage":4,"label":"方向 3 · 固相成相与高温溶液长晶并行","text":"固相路线回答批量相区，高温溶液路线回答结构身份与单晶质量，二者不应互相替代。晶体生长支线可参考 Ba--Y--Si--O 中 MoO3 助熔变量的系统研究，但必须重新扫描营养物/助熔比与冷却速率。Pt 或 Au 坩埚、熔体/助熔剂、保温—慢冷程序和单晶终点同时出现时，才可把记录判为晶体生长；只有贵金属容器本身不能排除高温陶瓷处理。建议先做空白坩埚相容性与质量损失测试，再比较 Pt/Au 对成核、污染和物质损失的影响。","src":"正式案例 ideas/experiment_directions.md"},{"id":"DIR_D4","type":"direction","stage":4,"label":"方向 4 · Mg/Co 替代作为结构与价态探针","text":"MCP 为 Zn、Mg、Co 三个目标给出的首选前驱体共享 BaCO3 + Y2O3 + SiO2，并分别采用 ZnO、MgO、Co3O4。Mg2+ 可作为同价、弱氧化态耦合的尺寸对照；Co 则适合检验价态和氧分压敏感性。两者都应先作为小规模成相筛查，只有获得新相且结构与组成证据闭合后，才进入性质测量。","src":"正式案例 ideas/experiment_directions.md"},{"id":"T_wf","type":"tree","stage":4,"label":"OpenLab 自动化工作流（仿真）","text":"A-Lab 数字孪生（Isaac Sim）里的五条实验工作流：22 个任务、158 个机器人原语、28 项 SafeLab USD 资产、9 条文献依据。全部为仿真，不是实体实验。","src":"站点 showcase.html 页首统计；final_round/05_alab_twin.md"},{"id":"WF_wf01","type":"workflow","stage":4,"label":"wf01 固相煅烧","text":"BaZn₂Si₂O₇ 的碳酸盐 / 氧化物固相煅烧：A 站配料 → 研磨装坩埚 → B 站马弗炉","src":"站点 showcase.html · 五条自动化实验工作流"},{"id":"WF_wf02","type":"workflow","stage":4,"label":"wf02 回收 + XRD","text":"粉体回收、装小瓶、C 站 XRD 相鉴定，把表征结果反馈给下一轮前驱体 / 温度","src":"站点 showcase.html · 五条自动化实验工作流"},{"id":"WF_wf03","type":"workflow","stage":4,"label":"wf03 湿法前驱体","text":"溶液法前驱体制备：计量、搅拌、pH 调节、离心 / 干燥","src":"站点 showcase.html · 五条自动化实验工作流"},{"id":"WF_wf04","type":"workflow","stage":4,"label":"wf04 Pt 坩埚助熔剂生长","text":"目标相 Ba₅Y₁₂Zn[O(SiO₄)]₈ 的铂坩埚高温溶液（助熔）生长","src":"站点 showcase.html · 五条自动化实验工作流"},{"id":"WF_wf05","type":"workflow","stage":4,"label":"wf05 试剂后勤与安全处置","text":"试剂柜取还、瓶口分配、废坩埚 / 废物分流；贯穿全部工作流","src":"站点 showcase.html · 五条自动化实验工作流"},{"id":"T_cases","type":"tree","stage":4,"label":"同根长出的其他调研树","text":"同一流水线、同一九道闸门，对另外三个主题的运行结果；每棵树都有自己的 ledger / 引用审计。","src":"submission/03_运行与评测包/补充案例_20260903；LLZO诊断轮"},{"id":"CASE_llzo","type":"case","stage":4,"label":"LLZO 石榴石固体电解质","topic":"LLZO garnet solid electrolytes: synthesis, densification, and processing–structure–ionic-conductivity relationships","entries":368,"gates":{"PASS":5,"WARN":2,"FAIL":2},"round":5,"src":"submission/03_运行与评测包/补充案例_20260903/01_llzo/run/ledger.json, CITATION_AUDIT.md"},{"id":"CASE_bzso","type":"case","stage":4,"label":"BaZn₂Si₂O₇ 合成与相控制","topic":"BaZn2Si2O7 synthesis and phase control as a structural analogue of Ba5Y12Zn[O(SiO4)]8","entries":32,"gates":{"PASS":6,"WARN":3},"round":2,"src":"submission/03_运行与评测包/补充案例_20260903/02_bazn2si2o7/run/ledger.json, CITATION_AUDIT.md"},{"id":"CASE_phase","type":"case","stage":4,"label":"Ba–Y–Zn–Si–O 相图导向合成","topic":"Phase-diagram-guided synthesis of Ba–Y–Zn–Si–O silicates: unresolved phase-purity and metastability bottlenecks","entries":513,"gates":{"PASS":9},"round":3,"src":"submission/03_运行与评测包/补充案例_20260903/03_bayznsi_o_phase_diagram/run/ledger.json, CITATION_AUDIT.md"},{"id":"CASE_llzo_diag","type":"case","stage":4,"label":"LLZO 诊断轮","topic":"LLZO syn     case 'paper': h += `<h2>${n.title}</h2><p><span class="tag" style="background:${LVL[n.level]}">${n.level}</span>${G.meta.levels[n.level]} · <span class="tag ${n.strength==='strong'?'tele':'grey'}">${n.strength==='strong'?'强支撑':'弱支撑'}</span>${n.fulltext?'<span class="tag ok">全文在包内</span>':''}</p>${kv([['作者',esc(n.authors)],['年份 · 刊物',`${esc(n.year)} · ${esc(n.venue)}`],['DOI',n.doi?`<a href="${n.url}" target="_blank" rel="noopener">${esc(n.doi)}</a>`:(n.url?`<a href="${n.url}" target="_blank" rel="noopener">链接</a>`:'—')],['BibTeX key',`<code>${n.key}</code>`]])}${n.abstract?`<p style="color:var(--muted)">${esc(n.abstract).slice(0,420)}${n.abstract.length>420?'…':''}</p>`:''}`; break;
    case 'compound': h += `<h2>${n.label}</h2><p><span class="tag" style="background:${LVL[n.level]}">${n.level}</span>${G.meta.levels[n.level]}</p><p>${esc(n.note)}</p>`; break;
    case 'route': h += `<h2>${esc(n.label)}</h2><p>${esc(n.note)}</p>`; break;
    case 'element': h += `<h2>${esc(n.label)}</h2><p>${n.core?'<span class="tag">目标相组成元素</span>':'<span class="tag grey">替代 / 助熔 / 对照元素</span>'}</p><p>${esc(n.note)}</p>`; break;
    case 'record': h += `<h2>条件记录 ${n.label}</h2><p><span class="tag ${n.zone.startsWith('A')?'heat':(n.zone.startsWith('B')?'gold':'tele')}">${esc(n.zone)}</span></p>${kv([['来源与定位',n.source],['目标 / 产物',n.product],['原料 · 配比 · 前处理',n.inputs],['合成方法',n.method],['与目标相关系',n.relation],['温度 – 时间',n.temp_time],['气氛 / 体系',n.atmosphere],['坩埚与助熔',n.crucible_flux],['冷却 / 生长',n.cooling],['产物与表征',n.product_char],['未明确记载',n.missing]])}`; break;
    case 'agent': h += `<h2>${n.label}</h2><p><span class="tag gold">${n.kind}</span></p>`; break;
    case 'char': case 'failure': h += `<h2>${esc(n.label)}</h2><p>${esc(n.text||'')}</p>`; break;
    case 'section': h += `<h2>${esc(n.label)}</h2><p><span class="tag grey">${esc(n.chapter)}</span> <code>${esc(n.file)}</code></p>`; break;
    case 'claim': h += `<h2>主张 ${n.label}</h2><p>章节：${chip(n.section)}</p><div class="claimtext">${esc(n.text)}</div><h3>引用证据（${n.evidence.length}）</h3>${n.evidence.map(e=>{ const m = byId.get('P_'+e.key); return `<div class="ev"><div class="t"><span class="tag ${e.strength==='strong'?'tele':'grey'}">${e.strength==='strong'?'强':'弱'}</span>${e.fulltext?'<span class="tag ok">全文</span>':''}${m?chip(m.id):esc(e.key)}</div><div class="n">${esc(e.note)}</div>${e.trace.map(t=>`<div class="n">↳ 条件单元 <b>${esc(t.condition_cell)}</b>：${esc(t.location)}</div>`).join('')}</div>`; }).join('')}`; break;
    case 'tree': h += `<h2>${esc(n.label)}</h2><p>${esc(n.text)}</p>`; break;
    case 'gap': h += `<h2>${esc(n.label)}</h2><div class="claimtext">${esc(n.text)}</div>`; break;
    case 'recipe': { const t = byId.get(n.target); h += `<h2>${n.label}</h2><p>目标 ${chip(n.target)}</p>${kv([['排名',`#${n.rank}${n.top?' · 首选':''}`],['候选池内概率',n.p.toFixed(4)],['验证状态','<code>model_output_verified=true</code> · <code>chemical_route_verified=false</code>']])}${n.note?`<p>${esc(n.note)}</p>`:''}`; break; }
    case 'direction': h += `<h2>${esc(n.label)}</h2><p>${esc(n.text)}</p>`; break;
    case 'workflow': h += `<h2>${esc(n.label)}</h2><p>${esc(n.text)}</p><p><span class="tag ok">仿真</span>Isaac Sim 数字孪生，非实体实验。</p>`; break;
    case 'case': h += `<h2>${esc(n.label)}</h2><p style="color:var(--muted)">${esc(n.topic)}</p>${kv([['引用条目',n.entries??'—'],['闸门',Object.entries(n.gates).map(([k,v])=>`<span class="tag ${k==='PASS'?'ok':(k==='WARN'?'heat':'crit')}">${k} ${v}</span>`).join('')],['轮次',n.round??'—']])}`; break;
  }
  h += neighborHtml(n, n.type==='claim'?['cites']:[]);
  h += `<div class="src">出处：${esc(n.src)}</div>`;
  p.html(h); p.selectAll('.chip').on('click', function(){ const m = byId.get(this.dataset.id); if (m){ select(m); centerOn(m); } });
}
function showOverview(){ const s = G.meta.stats; d3.select('#panel').html(`<div class="kicker">SAGE-Mat · 知识森林</div><h2>${G.meta.subtitle}</h2>
<p>把一次调研画成一片森林：最左是研究者开始时自己的问题树；流水线从中长出<b>文献树</b>（分支 → 叶 → 文献），再把文献抽象成可复用的<b>实体主干</b>（化合物、路线、前驱体、条件记录、表征、失败模式），据此写成<b>结论树</b>并回答最初的目标；最后在结论和缺口上长出<b>新树</b>：前驱体预测、实验方向、自动化工作流和同根的其他调研。</p>
<div class="stats"><span><b>${s.papers}</b> 篇文献</span><span><b>${s.citation_calls}</b> 次引用</span><span><b>${s.claims}</b> 条主张</span><span><b>${s.leaves}</b> 个叶节点</span><span><b>${s.records}</b> 条条件记录</span><span><b>${s.compounds}</b> 个化合物 / 相</span><span><b>${s.nodes}</b> 节点 · <b>${s.edges}</b> 边</span></div>
<h3>怎么读</h3><ul style="padding-left:18px;margin:4px 0"><li>颜色 = 证据距离：<span class="tag heat">D0</span>目标相直接证据 · <span class="tag gold">D1</span>同一身份谱系 · <span class="tag tele">N1</span>晶体化学近邻 · <span class="tag" style="background:${C.blue}">P1</span>工艺近邻 · <span class="tag grey">X</span>边界 · <span class="tag purple">H</span>假设目标。</li><li>文献外圈加深 = 全文在证据包内；主张点越深 = 引用证据越强。</li><li>目标旁的小圆点：绿 = 已回答，橙 = 部分回答。</li><li>蓝 / 青 / 金 / 橙 = 文献陈述与条件记录；紫色（RECIPE 预测、实验方向、假设目标）= AI 推断，未经实验验证。</li><li>按「▶ 生长」逐层长出：已长出的层淡化，新层突出；结束后恢复。</li><li>悬停看邻接，点击固定；侧栏里的标签可继续跳转。</li></ul>
<h3>数据来源</h3><div class="src">${G.meta.built_from.map(esc).join('<br>')}</div>`); }
function centerOn(n){ const {width,height} = document.getElementById('stage').getBoundingClientRect(); const k = Math.max(0.9, d3.zoomTransform(svg.node()).k); svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(width/2 - n.x*k, height/2 - n.y*k).scale(k)); }
function fitView(animate=true){ const {width,height} = document.getElementById('stage').getBoundingClientRect(); const x0 = BANDS[0][0]-10, x1 = BANDS[Math.min(4,curStage)][1]+10, y0=-68, y1=HMAX+36; const k = Math.min(width/(x1-x0), height/(y1-y0)); const t = d3.zoomIdentity.translate((width-(x1-x0)*k)/2 - x0*k, (height-(y1-y0)*k)/2 - y0*k).scale(k); (animate?svg.transition().duration(600):svg).call(zoom.transform, t); }
// ---------- UI
const stg = d3.select('#stages'); G.meta.stages.forEach(s => stg.append('button').attr('data-i',s.i).text(`${s.i} ${s.name}`).on('click',()=>{ applyStage(s.i,true); fitView(); }));
let playing=null; stg.append('button').attr('class','play').text('▶ 生长').on('click', function(){ if (playing){ clearInterval(playing); playing=null; this.textContent='▶ 生长'; applyStage(curStage,false); return; } applyStage(0,true,true); fitView(); let i=0; this.textContent='‖ 暂停'; playing=setInterval(()=>{ i++; if (i>4){ clearInterval(playing); playing=null; this.textContent='▶ 生长'; applyStage(4,true); return; } applyStage(i,true,true); fitView(); }, 2200); });
d3.select('#fit').on('click', ()=>fitView());
d3.select('#alledges').on('change', ()=>{ applyEdgeMode(); if (pinned) highlight(pinned); });
d3.select('#q').on('input', function(){ const q = this.value.trim().toLowerCase(); if (!q){ highlight(pinned); return; } const hits = nodes.filter(n => [n.label, n.title, n.text, n.key, n.product].filter(Boolean).some(s => plain(s).toLowerCase().includes(q) || String(s).toLowerCase().includes(q))); const ids = new Set(hits.map(n=>n.id)); N.classed('dim', d=>!ids.has(d.id)).classed('hit', d=>ids.has(d.id)); E.classed('dim', true); d3.select('#panel').html(`<div class="kicker">搜索</div><h2>${hits.length} 个匹配</h2><div>${hits.slice(0,80).map(n=>chip(n.id)).join('')}</div>`); d3.select('#panel').selectAll('.chip').on('click', function(){ const m = byId.get(this.dataset.id); select(m); centerOn(m); }); }).on('keydown', function(ev){ if (ev.key==='Enter'){ const c = d3.select('#panel').select('.chip').node(); if (c){ const m = byId.get(c.dataset.id); select(m); centerOn(m); } } });
d3.select('#subtitle').text(G.meta.subtitle);
// legend
const lg = d3.select('#legend'); const item = (sw, txt) => lg.append('span').attr('class','lg').html(sw + txt);
item(`<span class="dot" style="background:${C.heat}"></span>`,'D0 目标相直接证据'); item(`<span class="dot" style="background:${C.gold}"></span>`,'D1 同一身份谱系'); item(`<span class="dot" style="background:${C.tele}"></span>`,'N1 晶体化学近邻'); item(`<span class="dot" style="background:${C.blue}"></span>`,'P1 工艺近邻'); item(`<span class="dot" style="background:${C.grey}"></span>`,'X 边界 / 排除'); item(`<span class="dot" style="background:${C.purple}"></span>`,'H 假设目标 · 紫色 = AI 推断 / 模型预测，未经实验验证');
item(`<span class="sw" style="border-color:${C.tele};background:${C.tele}"></span>`,'合成路线'); item(`<span class="sw" style="border-color:${C.tele}"></span>`,'条件记录 A/B/C 区'); item(`<span class="sw" style="border-color:${C.gold};background:#FBF6EC"></span>`,'前驱体 · 助熔 · 坩埚'); item(`<span class="sw" style="border-color:${C.crit};background:#FDECEA"></span>`,'失败模式'); item(`<span class="sw" style="border-color:${C.crit};border-style:dashed"></span>`,'证据缺口'); item(`<span class="sw" style="border-color:${C.purple};background:#F1EBFB"></span>`,'预测 / 方向'); item(`<span class="sw" style="border-color:${C.ok};background:#E8F5EE"></span>`,'工作流（仿真）');
item(`<span class="ln" style="border-color:${C.ok}"></span>`,'章节 → 回答目标'); item(`<span class="ln" style="border-color:${C.heat}"></span>`,'长出'); item(`<span class="ln" style="border-color:${C.tele}"></span>`,'支撑 / 记录'); item(`<span class="ln" style="border-color:${C.purple}"></span>`,'关联 / 候选');
lg.append('span').style('margin-left','auto').attr('class','stats').html(`<span><b>${G.meta.stats.papers}</b> 文献</span><span><b>${G.meta.stats.claims}</b> 主张</span><span><b>${G.meta.stats.records}</b> 条件记录</span><span><b>${G.meta.stats.nodes}</b> 节点</span><span><b>${G.meta.stats.edges}</b> 边</span>`);
// poster chrome
if (POSTER){ const pg = root.append('g').attr('transform',`translate(${BANDS[0][0]-10},-128)`); pg.append('text').attr('class','poster-title').text('SAGE-Mat 知识森林'); pg.append('text').attr('class','poster-sub').attr('y',24).text(G.meta.subtitle + ' · ' + `${G.meta.stats.papers} 篇文献 · ${G.meta.stats.claims} 条主张 · ${G.meta.stats.records} 条条件记录 · ${G.meta.stats.nodes} 节点`);
  const st = G.meta.stages[curStage]; pg.append('text').attr('class','poster-stage').attr('y',46).text(`STAGE ${curStage} · ${st.name}`); pg.append('text').attr('class','poster-sub').attr('x',tw(`STAGE ${curStage} · ${st.name}`,13)*1.15+14).attr('y',46).text(st.desc);
  const lgp = root.append('g').attr('transform',`translate(${BANDS[0][0]-10},${HMAX+64})`); let lx=0; [[C.heat,'D0 目标相直接证据'],[C.gold,'D1 同一身份谱系'],[C.tele,'N1 晶体化学近邻'],[C.blue,'P1 工艺近邻'],[C.grey,'X 边界 / 排除'],[C.purple,'H 假设目标 · 紫色 = AI 推断 / 预测，未验证']].forEach(([c,t])=>{ lgp.append('circle').attr('cx',lx+6).attr('cy',0).attr('r',5.5).attr('fill',c); lgp.append('text').attr('class','poster-legend').attr('x',lx+16).attr('y',4).text(t); lx += tw(t,11.5)+40; });
  lgp.append('text').attr('class','poster-legend').attr('x',lx+10).attr('y',4).text('文献外圈加深 = 全文在证据包内 · 目标旁绿点 = 已回答，橙点 = 部分回答 · 绿线 = 章节回答目标 · 橙线 = 长出新树');
}
applyStage(curStage, false, EMPH);
if (!POSTER) showOverview();
if (params.get('select') && byId.has(params.get('select'))) { const m = byId.get(params.get('select')); select(m); }
function fitPoster(){ const {width,height} = document.getElementById('stage').getBoundingClientRect(); const x0 = BANDS[0][0]-30, x1 = BANDS[4][1]+30, y0=-160, y1=HMAX+90; const k = Math.min(width/(x1-x0), height/(y1-y0)); svg.call(zoom.transform, d3.zoomIdentity.translate((width-(x1-x0)*k)/2 - x0*k, (height-(y1-y0)*k)/2 - y0*k).scale(k)); }
requestAnimationFrame(()=>{ POSTER ? fitPoster() : fitView(false); if (pinned && !POSTER) centerOn(pinned); document.title = `SAGE-Mat 知识森林 · ${nodes.length} 节点`; window.__kg = {nodes:nodes.length, edges:edges.length, H:HMAX}; });
window.addEventListener('resize', ()=>{ POSTER ? fitPoster() : fitView(false); });
</script>
