<body>
<div id="stage"><svg id="svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet"></svg></div>
<div class="ctrl" id="ctrl"><button id="play">▶ 播放</button><button id="prev">◀ 上一级</button><button id="next">下一级 ▶</button><input type="range" id="seek" min="0" max="1000" value="0"><span id="tlabel">0.0 s</span></div>
<script>
const G = /*__GRAPH_JSON__*/null;
const ICONS = /*__ICONS_JSON__*/null;
const params = new URLSearchParams(location.search);
if (params.get('movie') === '1') document.body.classList.add('movie');
const nodes = G.nodes, edges = G.edges, byId = new Map(nodes.map(n => [n.id, n]));
const adj = new Map(nodes.map(n => [n.id, []])); edges.forEach(e => { adj.get(e.s).push(e); adj.get(e.t).push(e); });
const C = {heat:'#E06A1B', heat2:'#F3A56E', tele:'#1E8FA8', tele2:'#5FB3C9', purple:'#7A4FD6', ok:'#1F9D62', crit:'#C93D2C', gold:'#B0841A', navy:'#156082', text:'#13202C', muted:'#5A6A7A', faint:'#8A97A5', line:'#D7DEE6', line2:'#BFC9D4', x:'#C5CED8', white:'#FFFFFF'};
const LVL = {D0:C.heat, D1:C.heat2, N1:C.tele, P1:C.faint, X:C.x, H:C.purple};
const TINT = {D0:'#FBDCC8', D1:'#FDEEE2', N1:'#DCEEF3', P1:'#EDF0F3', X:'#F4F6F8', H:'#ECE6F9'};
// ---------- text helpers
const SUBMAP = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','+':'₊','−':'₋','-':'₋','(':'₍',')':'₎','x':'ₓ','a':'ₐ','e':'ₑ','o':'ₒ','n':'ₙ','m':'ₘ','h':'ₕ','k':'ₖ','l':'ₗ','p':'ₚ','s':'ₛ','t':'ₜ','i':'ᵢ','r':'ᵣ','u':'ᵤ','v':'ᵥ','.':'.','/':'/'};
const SUPMAP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','−':'⁻','-':'⁻'};
const plain = h => String(h ?? '').replace(/<sub>(.*?)<\/sub>/g, (m, s) => [...s].map(c => SUBMAP[c] || c).join('')).replace(/<sup>(.*?)<\/sup>/g, (m, s) => [...s].map(c => SUPMAP[c] || c).join('')).replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/\s+/g, ' ').trim();
// widths are measured on a canvas with the page's own font stack (layout runs after document.fonts.ready)
const MCTX = document.createElement('canvas').getContext('2d'), MCACHE = new Map();
function tw(s, px, bold){ const key = (bold ? 'b' : 'r') + px + '|' + s; let w = MCACHE.get(key); if (w === undefined){ MCTX.font = `${bold ? 700 : 400} ${px}px "IBM Plex Sans","Noto Sans SC",system-ui,sans-serif`; w = MCTX.measureText(s).width; MCACHE.set(key, w); } return w; }
// ellipsis at a word boundary: "Navigation through high-di…" becomes "Navigation through …"
function fit(s, maxPx, px, bold){ if (tw(s, px, bold) <= maxPx) return s; let out = ''; for (const ch of s){ if (tw(out + ch + '…', px, bold) > maxPx) break; out += ch; } if (/[A-Za-z0-9₀-₉]$/.test(out) && /[A-Za-z0-9₀-₉]/.test(s[out.length] || '')){ const cut = out.replace(/[^\s·]+$/, ''); if (cut.trim().length >= 4) out = cut; } return out.replace(/[\s·,，、；:：]+$/, '') + '…'; }
// CJK characters break freely; Latin / formula runs and "number + unit" never split
const UNIT_TOKEN = /^(°C|K|h|d|min|s|mol%|wt%|at%|MPa|GPa|nm|µm|μm|mm|cm|kJ|篇|条)$/;
function tokens(s, px, bold, groupPx){ const out = []; let run = ''; const flush = () => { if (run){ out.push(run); run = ''; } };
  for (const ch of s){ if (/\s/.test(ch)){ flush(); out.push(' '); continue; } if (/[\u3000-\u9fff\uff00-\uffef·—…]/.test(ch)){ flush(); out.push(ch); continue; } run += ch; } flush();
  const merged = []; for (let i = 0; i < out.length; i++){ const t = out[i]; if (/[0-9]$/.test(t) && out[i + 1] === ' ' && UNIT_TOKEN.test(out[i + 2] || '')){ merged.push(t + ' ' + out[i + 2]); i += 2; } else merged.push(t); }
  if (!groupPx) return merged;

  const grouped = []; for (let i = 0; i < merged.length; i++){ const t = merged[i]; const open = t.startsWith('（') ? '）' : t.startsWith('(') ? ')' : null;
    if (open){ let j = i; while (j < merged.length && !merged[j].endsWith(open)) j++; if (j < merged.length && j > i){ const grp = merged.slice(i, j + 1).join(''); if (tw(grp, px, bold) <= groupPx){ grouped.push(grp); i = j; continue; } } }
    grouped.push(t); }
  return grouped; }
const NO_LINE_START = new Set(['→', '·', '/', '）', ')', '，', '、', '：', '；', '。', ']', '］']), NO_LINE_END = new Set(['（', '(', '[', '［', '「']);
// wrap into at most maxLines lines; only the last line may be ellipsised (and only if it still does not fit).
// The first line may be narrower than the rest (restPx) — it shares the card's top edge with the badge
function wrap(s, maxPx, px, bold, maxLines, restPx = maxPx){ s = String(s ?? '').trim(); if (!s) return []; if (tw(s, px, bold) <= maxPx) return [s];
  const lines = []; let line = []; const text = arr => arr.join('').trim(); const W = i => i === 0 ? maxPx : restPx;
  for (const t of tokens(s, px, bold, restPx)){ if (t === ' '){ if (line.length) line.push(t); continue; }
    if (line.length && tw(text([...line, t]), px, bold) > W(lines.length)){
      // a closing bracket / slash / punctuation never starts a line: it drags the previous token down with it
      const carry = [t]; if (NO_LINE_START.has(t)){ while (line.length && line[line.length - 1] === ' ') line.pop(); if (line.length) carry.unshift(line.pop()); }
      while (line.length && line[line.length - 1] === ' ') line.pop();
      if (line.length && NO_LINE_END.has(line[line.length - 1])) carry.unshift(line.pop()); // an opening bracket never ends a line
      if (line.length) lines.push(text(line)); line = carry; } else line.push(t); }

  const out = []; lines.forEach(l => { if (tw(l, px, bold) <= W(out.length)){ out.push(l); return; } let cur = '', opp = -1; for (const ch of l){ if (cur && tw(cur + ch, px, bold) > W(out.length)){ if (opp > 0){ out.push(cur.slice(0, opp)); cur = cur.slice(opp) + ch; } else { out.push(cur); cur = ch; } opp = -1; } else cur += ch; if (ch === ']' || ch === ')' || ch === '）') opp = cur.length; else if (ch === '/') opp = cur.length - 1; } if (cur) out.push(cur); });
  if (out.length > maxLines){ const rest = joinLines(out.slice(maxLines - 1)); return [...out.slice(0, maxLines - 1), fit(rest, W(maxLines - 1), px, bold)]; }
  return out; }
const joinLines = ls => ls.reduce((a, l) => a + (/[A-Za-z0-9]$/.test(a) && /^[A-Za-z0-9]/.test(l) ? ' ' : '') + l, '');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
// ---------- sectors & angles (same rules as the tree-ring page)
const SECTORS = ['A','B','C','D','E','F','G','H'];
const chapterSector = f => f.includes('00_intro') || f.includes('01_') ? 'A' : f.includes('02_') ? 'B' : f.includes('04_prior') ? 'C' : (f.includes('03_') || f.includes('04_neighbor')) ? 'D' : f.includes('05_') ? 'F' : f.includes('06_') ? 'G' : 'H';
const firstDefLeaf = n => { const e = adj.get(n.id).find(e => e.k === 'defines' && e.t === n.id); return e ? byId.get(e.s) : null; };
const leafOrder = new Map(); { let i = 0; nodes.filter(n => n.type === 'leaf').forEach(l => leafOrder.set(l.id, i++)); }
function sectorOf(n){ switch (n.type){
  case 'branch': return n.id.slice(2); case 'leaf': return n.id.slice(2, 3);
  case 'subtopic': { const e = adj.get(n.id).find(e => e.k === 'maps' && e.s === n.id); return e ? e.t.slice(2) : 'A'; }
  case 'paper': { const ls = n.leaves.slice().sort((a, b) => leafOrder.get('L_' + a) - leafOrder.get('L_' + b)); return ls.length ? ls[0][0] : 'B'; }
  case 'element': case 'compound': case 'agent': { const l = firstDefLeaf(n); if (n.type === 'agent') return 'E'; if (l) return l.id.slice(2, 3); return n.level === 'H' ? 'C' : (n.level === 'D0' || n.level === 'D1') ? 'A' : 'B'; }
  case 'route': case 'record': return 'D'; case 'char': return 'F'; case 'failure': return 'G';
  case 'section': return chapterSector(n.file); case 'claim': return chapterSector(byId.get(n.section).file);
  case 'tree': return {T_gaps:'G', T_recipe:'E', T_dir:'H', T_wf:'D', T_cases:'A'}[n.id] || 'H';
  case 'gap': return 'G'; case 'recipe': return 'E'; case 'direction': return 'H'; case 'workflow': return 'D'; case 'case': return 'A'; } return null; }
nodes.forEach(n => { n.sector = sectorOf(n); });
// ---------- levels: which nodes become cards at each step, and who their parent dot is
const LEVELS = [
  {id: 1, title: '调研主题与预期目标', pick: n => n.type === 'question' || n.type === 'subtopic', sum: '中心是研究者自己的调研主题；5 个预期目标（Q1–Q5）与 8 个 MECE 子主题是调研开始前的问题树。'},
  {id: 2, title: '文献树八分支', pick: n => n.type === 'branch', sum: '流水线按 MECE 规则把文献证据分成 A–H 八个分支；从这一级起，已展开的层收缩为圆点，分支名留在圆点旁。'},
  {id: 3, title: '叶节点', pick: n => n.type === 'leaf', sum: '每个叶节点是一类证据主张，标注证据等级（D0 直接 · D1 谱系 · N1 近邻 · P1 工艺）与支撑文献数。'},
  {id: 4, title: '文献', pick: n => n.type === 'paper', sum: '全部通过引用闸门；实心橙 = 唯一的目标相直接报道，其余按证据距离着色；卡片副标题为题名。'},
  {id: 5, title: '元素与化合物', pick: n => n.type === 'element' || (n.type === 'compound'), sum: '12 个元素与 29 个化合物 / 相，按证据等级着色；紫色虚线是 AI 假设目标，尚未合成。'},
  {id: 6, title: '合成路线', pick: n => n.type === 'route', sum: '6 条合成 / 晶体生长路线；实心青卡有文献条件记录，虚线卡是证据空白（尚无可引用的条件记录）。'},
  {id: 7, title: '条件记录', pick: n => n.type === 'record', sum: '29 条逐字段条件记录从各自的路线圆点长出（A 区目标相 · B 区无 Zn 同谱系 · C 区参照）；副标题为温度–时间。'},
  {id: 8, title: '结论 · 实验方向 · 证据缺口', pick: n => (n.type === 'claim' && n.stage === 4 && byId.get(n.section).file.includes('07_')) || n.type === 'direction' || n.type === 'gap', sum: '实心橙卡 = 综述结论；紫色虚线 = AI 拟定的实验方向；灰色虚线 = 尚未闭合的证据缺口。'},
  {id: 9, title: '长出的新树', pick: n => (n.type === 'recipe' && n.top) || n.type === 'workflow' || n.type === 'case', sum: 'RECIPE 首选前驱体组合（紫）、OpenLab 自动化工作流（深青，仿真）、同根的其他调研（案例）。'},
];
const levelOf = new Map(); LEVELS.forEach(L => nodes.filter(L.pick).forEach(n => levelOf.set(n.id, L.id)));
levelOf.set('root', 0);
const branchOf = s => byId.get('B_' + s);
function parentOf(n){ switch (n.type){
  case 'root': return null; case 'question': case 'subtopic': case 'branch': return byId.get('root');
  case 'leaf': return branchOf(n.sector);
  case 'paper': return n.leaves.length ? byId.get('L_' + n.leaves.slice().sort((a, b) => leafOrder.get('L_' + a) - leafOrder.get('L_' + b))[0]) : branchOf('B');
  case 'record': { const e = adj.get(n.id).find(e => e.k === 'route' && e.s === n.id); return e ? byId.get(e.t) : branchOf('D'); }
  case 'route': return branchOf('D');
  case 'element': case 'compound': { const l = firstDefLeaf(n); return l || branchOf(n.sector); }
  case 'claim': return branchOf('H'); case 'direction': return branchOf('H'); case 'gap': return branchOf('G');
  case 'recipe': return byId.get(n.target) || branchOf('E'); case 'workflow': return branchOf('D'); case 'case': return branchOf('A'); }
  return branchOf(n.sector || 'A'); }
// angles: spread each level's cards evenly inside their sector, sector spans weighted by the busiest level
const GAP = 3 * Math.PI / 180;
const need = {}; SECTORS.forEach(s => need[s] = 0.15);
LEVELS.forEach(L => SECTORS.forEach(s => { const c = nodes.filter(n => levelOf.get(n.id) === L.id && n.sector === s).length; need[s] = Math.max(need[s], c * 0.08 + 0.05); }));
const total = SECTORS.reduce((a, s) => a + need[s], 0), avail = 2 * Math.PI - GAP * 8;
const span = {}; { let a0 = -Math.PI / 2; SECTORS.forEach(s => { const w = need[s] / total * avail; span[s] = [a0, a0 + w]; a0 += w + GAP; }); }
const mid = s => (span[s][0] + span[s][1]) / 2;
const lvlRank = {D0:0, D1:1, N1:2, P1:3, X:4, H:5};
LEVELS.forEach(L => SECTORS.forEach(s => { const arr = nodes.filter(n => levelOf.get(n.id) === L.id && n.sector === s); if (!arr.length) return;
  arr.sort((a, b) => { const pa = parentOf(a), pb = parentOf(b); const x = ((pa && pa.a) || 0) - ((pb && pb.a) || 0); return x || (lvlRank[a.level] ?? 9) - (lvlRank[b.level] ?? 9) || String(a.label).localeCompare(String(b.label)); });
  const [lo, hi] = span[s], pad = (hi - lo) * 0.08, w = hi - lo - 2 * pad; arr.forEach((n, i) => { n.a = arr.length === 1 ? (lo + hi) / 2 : lo + pad + w * i / (arr.length - 1); }); }));
nodes.filter(n => n.type === 'question' || n.type === 'subtopic').forEach(n => { if (n.type === 'question'){ const ss = adj.get(n.id).filter(e => e.k === 'serves' && e.s === n.id).map(e => byId.get(e.t)); if (ss.length && ss.every(x => x.a !== undefined)) n.a = Math.atan2(d3.mean(ss, x => Math.sin(x.a)), d3.mean(ss, x => Math.cos(x.a))); } });
{ const qs = nodes.filter(n => n.type === 'question').sort((a, b) => a.a - b.a); for (let k = 0; k < 6; k++) for (let i = 1; i < qs.length; i++) if (qs[i].a - qs[i-1].a < 0.9) qs[i].a = qs[i-1].a + 0.9; }
const root = byId.get('root'); root.a = 0;
// ---------- card text & style per node
const short = (s, n) => { s = plain(s); return s.length > n ? s.slice(0, n) + '…' : s; };
const stripHtml = s => plain(s || '').replace(/NA/g, 'NA');
function cardSpec(n){ // returns {title, sub, badge, fill, stroke, dash, tcol, scol, w, h, big}
  const base = {w: 250, h: 56, dash: null, tcol: C.text, scol: C.muted, badgeFill: null};
  switch (n.type){
    case 'question': return {...base, title: n.label.slice(7), sub: plain(n.text), badge: 'Q' + n.id.slice(1), fill: '#fff', stroke: C.tele, sw: 2.2, tcol: C.tele, w: 330, h: 60, badgeFill: C.tele};
    case 'subtopic': return {...base, title: n.label.slice(3), sub: plain(n.text), badge: n.id, fill: '#fff', stroke: C.line2, sw: 1.5, w: 300, h: 56, badgeFill: C.faint};
    case 'branch': return {...base, title: n.label.slice(2), sub: `${nodes.filter(x => x.type === 'leaf' && x.sector === n.id.slice(2)).length} 个叶节点`, badge: n.id.slice(2), fill: C.tele, stroke: C.tele, sw: 0, tcol: '#fff', scol: '#E3F2F5', w: 250, h: 58, badgeFill: C.navy};
    case 'leaf': { const lv = n.levels.filter(l => LVL[l]); return {...base, title: n.label.replace(/^[A-H]\d /, ''), sub: `${lv.length ? lv.join(' / ') + ' · ' : ''}${n.keys.length} 篇支撑`, badge: n.id.slice(2), fill: '#E1F1F5', stroke: C.tele2, sw: 1.5, w: 240, h: 54, badgeFill: C.tele}; }
    case 'paper': { const solid = n.level === 'D0'; return {...base, title: n.label, sub: plain(n.title), badge: n.level, fill: solid ? C.heat : TINT[n.level], stroke: solid ? C.heat : LVL[n.level], sw: solid ? 0 : 1.6, tcol: solid ? '#fff' : C.text, scol: solid ? '#FDE4D4' : C.muted, w: 222, h: 54, badgeFill: solid ? C.text : LVL[n.level]}; }
    case 'element': return {...base, title: n.sym, sub: n.label.slice(3), badge: null, fill: '#fff', stroke: n.core ? C.text : C.line2, sw: n.core ? 2 : 1.4, w: 92, h: 54, big: true};
    case 'compound': return {...base, title: plain(n.label), sub: plain(n.note), badge: n.level, fill: TINT[n.level], stroke: LVL[n.level], sw: 1.6, dash: n.level === 'H' ? '5 3' : null, tcol: n.level === 'H' ? C.purple : C.text, w: 236, h: 54, badgeFill: LVL[n.level]};
    case 'route': return {...base, title: n.label.split(' · ')[0], sub: n.leaf ? `${nodes.filter(x => x.type === 'record' && parentOf(x) === n).length} 条记录` : '证据空白', badge: n.leaf || '—', fill: n.leaf ? C.tele : '#fff', stroke: C.tele, sw: n.leaf ? 0 : 1.5, dash: n.leaf ? null : '5 3', tcol: n.leaf ? '#fff' : C.tele, scol: n.leaf ? '#E3F2F5' : C.muted, w: 200, h: 54, badgeFill: C.navy};

      items.push({id, n, kind: 'card', x: lerp(ps.x, b.x, g), y: lerp(ps.y, b.y, g), w: lerp(2 * b.r, b.w, g), h: lerp(2 * b.r, b.h, g), spec: b.spec, col: b.col, textOp: ease(clamp((p - 0.45) / 0.5, 0, 1)), rx: lerp(b.r, 10, g), r: b.r, linkOp: g}); }
    else if (b) items.push({id, n, kind: 'dot', x: b.x, y: b.y, r: b.r, col: b.col});
  });
  // dots & morphing cards
  const dots = items.filter(i => i.kind === 'dot');
  const dsel = gTree.selectAll('circle.dot').data(dots, d => d.id);
  dsel.join(enter => enter.append('circle').attr('class', 'dot'), update => update, exit => exit.remove()).attr('cx', d => d.x).attr('cy', d => d.y).attr('r', d => d.r).attr('fill', d => d.col).attr('stroke', '#fff').attr('stroke-width', 1.5);
  // tree links: dot → its parent (straight, faint) once collapsed
  const dotById = new Map(dots.map(d => [d.id, d]));
  const tlinks = dots.map(d => { const par = parentOf(d.n); const ps = par ? (par.id === 'root' ? {x: CX, y: CY} : dotById.get(par.id)) : null; return ps ? {id: d.id, x1: d.x, y1: d.y, x2: ps.x, y2: ps.y} : null; }).filter(Boolean);
  gLinks.selectAll('line.tl').data(tlinks, d => d.id).join('line').attr('class', 'tl').attr('x1', d => d.x1).attr('y1', d => d.y1).attr('x2', d => d.x2).attr('y2', d => d.y2).attr('stroke', C.line2).attr('stroke-width', 1.2).attr('opacity', .8);
  // card ↔ parent curves
  const cards = items.filter(i => i.kind === 'card' || i.kind === 'morph');
  const curves = cards.map(c => { const par = parentOf(c.n); const ps = par ? (par.id === 'root' ? {x: CX, y: CY} : (dotById.get(par.id) || cur.get(par.id) || prev.get(par.id))) : {x: CX, y: CY}; if (!ps) return null;
    const ax = c.x, ay = c.y; const toC = Math.atan2(CY - ay, CX - ax); const sx = ax + Math.cos(toC) * (c.kind === 'card' ? Math.min(c.w, c.h) * 0.5 : c.r), sy = ay + Math.sin(toC) * (c.kind === 'card' ? Math.min(c.w, c.h) * 0.5 : c.r);
    const pa = Math.atan2(ps.y - CY, ps.x - CX); const k1 = 150, k2 = 110; const c1x = sx + Math.cos(toC) * k1, c1y = sy + Math.sin(toC) * k1; const c2x = ps.x + Math.cos(pa) * k2, c2y = ps.y + Math.sin(pa) * k2;
    return {id: c.id, d: `M${sx},${sy} C${c1x},${c1y} ${c2x},${c2y} ${ps.x},${ps.y}`, col: c.spec.stroke === '#fff' ? c.col : (c.spec.fill === '#fff' || c.spec.fill.startsWith('#F') || c.spec.fill.startsWith('#E') || c.spec.fill.startsWith('#D') ? c.spec.stroke : c.spec.fill), op: (c.linkOp ?? 1) * (c.kind === 'morph' ? c.textOp : 1)}; }).filter(Boolean);
  gLinks.selectAll('path.cl').data(curves, d => d.id).join('path').attr('class', 'cl').attr('d', d => d.d).attr('fill', 'none').attr('stroke', d => d.col).attr('stroke-width', 1.6).attr('opacity', d => 0.75 * d.op);
  // cards
  const csel = gCards.selectAll('g.card').data(cards, d => d.id);
  const centre = csel.join(enter => { const g = enter.append('g').attr('class', 'card'); g.append('rect').attr('class', 'bg'); const tg = g.append('g').attr('class', 'txt'); tg.append('text').attr('class', 'card-title'); tg.append('text').attr('class', 'card-sub'); tg.append('rect').attr('class', 'bd'); tg.append('text').attr('class', 'badge'); return g; }, update => update, exit => exit.remove());
  centre.attr('transform', d => `translate(${d.x},${d.y})`);
  centre.select('rect.bg').attr('x', d => -d.w / 2).attr('y', d => -d.h / 2).attr('width', d => d.w).attr('height', d => d.h).attr('rx', d => d.rx).attr('fill', d => d.kind === 'morph' && d.textOp < 0.5 ? d.col : d.spec.fill).attr('stroke', d => d.kind === 'morph' && d.textOp < 0.5 ? '#fff' : d.spec.stroke).attr('stroke-width', d => d.kind === 'morph' && d.textOp < 0.5 ? 1.5 : d.spec.sw).attr('stroke-dasharray', d => d.spec.dash);
  // text is laid out at the card's final size and scaled with the box while it grows out of / collapses into a dot, so it never spills past the rect
  centre.select('g.txt').attr('transform', d => `scale(${d.w / d.spec.w},${d.h / d.spec.h})`);
  const H0 = d => d.spec.h, W0 = d => d.spec.w;
  const titleSel = centre.select('text.card-title').attr('x', d => -W0(d) / 2 + CPX).style('font-size', d => (d.spec.big ? 24 : TFS) + 'px').style('fill', d => d.spec.tcol).attr('opacity', d => d.textOp);
  titleSel.each(function(d){ const t = d3.select(this); if (d.spec.big){ t.attr('y', 6).text(d.spec.title); return; } t.attr('y', null).text(null); const x = -W0(d) / 2 + CPX; d.spec.lines.forEach((line, i) => t.append('tspan').attr('x', x).attr('y', -H0(d) / 2 + CPY + TLH * (i + 1) - 5).text(line)); });
  const subSel = centre.select('text.card-sub').attr('x', d => -W0(d) / 2 + CPX + (d.spec.big ? 36 : 0)).style('font-size', SFS + 'px').style('fill', d => d.spec.scol).attr('opacity', d => d.textOp);
  subSel.each(function(d){ const t = d3.select(this); if (d.spec.big){ t.attr('y', 6).text(d.spec.subLines[0] || ''); return; } t.attr('y', null).text(null); const x = -W0(d) / 2 + CPX, y0 = -H0(d) / 2 + CPY + TLH * d.spec.lines.length - 3; d.spec.subLines.forEach((line, i) => t.append('tspan').attr('x', x).attr('y', y0 + SLH * (i + 1)).text(line)); });
  centre.select('rect.bd').attr('x', d => W0(d) / 2 - badgeW(d.spec)).attr('y', d => -H0(d) / 2 - 8).attr('width', d => d.spec.badge ? badgeW(d.spec) - 2 : 0).attr('height', 17).attr('rx', 5).attr('fill', d => d.spec.badgeFill || C.faint).attr('opacity', d => d.spec.badge ? d.textOp : 0);
  centre.select('text.badge').attr('x', d => W0(d) / 2 - badgeW(d.spec) / 2 - 1).attr('y', d => -H0(d) / 2 + 4).attr('text-anchor', 'middle').style('fill', '#fff').attr('opacity', d => d.spec.badge ? d.textOp : 0).text(d => d.spec.badge || '');
  // sector pills
  const pills = [...cur.entries()].filter(([id]) => id.startsWith('PILL_')).map(([id, s]) => ({id, ...s, op: prev.has(id) ? 1 : ease(clamp((p - 0.4) / 0.5, 0, 1)), icon: ICONS && ICONS[({A:'structure', B:'phasediagram', C:'precursors', D:'furnace', E:'condtable', F:'xrd', G:'guard', H:'route'})[id.slice(5)]]}));
  const psel = gPills.selectAll('g.pill').data(pills, d => d.id).join(enter => { const g = enter.append('g').attr('class', 'pillg'); g.append('rect'); g.append('image'); g.append('text').attr('class', 'pill'); return g; });
  psel.attr('transform', d => `translate(${d.x},${d.y})`).attr('opacity', d => d.op);
  // pills are centred on their anchor: [icon 24][6][text] inside a 30 px capsule
  psel.select('rect').attr('x', d => -d.w / 2).attr('y', d => -d.h / 2).attr('width', d => d.w).attr('height', d => d.h).attr('rx', d => d.h / 2).attr('fill', C.navy);
  psel.select('image').attr('href', d => d.icon ? d.icon.src : null).attr('x', d => -d.w / 2 + 12).attr('y', -11).attr('width', 24).attr('height', 22);
  psel.select('text').attr('x', d => -d.w / 2 + 42).attr('y', 5).text(d => d.text);
  rootG.attr('transform', `translate(${CX},${CY})`);
  rootG.select('text.root-label').attr('opacity', lerp((prev.get('root') || cur.get('root')).labelOp, cur.get('root').labelOp, e));
  // caption
  const L = LEVELS[k - 1]; const count = nodes.filter(n => levelOf.get(n.id) === k).length; const cn = ['一', '二', '三', '四', '五', '六', '七', '八', '九'][k - 1];
  capTitle.text(`第${cn}级：${L.title}（${count}）`); capSum.attr('x', 12 + tw(`第${cn}级：${L.title}（${count}）`, 22) + 22).text(L.sum); cap.attr('opacity', t < INTRO ? ease(t / INTRO) : 1);
  d3.select('#tlabel').text(`${t.toFixed(1)} s · 第 ${k} 级`); d3.select('#seek').property('value', Math.round(1000 * t / TOTAL));
}
// ---------- playback & seek API
let tNow = params.has('t') ? +params.get('t') : (params.has('level') ? T_LEVEL(+params.get('level')) + TR : 0);
let playing = false, last = null;
function tick(ts){ if (!playing) return; if (last !== null) tNow = Math.min(TOTAL, tNow + (ts - last) / 1000); last = ts; render(tNow); if (tNow >= TOTAL){ playing = false; d3.select('#play').text('▶ 播放'); } else requestAnimationFrame(tick); }
d3.select('#play').on('click', function(){ playing = !playing; last = null; this.textContent = playing ? '‖ 暂停' : '▶ 播放'; if (playing){ if (tNow >= TOTAL) tNow = 0; requestAnimationFrame(tick); } });
d3.select('#next').on('click', () => { const {k} = stateAt(tNow); tNow = T_LEVEL(Math.min(LEVELS.length, k + 1)) + TR; playing = false; render(tNow); });
d3.select('#prev').on('click', () => { const {k} = stateAt(tNow); tNow = T_LEVEL(Math.max(1, k - 1)) + TR; playing = false; render(tNow); });
d3.select('#seek').on('input', function(){ tNow = TOTAL * (+this.value) / 1000; playing = false; render(tNow); });
window.__seek = (t) => { tNow = t; render(t); };
window.__total = TOTAL;
// text is measured with the real web fonts, so layouts are computed once the fonts have loaded. Google serves Noto Sans SC in
// unicode-range slices that load lazily, so every CJK glyph of the graph is requested up front (fallback after 6 s offline)
const ALLTEXT = JSON.stringify(G).replace(/[\x00-\x7f]/g, '') || '知';
const FONT_JOBS = ['400 12.5px "IBM Plex Sans"', '700 17px "IBM Plex Sans"', '700 14px "IBM Plex Sans"', '700 30px "Chakra Petch"', '600 12px "IBM Plex Mono"', '700 11px "IBM Plex Mono"'].map(f => document.fonts.load(f, 'Ag0'))
  .concat(['400 12.5px "Noto Sans SC"', '700 17px "Noto Sans SC"'].map(f => document.fonts.load(f, ALLTEXT))).map(p => p.catch(() => []));
Promise.race([Promise.all(FONT_JOBS).then(() => document.fonts.ready), new Promise(r => setTimeout(r, 6000))]).then(() => {
  MCACHE.clear();
  for (let k = 1; k <= LEVELS.length; k++) LAYOUTS.push(layoutLevel(k));
  render(tNow);
  window.__ready = true;
  if (params.get('autoplay') === '1'){ playing = true; requestAnimationFrame(tick); }
});
