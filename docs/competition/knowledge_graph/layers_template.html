<style>
:root{color-scheme:light;--font-sans:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;--ground:#F1F4F7;--panel:#FFFFFF;--line:#D7DEE6;--line-2:#BFC9D4;--text:#13202C;--muted:#5A6A7A;--faint:#8A97A5;--heat:#E06A1B;--heat-2:#F3A56E;--tele:#1E8FA8;--tele-2:#5FB3C9;--purple:#7A4FD6;--ok:#1F9D62;--crit:#C93D2C;--gold:#B0841A;--navy:#156082}

:root.theme-console{--font-sans:"Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--ground:#F5F3ED;--panel:#FBFAF7;--line:#D8DAD6;--line-2:#C4C8C2;--text:#172B3A;--muted:#66737B;--faint:#9AA6AE;--heat:#B98032;--heat-2:#D4AE72;--tele:#2D7468;--tele-2:#7FAFA6;--purple:#3F4E75;--ok:#2D7468;--crit:#A94D45;--gold:#7A6A3A;--navy:#235B52}

.ann{font:500 13.5px "IBM Plex Sans","Noto Sans SC",sans-serif;fill:var(--text)}

#panel .chip:hover{border-color:var(--tele);color:var(--tele)}
#panel .chip.lvl-D0{border-color:var(--heat);color:var(--heat)}#panel .chip.lvl-D1{border-color:var(--heat-2);color:#C25A14}#panel .chip.lvl-N1{border-color:var(--tele);color:var(--tele)}#panel .chip.lvl-P1{border-color:var(--faint);color:var(--muted)}#panel .chip.lvl-X{border-color:var(--line-2);color:var(--faint)}#panel .chip.lvl-H{border-color:var(--purple);color:var(--purple);border-style:dashed}

#panel .ev .t{font-size:12px}
#panel .ev .n{color:var(--muted);font-size:11.5px;margin-top:2px}
g.card,circle.dot,g.pillg,g.step,#rootg{cursor:pointer}
g.card:hover rect.bg{filter:brightness(.96)}
</style>

<div class="ctrl" id="ctrl"><button id="play">▶ 播放</button><button id="prev">◀ 上一级</button><button id="next">下一级 ▶</button><input type="range" id="seek" min="0" max="1000" value="0"><span id="tlabel">0.0 s</span></div>
<script>
const G = /*__GRAPH_JSON__*/null;
const ICONS = /*__ICONS_JSON__*/null;
const params = new URLSearchParams(location.search);
if (params.get('movie') === '1') document.body.classList.add('movie');
const SCHEM = params.get('schematic') === '1'; // schematic: cards as blank blocks + curves to parents, no pills / chrome (explainer thumbnails)
const nodes = G.nodes, edges = G.edges, byId = new Map(nodes.map(n => [n.id, n]));
const adj = new Map(nodes.map(n => [n.id, []])); edges.forEach(e => { adj.get(e.s).push(e); adj.get(e.t).push(e); });
const C = {heat:'#E06A1B', heat2:'#F3A56E', tele:'#1E8FA8', tele2:'#5FB3C9', purple:'#7A4FD6', ok:'#1F9D62', crit:'#C93D2C', gold:'#B0841A', navy:'#156082', text:'#13202C', muted:'#5A6A7A', faint:'#8A97A5', line:'#D7DEE6', line2:'#BFC9D4', x:'#C5CED8', white:'#FFFFFF'};
const THEME = params.get('theme') || 'site';
if (THEME === 'console'){ Object.assign(C, {heat:'#B98032', heat2:'#D4AE72', tele:'#2D7468', tele2:'#7FAFA6', purple:'#3F4E75', ok:'#2D7468', crit:'#A94D45', gold:'#7A6A3A', navy:'#235B52', text:'#172B3A', muted:'#66737B', faint:'#9AA6AE', line:'#D8DAD6', line2:'#C4C8C2', x:'#CFD3CE'}); document.documentElement.classList.add('theme-console'); }
const SOFT = THEME === 'console' ? {ground:'#F5F3ED', panel:'#FBFAF7', leaf:'#DDEBE7', gap:'#EFEEE8', band1:'#F1EFE8', band2:'#FBFAF7', glow:'#EAE6DA', glow2:'#F5F3ED'} : {ground:'#F1F4F7', panel:'#FFFFFF', leaf:'#E1F1F5', gap:'#F4F6F8', band1:'#F4F7FA', band2:'#FBFCFD', glow:'#E4F1F5', glow2:'#F3F8FA'};
const LVL = {D0:C.heat, D1:C.heat2, N1:C.tele, P1:C.faint, X:C.x, H:C.purple};
const TINT = THEME === 'console' ? {D0:'#F3E8D5', D1:'#F8F1E4', N1:'#DDEBE7', P1:'#ECEBE6', X:'#F1F0EB', H:'#E3E6EE'} : {D0:'#FBDCC8', D1:'#FDEEE2', N1:'#DCEEF3', P1:'#EDF0F3', X:'#F4F6F8', H:'#ECE6F9'};
// ---------- text helpers
const SUBMAP = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','+':'₊','−':'₋','-':'₋','(':'₍',')':'₎','x':'ₓ','a':'ₐ','e':'ₑ','o':'ₒ','n':'ₙ','m':'ₘ','h':'ₕ','k':'ₖ','l':'ₗ','p':'ₚ','s':'ₛ','t':'ₜ','i':'ᵢ','r':'ᵣ','u':'ᵤ','v':'ᵥ','.':'.','/':'/'};
const SUPMAP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','−':'⁻','-':'⁻'};
const plain = h => String(h ?? '').replace(/<sub>(.*?)<\/sub>/g, (m, s) => [...s].map(c => SUBMAP[c] || c).join('')).replace(/<sup>(.*?)<\/sup>/g, (m, s) => [...s].map(c => SUPMAP[c] || c).join('')).replace(/<[^>]+>/g, '').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/\s+/g, ' ').trim();
const TWF = (new URLSearchParams(location.search).get('theme') === 'console') ? 1.12 : 1;
function tw(s, px){ let w = 0; px *= TWF; for (const ch of s){ const c = ch.codePointAt(0); w += (c > 0x2E80) ? px : (/[₀-₉ₓ₊₋ₐₑₒₙₘₕₖₗₚₛₜ]/.test(ch) ? px * .42 : (/[A-Z]/.test(ch) ? px * .66 : (/[a-z0-9]/.test(ch) ? px * .55 : px * .4))); } return w; }
function fit(s, maxPx, px){ if (tw(s, px) <= maxPx) return s; let out = ''; for (const ch of s){ if (tw(out + ch + '…', px) > maxPx) break; out += ch; } return out + '…'; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
// ---------- sectors & angles (same rules as the tree-ring page)
const SECTORS = ['A','B','C','D','E','F','G','H'];
const chapterSector = f => f.includes('00_intro') || f.includes('01_') ? 'A' : f.includes('02_') ? 'B' : f.includes('04_prior') ? 'C' : (f.includes('03_') || f.includes('04_neighbor')) ? 'D' : f.includes('05_') ? 'F' : f.includes('06_') ? 'G' : 'H';
const firstDefLeaf = n => { const e = adj.get(n.id).find(e => e.k === 'defines' && e.t === n.id); return e ? byId.get(e.s) : null; };
const leafOrder = new Map(); { let i = 0; nodes.filter(n => n.type === 'leaf').forEach(l => leafOrder.set(l.id, i++)); }
function sectorOf(n){ switch (n.type){
  case 'branch': return n.id.slice(2); case 'leaf': return n.id.slice(2, 3);
  case 'subtopic': { const e = adj.get(n.id).find(e => e.k === 'maps' && e.s === n.id); return e ? e.t.slice(2) : 'A'; }
  case 'paper': { const ls = n.leaves.slice().sort((a, b) => leafOrder.get('L_' + a) - leafOrder.get('L_' + b)); return ls.length ? ls[0][0] : 'B'; }
  case 'element': case 'compound': case 'agent': { const l = firstDefLeaf(n); if (n.type === 'agent') return 'E'; if (l) return l.id.slice(2, 3); return n.level === 'H' ? 'C' : (n.level === 'D0' || n.level === 'D1') ? 'A' : 'B'; }
  case 'route': case 'record': return 'D'; case 'char': return 'F'; case 'failure': return 'G';
  case 'section': return chapterSector(n.file); case 'claim': return chapterSector(byId.get(n.section).file);
  case 'tree': return {T_gaps:'G', T_recipe:'E', T_dir:'H', T_wf:'D', T_cases:'A'}[n.id] || 'H';
  case 'gap': return 'G'; case 'recipe': return 'E'; case 'direction': return 'H'; case 'workflow': return 'D'; case 'case': return 'A'; } return null; }
nodes.forEach(n => { n.sector = sectorOf(n); });
// ---------- levels: which nodes become cards at each step, and who their parent dot is
const LEVELS = [
  {id: 1, title: '调研目标与子主题', rail: '目标·子题', group: '个人知识树', pick: n => n.type === 'question' || n.type === 'subtopic',
   sum: '检索开始前研究者给出的问题结构：调研目标（青色边框）与其下的子主题（白卡）。',
   add: '调研目标与子主题', src: '正式案例 inputs/scope.md', hang: '上级是中心「调研主题」；目标按服务的子主题方向排布'},
  {id: 2, title: '文献八大分支', rail: '八大分支', group: '文献树', pick: n => n.type === 'branch',
   sum: '文献证据按互斥且完整的八个分支归类；每个分支占一个扇区，其后各级都沿该扇区展开。',
   add: '文献分支：身份、结构、替代、路线、条件、表征、边界、配方', src: '证据包 taxonomy.md §2', hang: '上级是中心；每个分支占一个扇区，后续节点沿同一扇区展开'},
  {id: 3, title: '证据叶节点', rail: '证据叶', group: '文献树', pick: n => n.type === 'leaf',
   sum: '每个叶节点对应一类可核验的主张，标注证据等级与支撑文献数。',
   add: '证据叶节点：每个节点对应一类可核验主张', src: 'taxonomy.md 各叶的判定 / 支撑 key', hang: '上级是所属文献分支的圆点；同一扇区内按顺序排布'},
  {id: 4, title: '支撑文献', rail: '支撑文献', group: '文献树', pick: n => n.type === 'paper',
   sum: '通过引用核验的文献，按与目标相的证据距离着色；实心橙为目标相的直接报道。',
   add: '支撑文献：作者、年份、刊物和 DOI', src: 'references.bib + papers.jsonl', hang: '上级是它支撑的第一个证据叶节点；颜色表示证据等级'},
  {id: 5, title: '元素与化合物', rail: '实体', group: '实体层', pick: n => n.type === 'element' || (n.type === 'compound'),
   sum: '由条件总表与化学式解析得到的元素与化合物；虚线卡为模型推断的假设目标，未经合成验证。',
   add: '元素、化合物与相：由化学式和条件表整理', src: '条件总表产物字段 + 人工别名表（build_graph.py 内 CURATED_*）', hang: '上级是定义它的证据叶节点或文献分支'},
  {id: 6, title: '合成路线与条件', rail: '路线·条件', group: '实体层', pick: n => n.type === 'route' || n.type === 'record',
   sum: '六条合成路线与逐字段的条件记录；记录卡边框按 A / B / C 区区分。',
   add: '合成路线与条件记录：路线、温度和时间', src: '论文 §3 合成条件总表，逐单元格转成卡片', hang: '路线归属文献树的路线分支；条件记录归属对应路线'},
  {id: 7, title: '结论 · 方向 · 证据缺口', rail: '结论·方向', group: '结论树', pick: n => (n.type === 'claim' && n.stage === 4 && byId.get(n.section).file.includes('07_')) || n.type === 'direction' || n.type === 'gap',
   sum: '综述结论（实心橙）、待验证的实验方向（虚线）与未闭合的证据缺口（灰虚线）。',
   add: '综述结论、实验方向与证据缺口', src: 'claim_evidence.jsonl §7、ideas/experiment_directions.md、taxonomy §5', hang: '结论与方向归属配方分支；缺口归属失败边界分支'},
  {id: 8, title: '长出的新树', rail: '新树', group: '新树', pick: n => (n.type === 'recipe' && n.top) || n.type === 'workflow' || n.type === 'case',
   sum: '前驱体预测（模型输出，未经验证）、仿真工作流与同源案例。',
   add: '前驱体预测、自动化工作流与同源案例', src: 'precursor_predictions.md、站点 showcase、补充案例 ledger', hang: '预测归属目标化合物；工作流归属路线分支；案例归属身份分支'},
  {id: 9, title: '全貌', rail: '全貌', group: '全貌', overview: true, pick: () => false,
   sum: '八级收拢后的整体：中心是调研主题，八个扇区各自成树，外圈标注目标相直接文献、目标化合物、调研目标及其回答状态、综述结论、实验方向、前驱体预测与同源案例。',
   add: `${G.meta.stats.nodes} 个节点 · ${G.meta.stats.edges} 条边 · ${G.meta.stats.papers} 篇文献 · ${G.meta.stats.claims} 条主张 · ${G.meta.stats.records} 条条件记录`, src: '证据包与正式案例的全部来源文件（见 README「五层怎么长」）', hang: '五棵树：个人知识树 → 文献树 → 实体层 → 结论树 → 新树'},
];
// nodes called out on the overview level (id → short label); order is display order within a side
const ANNOTATE = ['Q1', 'Q2', 'Q3', 'Q4', 'Q5', 'P_ababaikeri2024ba5y12zn', 'cmp_target', 'C_C097', 'C_C098', 'C_C099', 'C_C100', 'DIR_D1', 'DIR_D2', 'DIR_D3', 'DIR_D4', 'RC_Ba5Y12ZnSi8O40_1', 'RC_Ba5Y12MgSi8O40_1', 'RC_Ba5Y12CoSi8O40_1', 'CASE_phase', 'CASE_bzso', 'CASE_llzo', 'CASE_llzo_diag'];
function annText(n){ switch (n.type){
  case 'question': return {k: n.id, t: `${n.label.replace(/^目标 \d · /, '')} · ${n.status}`};
  case 'paper': return {k: 'D0', t: `${n.label} · 目标相直接报道`};
  case 'compound': return {k: n.level, t: `${plain(n.label)} · 目标相`};

d3.select('#seek').on('input', function(){ tNow = TOTAL * (+this.value) / 1000; playing = false; render(tNow); });
window.__seek = (t) => { tNow = t; render(t); };
window.__total = TOTAL;
render(tNow);
if (params.get('select') && byId.get(params.get('select'))) select(byId.get(params.get('select')), true);
window.__ready = true;
if (params.get('autoplay') === '1'){ playing = true; requestAnimationFrame(tick); }
</script>
</body>
</html>
