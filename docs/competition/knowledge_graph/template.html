<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAGE-Mat 知识森林</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{color-scheme:light;--ground:#F1F4F7;--ground-2:#F7F9FB;--panel:#FFFFFF;--line:#D7DEE6;--line-2:#BFC9D4;--text:#13202C;--muted:#5A6A7A;--faint:#8A97A5;
--heat:#E06A1B;--heat-2:#F3A56E;--tele:#1E8FA8;--tele-2:#5FB3C9;--purple:#7A4FD6;--ok:#1F9D62;--crit:#C93D2C;--gold:#B0841A;--navy:#156082;--white:#FFFFFF}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--ground);color:var(--text);font-family:"IBM Plex Sans","Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px}
#app{display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:1fr 380px;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font:700 18px/1.1 "Chakra Petch","IBM Plex Sans","Noto Sans SC",sans-serif;margin:0;letter-spacing:.2px;color:var(--text)}
header h1 small{display:block;font:500 11px/1.3 "IBM Plex Sans","Noto Sans SC",sans-serif;color:var(--muted);margin-top:2px;letter-spacing:0}
.stages{display:flex;gap:4px;align-items:center}
.stages button{font:500 12px/1 "IBM Plex Sans","Noto Sans SC",sans-serif;padding:7px 10px;border:1px solid var(--line-2);background:#fff;border-radius:6px;cursor:pointer;color:var(--muted)}
.stages button.on{background:var(--text);color:#fff;border-color:var(--text)}
.stages button.done{border-color:var(--tele);color:var(--tele)}
.stages button.play{border-color:var(--heat);color:var(--heat);font-weight:600}
.stagedesc{flex:1;min-width:0;color:var(--muted);font-size:12px;line-height:1.35}
.stagedesc b{color:var(--text)}
.tools{display:flex;gap:6px;align-items:center}
.tools input{font:400 12px "IBM Plex Sans","Noto Sans SC",sans-serif;padding:6px 9px;border:1px solid var(--line-2);border-radius:6px;width:190px;background:#fff;color:var(--text)}
.tools button,.tools label{font:500 12px "IBM Plex Sans","Noto Sans SC",sans-serif;padding:6px 9px;border:1px solid var(--line-2);background:#fff;border-radius:6px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
.tools label input{width:auto;margin:0}
#stage{position:relative;overflow:hidden;background:var(--ground)}
svg{width:100%;height:100%;display:block;cursor:grab}
svg:active{cursor:grabbing}
aside{border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 16px;font-size:12.5px;line-height:1.5}
aside h2{font:700 15px/1.25 "Chakra Petch","IBM Plex Sans","Noto Sans SC",sans-serif;margin:0 0 6px;color:var(--text)}
aside h3{font:600 11px/1.2 "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
aside .kicker{font:500 11px "IBM Plex Mono",monospace;color:var(--tele);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
aside .src{font:400 11px "IBM Plex Mono",monospace;color:var(--faint);margin-top:10px;word-break:break-all;border-top:1px dashed var(--line);padding-top:8px}
aside a{color:var(--tele);text-decoration:none}
aside a:hover{text-decoration:underline}
aside code{font:400 11px "IBM Plex Mono",monospace;background:#F1F4F7;padding:1px 4px;border-radius:3px}
.chip{display:inline-block;font:500 11px "IBM Plex Sans","Noto Sans SC",sans-serif;padding:2px 7px;border:1px solid var(--line-2);border-radius:999px;margin:2px 3px 2px 0;cursor:pointer;background:#fff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;color:var(--text)}
.chip:hover{border-color:var(--tele);color:var(--tele)}
.chip.lvl-D0{border-color:var(--heat);color:var(--heat)}.chip.lvl-D1{border-color:var(--heat-2);color:#C25A14}.chip.lvl-N1{border-color:var(--tele);color:var(--tele)}.chip.lvl-P1{border-color:var(--faint);color:var(--muted)}.chip.lvl-X{border-color:var(--line-2);color:var(--faint)}.chip.lvl-H{border-color:var(--purple);color:var(--purple);border-style:dashed}
.tag{display:inline-block;font:600 10.5px "IBM Plex Mono",monospace;padding:1px 6px;border-radius:4px;color:#fff;background:var(--muted);margin-right:4px;vertical-align:middle}
.tag.ok{background:var(--ok)}.tag.heat{background:var(--heat)}.tag.tele{background:var(--tele)}.tag.grey{background:#8A97A5}.tag.crit{background:var(--crit)}.tag.purple{background:var(--purple)}.tag.gold{background:var(--gold)}
.kv{display:grid;grid-template-columns:78px 1fr;gap:3px 8px;margin:6px 0}
.kv div:nth-child(odd){color:var(--muted);font-size:11.5px}
.kv .na{color:var(--faint)}
.claimtext{border-left:3px solid var(--tele);padding:4px 8px;background:#F7FAFB;margin:6px 0;border-radius:0 4px 4px 0}
.ev{margin:5px 0;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#FBFCFD}
.ev .t{font-size:12px}
.ev .n{color:var(--muted);font-size:11.5px;margin-top:2px}
footer{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding:6px 16px;background:var(--panel);border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
footer .lg{display:inline-flex;align-items:center;gap:5px}
footer .dot{width:9px;height:9px;border-radius:50%;display:inline-block}
footer .ln{width:20px;height:0;border-top:2px solid var(--line-2);display:inline-block}
.stats{display:flex;gap:10px;flex-wrap:wrap;font:500 11px "IBM Plex Mono",monospace;color:var(--muted)}
.stats b{color:var(--text);font-size:12px}
/* svg */
.n text{font-family:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;pointer-events:none;fill:var(--text);paint-order:stroke;stroke:#FFFFFF;stroke-width:5px;stroke-linejoin:round}
.n text.lab{font-size:19px}
.n text.head{font-size:24px;font-weight:600;fill:var(--text)}
.n text.inner{font-size:13px;font-weight:700;stroke:none;text-anchor:middle;fill:#FFFFFF}
.n text.inner.ink{fill:var(--text)}
.n text.inner.tele{fill:var(--tele)}
.n text.zoom,.n text.zoom2{display:none;fill:var(--muted);font-size:17px}
.clab{font-family:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif;pointer-events:none;fill:var(--text);paint-order:stroke;stroke:#FFFFFF;stroke-width:5px;stroke-linejoin:round;font-weight:600}
.clab.q{font-size:21px;fill:var(--tele)}
.clab.tree{font-size:22px}
.clab.small{font-size:18px;fill:var(--muted)}
.clab.dim{opacity:.12}
.clab.old{opacity:.28}
.n text.route{font-size:22px;font-weight:600;fill:var(--text)}
svg.z1 .n text.zoom{display:block}
svg.z2 .n text.zoom2{display:block}
.n.dim{opacity:.12}
.n.hit circle,.n.hit rect{stroke:var(--text);stroke-width:2.5px}
.n.old{opacity:.25}
.e{fill:none;stroke-width:1.2;opacity:.14;mix-blend-mode:multiply}
.e.dim{opacity:.02}
.e.hi{opacity:.95;stroke-width:2.4}
.e.old{opacity:.04}
.e.k-tree{stroke:#9AAABB;opacity:.2}
.e.k-support,.e.k-reports{opacity:.22}
.e.k-cites{opacity:.05}
.e.k-mentions,.e.k-uses,.e.k-characterised,.e.k-contains,.e.k-defines,.e.k-maps,.e.k-serves{stroke:#8A97A5;opacity:.12}
.e.k-records,.e.k-route,.e.k-produces,.e.k-traces{stroke:#8A97A5;opacity:.2}
.e.k-answers{stroke:#1F9D62;opacity:.6;stroke-width:1.7}
.e.k-grows{stroke:#E06A1B;opacity:.75;stroke-width:2.2}
.e.k-about,.e.k-candidate,.e.k-predicts_for{stroke:#7A4FD6;opacity:.3}
.e.k-evidence{stroke:#C93D2C;opacity:.35}
.e.k-duplicate{stroke:#BFC9D4;stroke-dasharray:2 2}
.ring{stroke:#D7DEE6;stroke-width:1.5}
.ring.old{opacity:.6}
.ringlab{font:500 18px "IBM Plex Mono",monospace;fill:#8A97A5;letter-spacing:.14em;text-anchor:middle}
.sector{fill:none;stroke:#BFC9D4;stroke-width:7;stroke-linecap:butt;opacity:1}
.sectorlab{font:700 30px "Chakra Petch","IBM Plex Sans","Noto Sans SC",sans-serif;fill:#13202C;letter-spacing:.1em}
body.poster #app{grid-template-columns:1fr;grid-template-rows:1fr}
body.poster header,body.poster aside,body.poster footer{display:none}
body.poster svg{cursor:default}
#chrome{position:absolute;inset:0;pointer-events:none;display:none}
body.poster #chrome{display:block}
#chrome .t{position:absolute;left:40px;top:32px;max-width:340px}
#chrome .t .eyebrow{font:600 12px "IBM Plex Mono",monospace;color:var(--tele);letter-spacing:.16em;margin-bottom:10px}
#chrome .t h1{font:700 34px/1.05 "Chakra Petch","IBM Plex Sans","Noto Sans SC",sans-serif;margin:0;color:var(--text);letter-spacing:.2px}
#chrome .t .sub{font:500 14px/1.5 "IBM Plex Sans","Noto Sans SC",sans-serif;color:var(--muted);margin-top:10px}
#chrome .t .st{display:inline-block;font:600 12px "IBM Plex Mono",monospace;color:#fff;background:var(--heat);letter-spacing:.14em;margin-top:18px;padding:4px 9px;border-radius:5px}
#chrome .t .sd{font:400 14px/1.55 "IBM Plex Sans","Noto Sans SC",sans-serif;color:var(--text);margin-top:10px}
#chrome .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 16px}
#chrome .lg{position:absolute;left:40px;bottom:32px;font:500 12.5px/1.95 "IBM Plex Sans","Noto Sans SC",sans-serif;color:var(--muted);max-width:420px;white-space:nowrap}
#chrome .lg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin:0 6px 0 0;vertical-align:-1px}
#chrome .lg b{color:var(--text);font-weight:600}
#chrome .ks{position:absolute;right:40px;bottom:32px;text-align:right;font:500 13px "IBM Plex Mono",monospace;color:var(--muted);letter-spacing:.06em}
#chrome .ks div{margin-top:8px}
#chrome .ks b{display:inline-block;font:700 36px/1 "Chakra Petch","IBM Plex Sans",sans-serif;color:var(--text);margin-right:8px;letter-spacing:0}
#chrome .ks em{font-style:normal;color:var(--tele)}
#chrome .rings{position:absolute;right:20px;top:30px;font:400 13px/1.85 "IBM Plex Sans","Noto Sans SC",sans-serif;color:var(--text);max-width:340px;padding:10px 12px;white-space:nowrap}
#chrome .rings b{display:inline-block;width:20px;font:600 13px "IBM Plex Mono",monospace;color:var(--tele);letter-spacing:.06em}
#chrome .rings img{height:20px;width:auto;vertical-align:middle;margin-right:7px}
#chrome .rings .h{font:600 11px "IBM Plex Mono",monospace;color:var(--faint);letter-spacing:.16em;margin:0 0 4px}
#chrome .rings .h2{margin-top:12px}
@media (max-width:1000px){#app{grid-template-columns:1fr}aside{display:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>SAGE-Mat 知识森林<small id="subtitle"></small></h1>
    <div class="stages" id="stages"></div>
    <div class="stagedesc" id="stagedesc"></div>
    <div class="tools">
      <input id="q" placeholder="搜索：化合物 / 文献 / 主张 / 路线…">
      <label title="平时只画结构与引用连线；勾选后画出全部文本匹配连线"><input type="checkbox" id="alledges">全部连线</label>
      <button id="fit">适配视图</button>
    </div>
  </header>
  <div id="stage"><svg id="svg"></svg><div id="chrome"></div></div>
  <aside id="panel"></aside>
  <footer id="legend"></footer>
</div>
<script>
const G = /*__GRAPH_JSON__*/null;
const params = new URLSearchParams(location.search);
const POSTER = params.get('poster') === '1';
const EMPH = params.get('emph') === '1';
if (POSTER) document.body.classList.add('poster');
let curStage = params.has('stage') ? +params.get('stage') : 4;
const nodes = G.nodes, edges = G.edges;
const byId = new Map(nodes.map(n => [n.id, n]));
edges.forEach(e => { e.stage = Math.max(byId.get(e.s).stage, byId.get(e.t).stage); });
const adj = new Map(nodes.map(n => [n.id, []]));
edges.forEach(e => { adj.get(e.s).push(e); adj.get(e.t).push(e); });
// recipe combos hang under T_recipe for layout / neighbourhood purposes
nodes.filter(n => n.type === 'recipe').forEach(n => { const e = {s:'T_recipe', t:n.id, k:'tree', stage:4, _virtual:true}; edges.push(e); adj.get('T_recipe').push(e); adj.get(n.id).push(e); });
const ICONS = /*__ICONS_JSON__*/null;
const C = {target:'#E06A1B', lineage:'#F3A56E', near:'#1E8FA8', ai:'#7A4FD6', proc:'#8A97A5', x:'#C5CED8', ok:'#1F9D62', crit:'#C93D2C', white:'#FFFFFF', text:'#13202C', muted:'#5A6A7A', faint:'#8A97A5', gold:'#B0841A', navy:'#156082', tele2:'#5FB3C9', line:'#D7DEE6'};
const TINT = {D0:'#FBDCC8', D1:'#FDEEE2', N1:'#DCEEF3', P1:'#EDF0F3', X:'#F4F6F8', H:'#ECE6F9'};
const LVL = {D0:C.target, D1:C.lineage, N1:C.near, P1:C.proc, X:C.x, H:C.ai};
const LVL_CN = {D0:'目标相直接证据', D1:'同一身份谱系', N1:'晶体化学近邻', P1:'工艺近邻', X:'边界 / 排除', H:'AI 推断 · 假设目标'};
const STRUCT = new Set(['tree','support','records','route','produces','grows','candidate','answers','about','predicts_for','evidence','cites','traces','reports']);
// ---------- text helpers
const SUBMAP = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','+':'₊','−':'₋','-':'₋','(':'₍',')':'₎','x':'ₓ','a':'ₐ','e':'ₑ','o':'ₒ','n':'ₙ','m':'ₘ','h':'ₕ','k':'ₖ','l':'ₗ','p':'ₚ','s':'ₛ','t':'ₜ','i':'ᵢ','r':'ᵣ','u':'ᵤ','v':'ᵥ','.':'.','/':'/'};
const SUPMAP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺','−':'⁻','-':'⁻'};
function plain(h){ return String(h).replace(/<sub>(.*?)<\/sub>/g,(m,s)=>[...s].map(c=>SUBMAP[c]||c).join('')).replace(/<sup>(.*?)<\/sup>/g,(m,s)=>[...s].map(c=>SUPMAP[c]||c).join('')).replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>'); }
function tw(s, px){ let w=0; for (const ch of s){ const c=ch.codePointAt(0); w += (c>0x2E80)?px:(/[₀-₉ₓ₊₋ₐₑₒₙₘₕₖₗₚₛₜ]/.test(ch)?px*.42:(/[A-Z]/.test(ch)?px*.66:(/[a-z0-9]/.test(ch)?px*.55:px*.4))); } return w; }
function fit(s, maxPx, px){ if (tw(s,px)<=maxPx) return s; let out=''; for (const ch of s){ if (tw(out+ch+'…',px)>maxPx) break; out+=ch; } return out+'…'; }
const short = (s, n) => { s = plain(s); return s.length > n ? s.slice(0, n) + '…' : s; };
// ---------- sectors (the eight taxonomy branches, clockwise from the top)
const SECTORS = ['A','B','C','D','E','F','G','H'];
const chapterSector = f => f.includes('00_intro') || f.includes('01_') ? 'A' : f.includes('02_') ? 'B' : f.includes('04_prior') ? 'C' : (f.includes('03_') || f.includes('04_neighbor')) ? 'D' : f.includes('05_') ? 'F' : f.includes('06_') ? 'G' : 'H';
const firstDefLeaf = n => { const e = adj.get(n.id).find(e => e.k === 'defines' && e.t === n.id); return e ? byId.get(e.s) : null; };
const leafOrder = new Map(); { let i = 0; nodes.filter(n => n.type === 'leaf').forEach(l => leafOrder.set(l.id, i++)); }
function sectorOf(n){
  switch (n.type){
    case 'branch': return n.id.slice(2);
    case 'leaf': return n.id.slice(2, 3);
    case 'subtopic': { const e = adj.get(n.id).find(e => e.k === 'maps' && e.s === n.id); return e ? e.t.slice(2) : 'A'; }
    case 'paper': { const ls = n.leaves.slice().sort((a,b) => leafOrder.get('L_'+a) - leafOrder.get('L_'+b)); return ls.length ? ls[0][0] : 'B'; }
    case 'element': case 'compound': case 'agent': { const l = firstDefLeaf(n); if (n.type === 'agent') return 'E'; if (l) return l.id.slice(2, 3); return n.level === 'H' ? 'C' : (n.level === 'D0' || n.level === 'D1') ? 'A' : 'B'; }
    case 'route': case 'record': return 'D';
    case 'char': return 'F';
    case 'failure': return 'G';
    case 'section': return chapterSector(n.file);
    case 'claim': return chapterSector(byId.get(n.section).file);
    case 'tree': return {T_gaps:'G', T_recipe:'E', T_dir:'H', T_wf:'D', T_cases:'A'}[n.id] || 'H';
    case 'gap': return 'G'; case 'recipe': return 'E'; case 'direction': return 'H'; case 'workflow': return 'D'; case 'case': return 'A';
  }
  return null;
}
// ring groups: radius and desired arc spacing per node
const RG = {question:[125,60], subtopic:[196,44], branch:[300,80], leaf:[372,26], paper:[442,17], element:[522,34], compound:[574,40], route:[574,120], agent:[574,22], char:[574,28], failure:[574,44], record:[622,20], section:[702,26], claim:[746,9], tree:[832,110], kid:[904,44]};
const HUB = 262; // cross-sector edges swing around this inner ring instead of through the centre
const grp = n => (n.type === 'claim' && n.stage === 4) || ['gap','recipe','direction','workflow','case'].includes(n.type) ? 'kid' : (n.type === 'section' && n.stage === 4) ? 'tree' : n.type;
// bundling parent
function parentOf(n){
  const branchOf = s => byId.get('B_' + s);
  switch (n.type){
    case 'root': return null;
    case 'question': case 'subtopic': case 'branch': return byId.get('root');
    case 'leaf': return byId.get('B_' + n.id.slice(2, 3));
    case 'paper': return n.leaves.length ? byId.get('L_' + n.leaves.slice().sort((a,b)=>leafOrder.get('L_'+a)-leafOrder.get('L_'+b))[0]) : branchOf('B');
    case 'record': { const e = adj.get(n.id).find(e => e.k === 'route' && e.s === n.id); return e ? byId.get(e.t) : branchOf('D'); }
    case 'claim': return n.stage === 4 ? byId.get(n.section) : byId.get(n.section);
    case 'gap': return byId.get('T_gaps'); case 'recipe': return byId.get('T_recipe'); case 'direction': return byId.get('T_dir'); case 'workflow': return byId.get('T_wf'); case 'case': return byId.get('T_cases');
    default: return branchOf(n.sector);
  }
}
// ---------- layout
nodes.forEach(n => { n.sector = sectorOf(n); n.g = grp(n); });
const root = byId.get('root'); root.x = 0; root.y = 0; root.r = 0; root.a = 0;
const GAP = 3 * Math.PI / 180;
const need = {}; SECTORS.forEach(s => need[s] = 0.12);
SECTORS.forEach(s => { Object.keys(RG).forEach(g => { const c = nodes.filter(n => n.sector === s && n.g === g).length; if (c) need[s] = Math.max(need[s], c * RG[g][1] / RG[g][0] + 0.05); }); });
const total = SECTORS.reduce((a, s) => a + need[s], 0), avail = 2 * Math.PI - GAP * SECTORS.length;
const span = {}; let a0 = -Math.PI / 2; SECTORS.forEach(s => { const w = need[s] / total * avail; span[s] = [a0, a0 + w]; a0 += w + GAP; });
const mid = s => (span[s][0] + span[s][1]) / 2;
// place: for every sector × ring group, spread nodes evenly, ordered by their parent's angle (then label)
function place(sel, order){
  SECTORS.forEach(s => Object.keys(RG).forEach(g => { const arr = nodes.filter(n => sel(n) && n.sector === s && n.g === g); if (!arr.length) return; arr.sort(order);
    const [lo, hi] = span[s], pad = (hi - lo) * 0.07, w = hi - lo - 2 * pad; arr.forEach((n, i) => { n.a = arr.length === 1 ? (lo + hi) / 2 : lo + pad + w * i / (arr.length - 1); n.r = RG[g][0]; }); }));
}
const lvlRank = {D0:0, D1:1, N1:2, P1:3, X:4, H:5};
const byParentAngle = (a, b) => { const pa = parentOf(a), pb = parentOf(b); const x = (pa && pa.a !== undefined ? pa.a : 0) - (pb && pb.a !== undefined ? pb.a : 0); return x || (a.year || '').localeCompare(b.year || '') || String(a.label).localeCompare(String(b.label)); };
place(n => ['question','subtopic','branch'].includes(n.type), (a, b) => String(a.id).localeCompare(String(b.id)));
place(n => n.type === 'leaf', (a, b) => leafOrder.get(a.id) - leafOrder.get(b.id));
place(n => n.type === 'paper', byParentAngle);
place(n => ['element','route','agent','char','failure'].includes(n.type), (a, b) => (a.core === b.core ? 0 : a.core ? -1 : 1) || String(a.id).localeCompare(String(b.id)));

    case 'leaf': h += `<h2>${esc(n.label)}</h2><p>${n.levels.map(lvlTag).join('')} ${n.levels.map(l=>LVL_CN[l]||'').filter(Boolean).join(' / ')}</p>${kv(Object.entries(n.fields).map(([k,v])=>[k,esc(v)]))}`; break;
    case 'paper': h += `<h2>${n.title}</h2><p>${lvlTag(n.level)}${LVL_CN[n.level]} · <span class="tag ${n.strength==='strong'?'tele':'grey'}">${n.strength==='strong'?'强支撑':'弱支撑'}</span>${n.fulltext?'<span class="tag ok">全文在包内</span>':''}</p>${kv([['作者',esc(n.authors)],['年份 · 刊物',`${esc(n.year)} · ${esc(n.venue)}`],['DOI',n.doi?`<a href="${n.url}" target="_blank" rel="noopener">${esc(n.doi)}</a>`:(n.url?`<a href="${n.url}" target="_blank" rel="noopener">链接</a>`:'—')],['BibTeX key',`<code>${n.key}</code>`]])}${n.abstract?`<p style="color:var(--muted)">${esc(n.abstract).slice(0,420)}${n.abstract.length>420?'…':''}</p>`:''}`; break;
    case 'compound': h += `<h2>${n.label}</h2><p>${lvlTag(n.level)}${LVL_CN[n.level]}</p><p>${esc(n.note)}</p>`; break;
    case 'route': h += `<h2>${esc(n.label)}</h2><p>${esc(n.note)}</p>`; break;
    case 'element': h += `<h2>${esc(n.label)}</h2><p>${n.core?'<span class="tag">目标相组成元素</span>':'<span class="tag grey">替代 / 助熔 / 对照元素</span>'}</p><p>${esc(n.note)}</p>`; break;
    case 'record': h += `<h2>条件记录 ${n.label}</h2><p><span class="tag ${n.zone.startsWith('A')?'heat':(n.zone.startsWith('B')?'gold':'grey')}">${esc(n.zone)}</span></p>${kv([['来源与定位',n.source],['目标 / 产物',n.product],['原料 · 配比 · 前处理',n.inputs],['合成方法',n.method],['与目标相关系',n.relation],['温度 – 时间',n.temp_time],['气氛 / 体系',n.atmosphere],['坩埚与助熔',n.crucible_flux],['冷却 / 生长',n.cooling],['产物与表征',n.product_char],['未明确记载',n.missing]])}`; break;
    case 'agent': h += `<h2>${n.label}</h2><p><span class="tag grey">${n.kind}</span></p>`; break;
    case 'char': case 'failure': h += `<h2>${esc(n.label)}</h2><p>${esc(n.text||'')}</p>`; break;
    case 'section': h += `<h2>${esc(n.label)}</h2><p><span class="tag grey">${esc(n.chapter)}</span> <code>${esc(n.file)}</code></p>`; break;
    case 'claim': h += `<h2>主张 ${n.label}</h2><p>章节：${chip(n.section)}</p><div class="claimtext">${esc(n.text)}</div><h3>引用证据（${n.evidence.length}）</h3>${n.evidence.map(e=>{ const m = byId.get('P_'+e.key); return `<div class="ev"><div class="t"><span class="tag ${e.strength==='strong'?'tele':'grey'}">${e.strength==='strong'?'强':'弱'}</span>${e.fulltext?'<span class="tag ok">全文</span>':''}${m?chip(m.id):esc(e.key)}</div><div class="n">${esc(e.note)}</div>${e.trace.map(t=>`<div class="n">↳ 条件单元 <b>${esc(t.condition_cell)}</b>：${esc(t.location)}</div>`).join('')}</div>`; }).join('')}`; break;
    case 'tree': h += `<h2>${esc(n.label)}</h2><p>${esc(n.text)}</p>`; break;
    case 'gap': h += `<h2>${esc(n.label)}</h2><div class="claimtext">${esc(n.text)}</div>`; break;
    case 'recipe': h += `<h2>${n.label}</h2><p>目标 ${chip(n.target)}</p>${kv([['排名',`#${n.rank}${n.top?' · 首选':''}`],['候选池内概率',n.p.toFixed(4)],['验证状态','<code>model_output_verified=true</code> · <code>chemical_route_verified=false</code>']])}${n.note?`<p>${esc(n.note)}</p>`:''}`; break;
    case 'direction': h += `<h2>${esc(n.label)}</h2><p><span class="tag purple">AI 推断 · 实验假设</span></p><p>${esc(n.text)}</p>`; break;
    case 'workflow': h += `<h2>${esc(n.label)}</h2><p>${esc(n.text)}</p><p><span class="tag ok">仿真</span>Isaac Sim 数字孪生，非实体实验。</p>`; break;
    case 'case': h += `<h2>${esc(n.label)}</h2><p style="color:var(--muted)">${esc(n.topic)}</p>${kv([['引用条目',n.entries??'—'],['闸门',Object.entries(n.gates).map(([k,v])=>`<span class="tag ${k==='PASS'?'ok':(k==='WARN'?'heat':'crit')}">${k} ${v}</span>`).join('')],['轮次',n.round??'—']])}`; break;
  }
  h += neighborHtml(n, n.type==='claim'?['cites']:[]);
  h += `<div class="src">出处：${esc(n.src)}</div>`;
  p.html(h); p.selectAll('.chip').on('click', function(){ const m = byId.get(this.dataset.id); if (m){ select(m); centerOn(m); } });
}
function showOverview(){ const s = G.meta.stats; d3.select('#panel').html(`<div class="kicker">SAGE-Mat · 知识森林 · 年轮</div><h2>${G.meta.subtitle}</h2>
<p>中心是研究者开始时的调研主题；每一圈年轮是一层生长：<b>个人知识树</b>（目标与子主题）→ <b>文献树</b>（8 个分支 = 8 个扇区，叶节点与 51 篇文献）→ <b>实体主干</b>（元素、化合物、路线、条件记录、前驱体、表征、失败模式）→ <b>结论树</b>（100 条主张回连文献并回答目标）→ 最外圈的<b>新树</b>：证据缺口、RECIPE 预测、实验方向、自动化工作流、同根的其他调研。</p>
<div class="stats"><span><b>${s.papers}</b> 篇文献</span><span><b>${s.citation_calls}</b> 次引用</span><span><b>${s.claims}</b> 条主张</span><span><b>${s.leaves}</b> 个叶节点</span><span><b>${s.records}</b> 条条件记录</span><span><b>${s.compounds}</b> 个化合物 / 相</span><span><b>${s.nodes}</b> 节点 · <b>${s.edges}</b> 边</span></div>
<h3>怎么读</h3><ul style="padding-left:18px;margin:4px 0"><li>颜色 = 证据来源：${lvlTag('D0')}目标相直接证据（白环 + 放大）${lvlTag('D1')}同一身份谱系 ${lvlTag('N1')}晶体化学近邻 ${lvlTag('P1')}工艺近邻（中性）${lvlTag('X')}边界 ${lvlTag('H')}AI 推断 / 预测（紫，虚线，未经实验验证）。</li><li>连线沿层级束化：文献 → 叶节点 → 分支，主张 → 章节，跨扇区的线向中心汇聚。</li><li>放大到 1.5× 显示文献、化合物等次级标签；2.6× 显示全部。悬停看邻接，点击固定。</li><li>「▶ 生长」逐圈长出，已长出的圈淡化。</li></ul>
<h3>数据来源</h3><div class="src">${G.meta.built_from.map(esc).join('<br>')}</div>`); }
function centerOn(n){ const {width,height} = document.getElementById('stage').getBoundingClientRect(); const k = Math.max(1.6, d3.zoomTransform(svg.node()).k); svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(width/2 - n.x*k, height/2 - n.y*k).scale(k)); }
function fitView(animate=true){ const {width,height} = document.getElementById('stage').getBoundingClientRect(); const ext = STAGE_R[Math.min(4, curStage)][1] + (curStage >= 4 ? 440 : 50); const k = Math.min(width, height) / (2 * ext); const t = d3.zoomIdentity.translate(width/2, height/2).scale(k); (animate ? svg.transition().duration(700) : svg).call(zoom.transform, t); }
function fitPoster(){ const {width,height} = document.getElementById('stage').getBoundingClientRect(); const ext = (EMPH || curStage >= 4) ? RMAX + 440 : STAGE_R[curStage][1] + 90; const k = (height - 24) / (2 * ext); svg.call(zoom.transform, d3.zoomIdentity.translate(width/2 + 36, height/2).scale(k)); }
// ---------- UI
const stg = d3.select('#stages'); G.meta.stages.forEach(s => stg.append('button').attr('data-i', s.i).text(`${s.i} ${s.name}`).on('click', () => { applyStage(s.i, true); fitView(); }));
let playing = null; stg.append('button').attr('class', 'play').text('▶ 生长').on('click', function(){ if (playing){ clearInterval(playing); playing = null; this.textContent = '▶ 生长'; applyStage(curStage, false); return; } applyStage(0, true, true); fitView(); let i = 0; this.textContent = '‖ 暂停'; playing = setInterval(() => { i++; if (i > 4){ clearInterval(playing); playing = null; this.textContent = '▶ 生长'; applyStage(4, true); return; } applyStage(i, true, true); fitView(); }, 2200); });
d3.select('#fit').on('click', () => fitView());
d3.select('#alledges').on('change', () => { applyEdgeMode(); if (pinned) highlight(pinned); });
d3.select('#q').on('input', function(){ const q = this.value.trim().toLowerCase(); if (!q){ highlight(pinned); return; } const hits = nodes.filter(n => [n.label, n.title, n.text, n.key, n.product].filter(Boolean).some(s => plain(s).toLowerCase().includes(q) || String(s).toLowerCase().includes(q))); const ids = new Set(hits.map(n => n.id)); N.classed('dim', d => !ids.has(d.id)).classed('hit', d => ids.has(d.id)); E.classed('dim', true); d3.select('#panel').html(`<div class="kicker">搜索</div><h2>${hits.length} 个匹配</h2><div>${hits.slice(0,80).map(n => chip(n.id)).join('')}</div>`); d3.select('#panel').selectAll('.chip').on('click', function(){ const m = byId.get(this.dataset.id); select(m); centerOn(m); }); }).on('keydown', function(ev){ if (ev.key === 'Enter'){ const c = d3.select('#panel').select('.chip').node(); if (c){ const m = byId.get(c.dataset.id); select(m); centerOn(m); } } });
d3.select('#subtitle').text(G.meta.subtitle);
const lg = d3.select('#legend'); const item = (sw, txt) => lg.append('span').attr('class', 'lg').html(sw + txt);
[[C.target,'D0 目标相直接证据（深环 + 放大）'],[C.lineage,'D1 同一身份谱系'],[C.near,'N1 晶体化学近邻'],[C.proc,'P1 工艺近邻'],[C.x,'X 边界 / 排除'],[C.ai,'紫 = AI 推断 / 预测（虚线，未验证）'],[C.crit,'失败模式 · 证据缺口（虚线）'],[C.ok,'目标已回答（实心绿点）']].forEach(([c,t]) => item(`<span class="dot" style="background:${c}"></span>`, t));
item(`<span class="ln" style="border-color:${C.ok}"></span>`, '章节 → 回答目标'); item(`<span class="ln" style="border-color:${C.target}"></span>`, '根 → 长出新树'); item(`<span class="ln" style="border-color:${C.ai}"></span>`, '新树 → 关联实体');
lg.append('span').style('margin-left', 'auto').attr('class', 'stats').html(`<span><b>${G.meta.stats.papers}</b> 文献</span><span><b>${G.meta.stats.claims}</b> 主张</span><span><b>${G.meta.stats.records}</b> 条件记录</span><span><b>${G.meta.stats.nodes}</b> 节点</span><span><b>${G.meta.stats.edges}</b> 边</span>`);
function chrome(){ const s = G.meta.stats, st = G.meta.stages[curStage]; const ic = k => (ICONS && ICONS[k]) ? `<img src="${ICONS[k].src}" alt="">` : '';
  d3.select('#chrome').html(`<div class="t"><div class="eyebrow">SAGE-MAT · 文献系统 · 知识图谱</div><h1>SAGE-Mat 知识森林</h1><div class="sub">${G.meta.subtitle}。中心是调研主题，每一圈年轮是一层生长，八个扇区是文献树的八个分支。</div><div class="st">STAGE ${curStage} · ${st.name}</div><div class="sd">${st.desc}</div></div>
<div class="rings card"><div class="h">年轮 · 五层生长</div>${G.meta.stages.map(x => `<div style="opacity:${x.i <= curStage ? 1 : .4}">${ic(STAGE_ICON[x.i])}<b>${x.i}</b>${x.name}</div>`).join('')}<div class="h h2">扇区 · 文献树八分支</div>${SECTORS.map(k => `<div style="opacity:${curStage >= 1 ? 1 : .4}">${ic(SECTOR_ICON[k])}<b>${k}</b>${BRANCH_NAME[k].split('（')[0]}</div>`).join('')}</div>
<div class="lg card"><div><i style="background:${C.target}"></i><b>D0</b> 目标相直接证据（深环） <i style="background:${C.lineage};margin-left:12px"></i><b>D1</b> 同一身份谱系</div><div><i style="background:${C.near}"></i><b>N1</b> 晶体化学近邻 <i style="background:${C.proc};margin-left:12px"></i><b>P1</b> 工艺近邻 <i style="background:${C.x};margin-left:12px"></i><b>X</b> 边界</div><div><i style="background:${C.ai}"></i><b>紫</b> AI 推断 / 预测（虚线，未验证） <i style="background:${C.crit};margin-left:12px"></i><b>红</b> 失败 · 缺口</div><div><i style="background:${C.ok}"></i><b>绿</b> 目标已回答 <i style="background:${C.navy};margin-left:12px"></i><b>深青</b> 自动化工作流（仿真）</div></div>
<div class="ks"><div><b>${s.papers}</b><em>篇文献</em> · 全部通过引用闸门</div><div><b>${s.claims}</b><em>条主张</em> · ${s.claims_trace} 条带原始条件溯源</div><div><b>${s.records}</b><em>条条件记录</em> · 逐字段</div><div><b>${s.nodes}</b><em>节点</em> · ${s.edges} 边 · 全部由证据包生成</div></div>`); }
applyStage(curStage, false, EMPH);
if (!POSTER) showOverview();
if (params.get('select') && byId.has(params.get('select'))) { select(byId.get(params.get('select'))); }
requestAnimationFrame(() => { POSTER ? fitPoster() : fitView(false); if (pinned && !POSTER) centerOn(pinned); document.title = `SAGE-Mat 知识森林 · ${nodes.length} 节点`; window.__kg = {nodes: nodes.length, edges: edges.length}; });
window.addEventListener('resize', () => { POSTER ? fitPoster() : fitView(false); });
</script>
