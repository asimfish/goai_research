<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif'>
  <defs>
    <marker id="arrowPrimary" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1F4D78"/>
    </marker>
  </defs>
  <g id="p05-bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>
  <g id="p05-header">
    <text x="72" y="96" font-size="40" font-weight="700" fill="#1D1D1F">RECIPE：把无机逆合成重述为变长前驱体集合的排序问题</text>
    <rect x="72" y="114" width="72" height="4" fill="#1F4D78"/>
  </g>
  <g id="p05-lead">
    <text x="72" y="166" font-size="26" fill="#1D1D1F">
      <tspan x="72" dy="0">团队 NeurIPS 2026 投稿。Generator 先保证召回，再对<tspan fill="#C48A2B" font-weight="700">完整前驱体集合</tspan>直接排序；</tspan>
      <tspan x="72" dy="38">以 MCP 工具 <tspan font-family='Consolas, "Courier New", monospace'>predict_precursor_routes</tspan> 进入想法环节，输出只能是“模型候选、待实验验证”。</tspan>
    </text>
  </g>
  <g id="p05-stage-1">
    <rect x="72" y="236" width="340" height="150" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1"/>
    <rect x="72" y="236" width="340" height="40" fill="#1F4D78"/>
    <text x="88" y="264" font-size="24" font-weight="700" fill="#FFFFFF">① Candidate Generator</text>
    <text x="88" y="304" font-size="18" fill="#1D1D1F">
      <tspan x="88" dy="0">formula-token Transformer 打分：</tspan>
      <tspan x="88" dy="26">目标式 × 798 个前驱体，多标签 BCE</tspan>
    </text>
    <text x="88" y="372" font-size="16" font-weight="700" fill="#C48A2B">产物：Top-30 高召回候选池</text>
  </g>
  <g id="p05-stage-2">
    <line x1="414" y1="311" x2="466" y2="311" stroke="#1F4D78" stroke-width="2" marker-end="url(#arrowPrimary)"/>
    <rect x="470" y="236" width="340" height="150" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1"/>
    <rect x="470" y="236" width="340" height="40" fill="#4F8A9E"/>
    <text x="486" y="264" font-size="24" font-weight="700" fill="#FFFFFF">② 化学硬过滤 + 变长枚举</text>
    <text x="486" y="304" font-size="18" fill="#1D1D1F">
      <tspan x="486" dy="0">非挥发元素 ⊆ 目标元素（pool ≤ 15）；</tspan>
      <tspan x="486" dy="26">枚举 2–5 元组合，不预设真实集合大小</tspan>
    </text>
    <text x="486" y="372" font-size="16" font-weight="700" fill="#C48A2B">产物：典型 4,928 个候选集合</text>
  </g>
  <g id="p05-stage-3">
    <line x1="812" y1="311" x2="864" y2="311" stroke="#1F4D78" stroke-width="2" marker-end="url(#arrowPrimary)"/>
    <rect x="868" y="236" width="340" height="150" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1"/>
    <rect x="868" y="236" width="340" height="40" fill="#1F4D78"/>
    <text x="884" y="264" font-size="24" font-weight="700" fill="#FFFFFF">③ Complete-Set Reranker</text>
    <text x="884" y="304" font-size="18" fill="#1D1D1F">
      <tspan x="884" dy="0">目标条件化集合 token + 374 维描述子，</tspan>
      <tspan x="884" dy="26">listwise 排序 · 负样本间隔 · 覆盖监督</tspan>
    </text>
    <text x="884" y="372" font-size="16" font-weight="700" fill="#C48A2B">产物：Top-K 完整集合及分数</text>
  </g>
  <g id="p05-integration-rules">
    <rect x="72" y="418" width="556" height="224" fill="#F3F5F8"/>
    <text x="96" y="452" font-size="24" font-weight="700" fill="#1F4D78">融入规则（skill 层硬约束）</text>
    <text x="96" y="490" font-size="18" fill="#1D1D1F">
      <tspan x="96" dy="0">· 每条路线带 chemical_route_verified=false，正文只能写</tspan>
      <tspan x="96" dy="26">  “模型候选，待实验验证”，不得表述为实验真值</tspan>
      <tspan x="96" dy="34">· 返回 Stage-1 概率、Stage-2 分数、候选池内概率、</tspan>
      <tspan x="96" dy="26">  checkpoint SHA-256，供审稿人逐条核对</tspan>
      <tspan x="96" dy="34">· 路线须经文献证据补全与 reviewer 复核后才能进入方案</tspan>
    </text>
  </g>
  <g id="p05-formal-calls">
    <rect x="652" y="418" width="556" height="224" fill="#F3F5F8"/>
    <text x="676" y="452" font-size="24" font-weight="700" fill="#1F4D78">正式报告中的三次调用（Top-1 · 候选池内概率）</text>
    <text x="676" y="494" font-size="18" fill="#1D1D1F">
      <tspan x="676" dy="0"><tspan font-weight="700">Zn 目标</tspan>  → ZnO + Y2O3 + SiO2 + BaCO3</tspan>
      <tspan x="676" dy="26">          常规氧化物 / 碳酸盐原料集合 · <tspan fill="#C48A2B" font-weight="700">0.594</tspan></tspan>
      <tspan x="676" dy="36"><tspan font-weight="700">Mg 类比</tspan>  → MgO + Y2O3 + BaCO3 + SiO2 · <tspan fill="#C48A2B" font-weight="700">0.522</tspan></tspan>
      <tspan x="676" dy="36"><tspan font-weight="700">Co 类比</tspan>  → Co3O4 + Y2O3 + BaCO3 + SiO2 · <tspan fill="#C48A2B" font-weight="700">0.298</tspan></tspan>
      <tspan x="676" dy="26">          前三名反映 Co 氧化态不确定性，而非三条等价处方</tspan>
    </text>
  </g>
  <g id="p05-footer">
    <text x="72" y="694" font-size="16" fill="#8A94A0">SAGE-Mat · GoAI Research · GOAI 2026 复赛 · 原始请求与返回：run/tool_calls.jsonl</text>
    <text x="1208" y="694" font-size="16" fill="#8A94A0" text-anchor="end">5 / 12</text>
  </g>
</svg>
