<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif'>
  <g id="p08-bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>
  <g id="p08-header">
    <text x="72" y="96" font-size="40" font-weight="700" fill="#1D1D1F">目标相只有一篇直接报道；组成坐标比单一温度更能解释成相</text>
    <rect x="72" y="114" width="72" height="4" fill="#1F4D78"/>
  </g>
  <g id="p08-lead">
    <text x="72" y="166" font-size="26" fill="#1D1D1F">系统给出的不是配方，而是文献证据限定的<tspan fill="#C48A2B" font-weight="700">可迁移范围</tspan>与四类<tspan fill="#C48A2B" font-weight="700">可检验的实验方向</tspan>。</text>
  </g>
  <g id="p08-conclusions">
    <text x="72" y="222" font-size="24" font-weight="700" fill="#1F4D78">既有文献能够确认什么</text>
    <text x="72" y="270" font-size="24" font-weight="700" fill="#C48A2B">1</text>
    <text x="104" y="270" font-size="18" fill="#1D1D1F">
      <tspan x="104" dy="0">公开证据只能确认“开放体系高温溶液法 + 单晶 X 射线衍射鉴定”，</tspan>
      <tspan x="104" dy="26">不足以给出经验证的目标相复现配方。</tspan>
    </text>
    <text x="72" y="340" font-size="24" font-weight="700" fill="#C48A2B">2</text>
    <text x="104" y="340" font-size="18" fill="#1D1D1F">
      <tspan x="104" dy="0">无 Zn 谱系提供三类可比路线：MoO3 助熔（Pt 坩埚、1150 °C、</tspan>
      <tspan x="104" dy="26">2 K/h）、x:26:16 固相陶瓷（1300 / 1600 °C）、5:13:8 粉体</tspan>
      <tspan x="104" dy="26">相场筛查（1273 / 1573 K）；<tspan font-weight="700">具体数值不得无条件迁移</tspan>。</tspan>
    </text>
    <text x="72" y="436" font-size="24" font-weight="700" fill="#C48A2B">3</text>
    <text x="104" y="436" font-size="18" fill="#1D1D1F">
      <tspan x="104" dy="0">“获得单晶”不等于“建立批量相纯窗口”；</tspan>
      <tspan x="104" dy="26"><tspan font-weight="700">局部相图</tspan>是连接复现与科学发现的核心实验。</tspan>
    </text>
    <line x1="72" y1="500" x2="628" y2="500" stroke="#D5DBE3" stroke-width="1"/>
    <text x="72" y="536" font-size="18" fill="#5A6573">
      <tspan x="72" dy="0">合成条件表逐字段区分“原文可支持”与“不可支持”，</tspan>
      <tspan x="72" dy="26">36 条结论带原文页码定位</tspan>
    </text>
  </g>
  <g id="p08-directions">
    <rect x="652" y="200" width="556" height="444" fill="#F3F5F8"/>
    <text x="676" y="236" font-size="24" font-weight="700" fill="#1F4D78">四个值得探索的方向（各配工艺与前驱体）</text>
    <text x="676" y="282" font-size="24" fill="#1D1D1F"><tspan fill="#C48A2B" font-weight="700">①</tspan> 目标组成附近的局部相图</text>
    <text x="712" y="310" font-size="18" fill="#5A6573">固相成相组成系列 + 定量 PXRD / Rietveld 相分数</text>
    <text x="676" y="352" font-size="24" fill="#1D1D1F"><tspan fill="#C48A2B" font-weight="700">②</tspan> Zn–Y–氧计量耦合</text>
    <text x="712" y="380" font-size="18" fill="#5A6573">名义 / 实际化学计量对照，EDS / EPMA 与结构模型互证</text>
    <text x="676" y="422" font-size="24" fill="#1D1D1F"><tspan fill="#C48A2B" font-weight="700">③</tspan> 固相成相与高温溶液长晶并行</text>
    <text x="712" y="450" font-size="18" fill="#5A6573">单晶确认结构模型，批量样品测定目标相比例</text>
    <text x="676" y="492" font-size="24" fill="#1D1D1F"><tspan fill="#C48A2B" font-weight="700">④</tspan> Mg / Co 类比与模型前驱体</text>
    <text x="712" y="520" font-size="18" fill="#5A6573">位点 / 价态探针；Co 需联测氧分压与烧后价态</text>
    <line x1="676" y1="548" x2="1184" y2="548" stroke="#D5DBE3" stroke-width="1"/>
    <text x="676" y="580" font-size="18" fill="#1D1D1F">
      <tspan x="676" dy="0"><tspan font-weight="700" fill="#1F4D78">模型候选（待实验验证）</tspan> Zn：ZnO + Y2O3 + SiO2 + BaCO3</tspan>
      <tspan x="676" dy="26">Mg：MgO + Y2O3 + BaCO3 + SiO2</tspan>
      <tspan x="676" dy="26">Co：Co3O4 + Y2O3 + BaCO3 + SiO2</tspan>
    </text>
  </g>
  <g id="p08-footer">
    <text x="72" y="694" font-size="16" fill="#8A94A0">SAGE-Mat · GOAI 2026 AI for Research 复赛</text>
    <text x="1208" y="694" font-size="16" fill="#8A94A0" text-anchor="end">8 / 13</text>
  </g>
</svg>
