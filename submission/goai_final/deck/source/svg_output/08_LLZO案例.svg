<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif'>
  <g id="p08-bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>
  <g id="p08-header">
    <text x="72" y="96" font-size="40" font-weight="700" fill="#1D1D1F">LLZO 诊断轮跑通端到端，并暴露、修复了 11 类集成失效模式</text>
    <rect x="72" y="114" width="72" height="4" fill="#1F4D78"/>
  </g>
  <g id="p08-lead">
    <text x="72" y="166" font-size="26" fill="#1D1D1F">
      <tspan x="72" dy="0">初赛承诺的主题：46 篇文献六个子主题覆盖、46 / 46 核验通过、10 页综述；</tspan>
      <tspan x="72" dy="38">模型 Top-1 与文献一致，Top-2 起出现可疑命名，因此<tspan fill="#C48A2B" font-weight="700">保留“模型生成—规范化—文献复核—审稿”闸门</tspan>。</tspan>
    </text>
  </g>
  <g id="p08-numbers">
    <text x="72" y="286" font-size="56" font-weight="700" fill="#1F4D78">46</text>
    <text x="72" y="316" font-size="18" fill="#5A6573">篇文献入库，修正 3 条元数据后 46 / 46 PASS</text>
    <text x="72" y="396" font-size="56" font-weight="700" fill="#1F4D78">21 · 49</text>
    <text x="72" y="426" font-size="18" fill="#5A6573">个 Agent 任务 · 次 MCP 调用（stdio 协议）</text>
    <text x="72" y="506" font-size="56" font-weight="700" fill="#1F4D78">10 页</text>
    <text x="72" y="536" font-size="18" fill="#5A6573">A4 综述 PDF，46 篇全部整合</text>
  </g>
  <g id="p08-route">
    <rect x="72" y="566" width="448" height="80" fill="#F3F5F8"/>
    <rect x="72" y="566" width="6" height="80" fill="#1F4D78"/>
    <text x="96" y="596" font-size="18" fill="#1D1D1F"><tspan font-weight="700">Top-1</tspan>  ZrO2 + La2O3 + Li2CO3 <tspan fill="#2E7D32" font-weight="700">与文献一致</tspan></text>
    <text x="96" y="626" font-size="18" fill="#1D1D1F"><tspan font-weight="700">Top-2–5</tspan>  LiHO、La(HO)3 等 → <tspan fill="#C62828" font-weight="700">化学路线未验证</tspan></text>
  </g>
  <g id="p08-failure-modes">
    <rect x="556" y="236" width="652" height="330" fill="#F3F5F8"/>
    <use data-icon="tabler-outline/alert-triangle" x="580" y="256" width="28" height="28" fill="#1F4D78" stroke-width="2"/>
    <text x="618" y="278" font-size="24" font-weight="700" fill="#1F4D78">11 类失效模式，全部留痕并修复</text>
    <text x="580" y="320" font-size="18" fill="#1D1D1F">
      <tspan x="580" dy="0">· MCP 审批配置（无人值守自动拒绝）</tspan>
      <tspan x="580" dy="30">· Agent 工作目录错误</tspan>
      <tspan x="580" dy="30">· 并行写文献库竞争</tspan>
      <tspan x="580" dy="30">· exit=0 假成功 / 旧产物假成功</tspan>
      <tspan x="580" dy="30">· 上下文与 token 膨胀</tspan>
      <tspan x="580" dy="30">· 上游 API 限流</tspan>
    </text>
    <text x="900" y="320" font-size="18" fill="#1D1D1F">
      <tspan x="900" dy="0">· 图片 lint 假绿</tspan>
      <tspan x="900" dy="30">· retro 字段不兼容</tspan>
      <tspan x="900" dy="30">· 测试输出契约漂移</tspan>
      <tspan x="900" dy="30">· 同模型审稿独立性不足</tspan>
      <tspan x="900" dy="30">· check-done 单闸门即宣告完成</tspan>
      <tspan x="900" dy="30">  （冷启动首次尝试暴露，PR #17 机械化修复）</tspan>
    </text>
    <text x="580" y="540" font-size="16" fill="#5A6573">修复说明：docs/FAILURE_MODE_FIXES.md · LLZO_AGENT_INTEGRATION_AUDIT.md</text>
  </g>
  <g id="p08-alternatives">
    <text x="556" y="606" font-size="18" fill="#1D1D1F">
      <tspan x="556" dy="0"><tspan font-weight="700" fill="#1F4D78">替代材料分析</tspan>  Li6PS5Cl · Li3YCl6 · LATP 的模型 Top-1 路线均通过文献复核，</tspan>
      <tspan x="556" dy="26">分别对应高电导冷压、高电压正极侧、低成本空气操作三种场景。</tspan>
    </text>
  </g>
  <g id="p08-footer">
    <text x="72" y="694" font-size="16" fill="#8A94A0">SAGE-Mat · GoAI Research · GOAI 2026 复赛 · 留痕：submission/goai_final/run_llzo、submission/llzo_survey</text>
    <text x="1208" y="694" font-size="16" fill="#8A94A0" text-anchor="end">8 / 12</text>
  </g>
</svg>
