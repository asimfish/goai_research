<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif'>
  <g id="cover-bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <rect x="900" y="0" width="380" height="720" fill="#1F4D78"/>
  </g>
  <g id="cover-kicker">
    <text x="72" y="118" font-size="18" fill="#5A6573">GOAI 2026 · AI for Research 赛道 · 材料方向 · 进阶路线 C（合成路线与工艺设计）</text>
    <rect x="72" y="136" width="72" height="4" fill="#C48A2B"/>
  </g>
  <g id="cover-title">
    <text x="72" y="236" font-size="60" font-weight="700" fill="#1D1D1F">SAGE-Mat</text>
    <text x="72" y="296" font-size="30" font-weight="700" fill="#1F4D78">面向无机材料合成调研与合成规划的证据约束多智能体系统</text>
    <text x="72" y="340" font-size="18" fill="#5A6573">开源实现：GoAI Research —— 9 个 agent 技能 · 4 个 MCP server · 账本驱动的质量回环</text>
  </g>
  <g id="cover-lead">
    <text x="72" y="420" font-size="26" fill="#1D1D1F">一行主题进去，<tspan fill="#C48A2B" font-weight="700">可核验的综述、证据链与候选合成路线</tspan>出来</text>
  </g>
  <g id="cover-info">
    <line x1="72" y1="560" x2="828" y2="560" stroke="#D5DBE3" stroke-width="1"/>
    <text x="72" y="596" font-size="18" fill="#1D1D1F">高京（上海交通大学）· 吕丁阳（中国科学院大学）· 李雨峰（上海交通大学）</text>
    <text x="72" y="628" font-size="18" fill="#5A6573">Harness：Codex CLI 0.146.1 · 模型 gpt-5.6-sol · reasoning xhigh</text>
    <text x="72" y="660" font-size="18" fill="#5A6573">github.com/asimfish/goai_research · tag goai-final-2026-09-03 · MIT</text>
  </g>
  <g id="cover-numbers">
    <text x="948" y="150" font-size="56" font-weight="700" fill="#FFFFFF">51 / 51</text>
    <text x="948" y="182" font-size="18" fill="#FFFFFF" fill-opacity="0.8">正式报告文献三轴核验全部通过</text>
    <text x="948" y="290" font-size="56" font-weight="700" fill="#FFFFFF">100 条</text>
    <text x="948" y="322" font-size="18" fill="#FFFFFF" fill-opacity="0.8">结论逐条追溯到 DOI 与原文</text>
    <text x="948" y="430" font-size="56" font-weight="700" fill="#FFFFFF">2,558</text>
    <text x="948" y="462" font-size="18" fill="#FFFFFF" fill-opacity="0.8">条留出反应的前驱体预测基准（随 checkpoint 提交）</text>
    <text x="948" y="570" font-size="56" font-weight="700" fill="#FFFFFF">23 页</text>
    <text x="948" y="602" font-size="18" fill="#FFFFFF" fill-opacity="0.8">纯主题冷启动生成的正式综述</text>
    <line x1="948" y1="650" x2="1232" y2="650" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>
    <text x="948" y="684" font-size="16" fill="#FFFFFF" fill-opacity="0.8">2026-09 · 复赛作品说明</text>
  </g>
</svg>
