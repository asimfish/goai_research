<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif'>
  <g id="cover-bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
    <rect x="900" y="0" width="380" height="720" fill="#1F4D78"/>
  </g>
  <g id="cover-kicker">
    <text x="72" y="118" font-size="18" fill="#5A6573">GOAI 2026 · AI for Research 赛道 · 材料方向 · 进阶路线 C（合成路线与工艺设计）</text>
    <rect x="72" y="136" width="72" height="4" fill="#C48A2B"/>
  </g>
  <g id="cover-title">
    <text x="72" y="236" font-size="60" font-weight="700" fill="#1D1D1F">SAGE-Mat</text>
    <text x="72" y="296" font-size="30" font-weight="700" fill="#1F4D78">面向无机材料合成调研与合成规划的证据约束多智能体系统</text>
    <text x="72" y="340" font-size="18" fill="#5A6573">9 个 Agent 角色 · 4 个自研 MCP 服务 · 25 个工具 · 程序把关的质量回环</text>
  </g>
  <g id="cover-lead">
    <text x="72" y="420" font-size="26" fill="#1D1D1F">一行主题进去，<tspan fill="#C48A2B" font-weight="700">可核验的综述、证据链与候选合成路线</tspan>出来</text>
  </g>
  <g id="cover-info">
    <line x1="72" y1="560" x2="828" y2="560" stroke="#D5DBE3" stroke-width="1"/>
    <text x="72" y="596" font-size="18" fill="#1D1D1F">高京（上海交通大学）· 吕丁阳（中国科学院大学）· 李雨峰（上海交通大学）</text>
    <text x="72" y="660" font-size="18" fill="#5A6573">MIT</text>
    <use data-icon="tabler-outline/brand-github" x="112" y="638" width="22" height="22" fill="#1F4D78" stroke-width="2"/>
    <text x="144" y="660" font-size="18" fill="#5A6573">asimfish/goai_research</text>
  </g>
  <g id="cover-numbers">
    <text x="948" y="150" font-size="56" font-weight="700" fill="#FFFFFF">3.8 kw 篇</text>
    <text x="948" y="182" font-size="18" fill="#FFFFFF" fill-opacity="0.8">
      <tspan x="948" dy="0">本地文献全文库（约 3,757 万篇）</tspan>
      <tspan x="948" dy="24">+ 在线五源检索</tspan>
    </text>
    <text x="948" y="290" font-size="56" font-weight="700" fill="#FFFFFF">9 个</text>
    <text x="948" y="322" font-size="18" fill="#FFFFFF" fill-opacity="0.8">
      <tspan x="948" dy="0">Agent 角色 · 4 个自研 MCP 服务</tspan>
      <tspan x="948" dy="24">· 25 个工具</tspan>
    </text>
    <text x="948" y="430" font-size="56" font-weight="700" fill="#FFFFFF">28 条</text>
    <text x="948" y="462" font-size="18" fill="#FFFFFF" fill-opacity="0.8">
      <tspan x="948" dy="0">合成条件逐字段比较：目标相</tspan>
      <tspan x="948" dy="24">Ba–Y–Zn–Si–O 及 4 个近邻体系</tspan>
    </text>
    <text x="948" y="570" font-size="56" font-weight="700" fill="#FFFFFF">7 种 · 4 个</text>
    <text x="948" y="602" font-size="18" fill="#FFFFFF" fill-opacity="0.8">
      <tspan x="948" dy="0">目标化合物的前驱体路线预测</tspan>
      <tspan x="948" dy="24">· 值得探索的新实验方向</tspan>
    </text>
    <line x1="948" y1="650" x2="1232" y2="650" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1"/>
  </g>
  <g id="p01-footer">
    <text x="1208" y="694" font-size="16" fill="#FFFFFF" fill-opacity="0.8" text-anchor="end">2026-09 · 复赛作品说明</text>
  </g>
</svg>
