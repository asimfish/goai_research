<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif'>
  <g id="p03-bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>
  <g id="p03-header">
    <text x="72" y="96" font-size="40" font-weight="700" fill="#1D1D1F">系统把“生成像论文的结论”改为“保存证据与判定过程”</text>
    <rect x="72" y="114" width="72" height="4" fill="#1F4D78"/>
  </g>
  <g id="p03-lead">
    <text x="72" y="166" font-size="26" fill="#1D1D1F">三层分离：认知交给宿主模型，确定性工作进 MCP 服务，<tspan fill="#C48A2B" font-weight="700">“做完了”由程序检查</tspan>。</text>
  </g>
  <g id="p03-figure">
    <rect x="72" y="200" width="700" height="389" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1"/>
    <image href="../images/system_pipeline.png" x="72" y="200" width="700" height="389" preserveAspectRatio="xMidYMid meet"/>
    <text x="72" y="622" font-size="16" fill="#5A6573">图：发现 → 生产（并行）→ 质量回环；系统自绘，同源输出论文图与 draw.io 可编辑图。</text>
  </g>
  <g id="p03-layer-cognitive">
    <rect x="812" y="200" width="6" height="160" fill="#1F4D78"/>
    <use data-icon="tabler-outline/hierarchy-2" x="836" y="204" width="28" height="28" fill="#1F4D78" stroke-width="2"/>
    <text x="874" y="226" font-size="24" font-weight="700" fill="#1F4D78">认知层 · 9 个 Agent 角色</text>
    <text x="836" y="258" font-size="18" fill="#1D1D1F">
      <tspan x="836" dy="0">编排 / 文献检索 / 写作风格学习 / 引用核对</tspan>
      <tspan x="836" dy="24">分类与写作 / 学术插图绘制 / 旧图可编辑化</tspan>
      <tspan x="836" dy="24">想法与实验方案 / 对抗审稿；</tspan>
      <tspan x="836" dy="24">全部是 Markdown 写成的角色说明，</tspan>
      <tspan x="836" dy="24">由 Codex 执行</tspan>
    </text>
  </g>
  <g id="p03-layer-deterministic">
    <rect x="812" y="372" width="6" height="160" fill="#4F8A9E"/>
    <use data-icon="tabler-outline/database" x="836" y="376" width="28" height="28" fill="#1F4D78" stroke-width="2"/>
    <text x="874" y="398" font-size="24" font-weight="700" fill="#1F4D78">确定性层 · 4 个 MCP 服务</text>
    <text x="836" y="430" font-size="18" fill="#1D1D1F">
      <tspan x="836" dy="0">文献检索：arXiv、OpenAlex、Crossref、</tspan>
      <tspan x="836" dy="24">Semantic Scholar 等在线库 + 本地全文库</tspan>
      <tspan x="836" dy="24">引用核对：逐条比对题录与作者顺序</tspan>
      <tspan x="836" dy="24">绘图：一份图源同时出论文图与可编辑图</tspan>
      <tspan x="836" dy="24">前驱体预测：RECIPE 两阶段模型</tspan>
    </text>
  </g>
  <g id="p03-layer-control">
    <rect x="812" y="540" width="6" height="120" fill="#C48A2B"/>
    <use data-icon="tabler-outline/repeat" x="836" y="544" width="28" height="28" fill="#1F4D78" stroke-width="2"/>
    <text x="874" y="566" font-size="24" font-weight="700" fill="#1F4D78">控制层 · 流程与质量把关</text>
    <text x="836" y="598" font-size="18" fill="#1D1D1F">
      <tspan x="836" dy="0">每个阶段有明确完成标准：文献覆盖、引用全部</tspan>
      <tspan x="836" dy="24">核对、图文齐全、审稿通过；由程序检查，</tspan>
      <tspan x="836" dy="24">不由模型自己宣布完成；写稿与审稿分离。</tspan>
    </text>
  </g>
  <g id="p03-footer">
    <text x="72" y="694" font-size="16" fill="#8A94A0">SAGE-Mat · GOAI 2026 AI for Research 复赛</text>
    <text x="1208" y="694" font-size="16" fill="#8A94A0" text-anchor="end">3 / 13</text>
  </g>
</svg>
