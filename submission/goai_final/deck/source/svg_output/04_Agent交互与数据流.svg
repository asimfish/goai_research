<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif'>
  <defs>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1F4D78"/>
    </marker>
    <marker id="reworkArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C48A2B"/>
    </marker>
    <marker id="loopArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#4F8A9E"/>
    </marker>
  </defs>
  <g id="p04-bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>
  <g id="p04-header">
    <text x="72" y="96" font-size="40" font-weight="700" fill="#1D1D1F">Agent 通过产物文件与共享进度记录交接，每一步都可审计</text>
    <rect x="72" y="114" width="72" height="4" fill="#1F4D78"/>
  </g>
  <g id="p04-lead">
    <text x="72" y="166" font-size="26" fill="#1D1D1F">中间产物在六类 Agent 之间逐级流转；<tspan fill="#C48A2B" font-weight="700">程序检查通过才进入下一环</tspan>，审稿 issue 沿原路返工。</text>
  </g>
  <g id="p04-lane-rule">
    <text x="72" y="232" font-size="16" fill="#8A94A0">Agent</text>
    <text x="72" y="252" font-size="16" fill="#8A94A0">Codex 执行 skill</text>
    <text x="72" y="324" font-size="16" fill="#8A94A0">MCP 工具</text>
    <text x="72" y="366" font-size="16" fill="#8A94A0">交接产物</text>
    <line x1="72" y1="378" x2="1208" y2="378" stroke="#D5DBE3" stroke-width="1"/>
  </g>
  <g id="step-1-orchestrator">
    <rect x="200" y="208" width="140" height="60" fill="#1F4D78"/>
    <text x="270" y="233" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">编排器</text>
    <text x="270" y="256" font-size="16" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">orchestrator</text>
    <rect x="200" y="300" width="140" height="36" fill="#F3F5F8"/>
    <text x="270" y="324" font-size="16" fill="#1D1D1F" text-anchor="middle">读进度 · 分派任务</text>
    <text x="270" y="366" font-size="16" font-weight="700" fill="#C48A2B" text-anchor="middle">主题 → scope.md</text>
    <line x1="342" y1="238" x2="366" y2="238" stroke="#1F4D78" stroke-width="2" marker-end="url(#flowArrow)"/>
  </g>
  <g id="step-2-litsearch">
    <rect x="370" y="208" width="140" height="60" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <text x="440" y="233" font-size="18" font-weight="700" fill="#1F4D78" text-anchor="middle">文献检索</text>
    <text x="440" y="256" font-size="16" fill="#5A6573" text-anchor="middle">lit-search</text>
    <rect x="370" y="300" width="140" height="36" fill="#F3F5F8"/>
    <text x="440" y="324" font-size="16" fill="#1D1D1F" text-anchor="middle">五源检索 · 本地库</text>
    <text x="440" y="366" font-size="16" font-weight="700" fill="#C48A2B" text-anchor="middle">papers.jsonl</text>
    <line x1="512" y1="238" x2="536" y2="238" stroke="#1F4D78" stroke-width="2" marker-end="url(#flowArrow)"/>
  </g>
  <g id="step-3-refguard">
    <rect x="540" y="208" width="140" height="60" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <text x="610" y="233" font-size="18" font-weight="700" fill="#1F4D78" text-anchor="middle">引用核验</text>
    <text x="610" y="256" font-size="16" fill="#5A6573" text-anchor="middle">ref-guard</text>
    <rect x="540" y="300" width="140" height="36" fill="#F3F5F8"/>
    <text x="610" y="324" font-size="16" letter-spacing="-0.5" fill="#1D1D1F" text-anchor="middle">题录与作者比对</text>
    <text x="610" y="366" font-size="16" font-weight="700" fill="#C48A2B" text-anchor="middle">bib 51/51 PASS</text>
    <line x1="682" y1="238" x2="706" y2="238" stroke="#1F4D78" stroke-width="2" marker-end="url(#flowArrow)"/>
  </g>
  <g id="step-4-writer-figure">
    <rect x="710" y="208" width="140" height="60" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <text x="780" y="233" font-size="18" font-weight="700" fill="#1F4D78" text-anchor="middle">写作 · 图纸</text>
    <text x="780" y="256" font-size="16" fill="#5A6573" text-anchor="middle">writer · figure</text>
    <rect x="710" y="300" width="140" height="36" fill="#F3F5F8"/>
    <text x="780" y="324" font-size="16" fill="#1D1D1F" text-anchor="middle">figspec 双渲染</text>
    <text x="780" y="366" font-size="16" font-weight="700" fill="#C48A2B" text-anchor="middle">tex + 图源</text>
    <line x1="852" y1="238" x2="876" y2="238" stroke="#1F4D78" stroke-width="2" marker-end="url(#flowArrow)"/>
  </g>
  <g id="step-5-ideaforge">
    <rect x="880" y="208" width="140" height="60" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <text x="950" y="233" font-size="18" font-weight="700" fill="#1F4D78" text-anchor="middle">想法生成</text>
    <text x="950" y="256" font-size="16" fill="#5A6573" text-anchor="middle">idea-forge</text>
    <rect x="880" y="300" width="140" height="36" fill="#4F8A9E"/>
    <text x="950" y="324" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">RECIPE 前驱体</text>
    <text x="950" y="366" font-size="16" font-weight="700" fill="#C48A2B" text-anchor="middle">模型候选路线 ×3</text>
    <line x1="1022" y1="238" x2="1046" y2="238" stroke="#1F4D78" stroke-width="2" marker-end="url(#flowArrow)"/>
  </g>
  <g id="step-6-reviewer">
    <rect x="1050" y="208" width="140" height="60" fill="#FFFFFF" stroke="#C48A2B" stroke-width="1.5"/>
    <text x="1120" y="233" font-size="18" font-weight="700" fill="#1F4D78" text-anchor="middle">对抗审稿</text>
    <text x="1120" y="256" font-size="16" fill="#5A6573" text-anchor="middle">reviewer</text>
    <rect x="1050" y="300" width="140" height="36" fill="#F3F5F8"/>
    <text x="1120" y="324" font-size="16" fill="#1D1D1F" text-anchor="middle">新上下文 · 三视角</text>
    <text x="1120" y="366" font-size="16" font-weight="700" fill="#C48A2B" text-anchor="middle">issue · 审稿记录</text>
  </g>
  <g id="rework-route">
    <path d="M1120,270 L1120,290 L780,290 L780,274" fill="none" stroke="#C48A2B" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#reworkArrow)"/>
    <text x="950" y="283" font-size="16" fill="#C48A2B" text-anchor="middle">issue 带 target 阶段 · 沿原路返工 · 三轮未收敛交人决定</text>
  </g>
  <g id="ledger-bar">
    <rect x="72" y="392" width="1136" height="44" fill="#F3F5F8"/>
    <text x="88" y="420" font-size="18" font-weight="700" fill="#1F4D78">共享进度记录</text>
    <text x="268" y="420" font-size="16" fill="#1D1D1F">记录每一步是否通过、待返工问题与产物版本；上游一变，下游自动重查</text>
    <circle cx="1000" cy="414" r="6" fill="#1F4D78"/><circle cx="1024" cy="414" r="6" fill="#C48A2B"/><circle cx="1048" cy="414" r="6" fill="#C48A2B"/><circle cx="1072" cy="414" r="6" fill="#1F4D78"/><circle cx="1096" cy="414" r="6" fill="#1F4D78"/><circle cx="1120" cy="414" r="6" fill="#1F4D78"/><circle cx="1144" cy="414" r="6" fill="#1F4D78"/><circle cx="1168" cy="414" r="6" fill="#C48A2B"/><circle cx="1192" cy="414" r="6" fill="#1F4D78"/>
  </g>
  <g id="loop-output">
    <rect x="72" y="462" width="340" height="86" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <rect x="72" y="462" width="340" height="5" fill="#1F4D78"/>
    <text x="92" y="494" font-size="18" font-weight="700" fill="#1F4D78">本轮输出</text>
    <text x="92" y="520" font-size="16" fill="#1D1D1F">综述 PDF · claim_evidence.jsonl</text>
    <text x="92" y="540" font-size="16" fill="#1D1D1F">候选路线 + 前驱体 + 表征方案 + 失败判据</text>
    <line x1="414" y1="505" x2="464" y2="505" stroke="#4F8A9E" stroke-width="2" marker-end="url(#loopArrow)"/>
  </g>
  <g id="loop-lab">
    <rect x="468" y="462" width="340" height="86" fill="#FFFFFF" stroke="#4F8A9E" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="468" y="462" width="340" height="5" fill="#4F8A9E"/>
    <text x="488" y="494" font-size="18" font-weight="700" fill="#4F8A9E">自动化实验室（下一环）</text>
    <text x="488" y="520" font-size="16" fill="#1D1D1F">按方案合成 · PXRD / 单晶 / EDS 表征</text>
    <text x="488" y="540" font-size="16" fill="#1D1D1F">结构化结果与失败判据同格式记录</text>
    <line x1="810" y1="505" x2="860" y2="505" stroke="#4F8A9E" stroke-width="2" marker-end="url(#loopArrow)"/>
  </g>
  <g id="loop-feedback">
    <rect x="864" y="462" width="344" height="86" fill="#FFFFFF" stroke="#4F8A9E" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="864" y="462" width="344" height="5" fill="#4F8A9E"/>
    <text x="884" y="494" font-size="18" font-weight="700" fill="#4F8A9E">结果回写为证据</text>
    <text x="884" y="520" font-size="16" fill="#1D1D1F">实验记录进入证据库与共享进度记录</text>
    <text x="884" y="540" font-size="16" fill="#1D1D1F">触发新一轮检索、假设与路线更新</text>
    <path d="M1036,550 L1036,566 L56,566 L56,194 L270,194 L270,204" fill="none" stroke="#4F8A9E" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#loopArrow)"/>
    <text x="640" y="586" font-size="16" fill="#4F8A9E" text-anchor="middle">闭环：新证据回到编排器，开启下一轮检索、核验与假设</text>
  </g>
  <g id="takeaway">
    <rect x="72" y="604" width="6" height="56" fill="#C48A2B"/>
    <text x="96" y="626" font-size="18" fill="#1D1D1F"><tspan font-weight="700" fill="#1F4D78">解决的科学问题</tspan>　文献能限定什么、哪些近邻条件可迁移、下一步做什么实验最有发现价值</text>
    <text x="96" y="654" font-size="18" fill="#1D1D1F"><tspan font-weight="700" fill="#1F4D78">对闭环探索的关键</tspan>　每条建议都带证据、可执行、可回写；需要人确认的节点与程序质量检查保证可信而不失自动化</text>
  </g>
  <g id="p04-footer">
    <text x="72" y="694" font-size="16" fill="#8A94A0">SAGE-Mat · GOAI 2026 AI for Research 复赛</text>
    <text x="1208" y="694" font-size="16" fill="#8A94A0" text-anchor="end">4 / 13</text>
  </g>
</svg>
