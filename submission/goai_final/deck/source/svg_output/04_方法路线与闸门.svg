<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif'>
  <g id="p04-bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>
  <g id="p04-header">
    <text x="72" y="96" font-size="40" font-weight="700" fill="#1D1D1F">九个出口闸门由代码判定完成，审与做分离</text>
    <rect x="72" y="114" width="72" height="4" fill="#1F4D78"/>
  </g>
  <g id="p04-lead">
    <text x="72" y="166" font-size="26" fill="#1D1D1F">
      <tspan x="72" dy="0">完成不是模型自报：<tspan font-family='Consolas, "Courier New", monospace'>check-done</tspan> 只在九个闸门全部落账、无 FAIL、</tspan>
      <tspan x="72" dy="38">无 open blocker / major，且 <tspan font-family='Consolas, "Courier New", monospace'>review_pass</tspan> 指向真实存在的审稿 trace 时才退出 0。</tspan>
    </text>
  </g>
  <g id="p04-gate-chain">
    <line x1="126" y1="272" x2="1154" y2="272" stroke="#D5DBE3" stroke-width="2"/>
    <rect x="72" y="240" width="108" height="64" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <rect x="72" y="240" width="108" height="5" fill="#1F4D78"/>
    <text x="126" y="280" font-size="18" fill="#1D1D1F" text-anchor="middle">范围确认</text>
    <rect x="200.5" y="240" width="108" height="64" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <rect x="200.5" y="240" width="108" height="5" fill="#C48A2B"/>
    <text x="254.5" y="280" font-size="18" fill="#1D1D1F" text-anchor="middle">文献覆盖</text>
    <rect x="329" y="240" width="108" height="64" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <rect x="329" y="240" width="108" height="5" fill="#C48A2B"/>
    <text x="383" y="280" font-size="18" fill="#1D1D1F" text-anchor="middle">风格库</text>
    <rect x="457.5" y="240" width="108" height="64" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <rect x="457.5" y="240" width="108" height="5" fill="#1F4D78"/>
    <text x="511.5" y="280" font-size="18" fill="#1D1D1F" text-anchor="middle">引用完整性</text>
    <rect x="586" y="240" width="108" height="64" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <rect x="586" y="240" width="108" height="5" fill="#1F4D78"/>
    <text x="640" y="280" font-size="18" fill="#1D1D1F" text-anchor="middle">分类法</text>
    <rect x="714.5" y="240" width="108" height="64" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <rect x="714.5" y="240" width="108" height="5" fill="#1F4D78"/>
    <text x="768.5" y="280" font-size="18" fill="#1D1D1F" text-anchor="middle">图纸</text>
    <rect x="843" y="240" width="108" height="64" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <rect x="843" y="240" width="108" height="5" fill="#1F4D78"/>
    <text x="897" y="280" font-size="18" fill="#1D1D1F" text-anchor="middle">稿件</text>
    <rect x="971.5" y="240" width="108" height="64" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <rect x="971.5" y="240" width="108" height="5" fill="#C48A2B"/>
    <text x="1025.5" y="280" font-size="18" fill="#1D1D1F" text-anchor="middle">想法审稿</text>
    <rect x="1100" y="240" width="108" height="64" fill="#1F4D78" stroke="#1F4D78" stroke-width="1.5"/>
    <text x="1154" y="280" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">终审</text>
    <rect x="72" y="322" width="14" height="5" fill="#1F4D78"/>
    <text x="94" y="331" font-size="16" fill="#5A6573">PASS（正式运行）</text>
    <rect x="232" y="322" width="14" height="5" fill="#C48A2B"/>
    <text x="254" y="331" font-size="16" fill="#5A6573">WARN：显式记录的降级（niche-balanced 覆盖档、风格库仅 15 篇综述、想法为诊断级）</text>
  </g>
  <g id="p04-human-gates">
    <rect x="72" y="372" width="556" height="270" fill="#F3F5F8"/>
    <use data-icon="tabler-outline/users" x="96" y="392" width="28" height="28" fill="#1F4D78" stroke-width="2"/>
    <text x="134" y="414" font-size="24" font-weight="700" fill="#1F4D78">人工停点：正式运行触发 4 次，同一主题续跑</text>
    <text x="96" y="456" font-size="18" fill="#1D1D1F">
      <tspan x="96" dy="0">① 范围草案自动确认（裸主题、范围无实质歧义）</tspan>
      <tspan x="96" dy="34">② 5 条作者名 MISMATCH 三轮未收敛 → 升级人工，</tspan>
      <tspan x="96" dy="26">    采纳“删除这 5 条背景文献并继续”</tspan>
      <tspan x="96" dy="34">③ 贡献结构确认：身份谱系 / 路线—变量—验证矩阵 / 迁移边界</tspan>
      <tspan x="96" dy="34">④ 终审：0 blocker / 0 major / 0 minor，PASS 带回执落账</tspan>
    </text>
  </g>
  <g id="p04-adversarial-review">
    <rect x="652" y="372" width="556" height="270" fill="#F3F5F8"/>
    <use data-icon="tabler-outline/shield-check" x="676" y="392" width="28" height="28" fill="#1F4D78" stroke-width="2"/>
    <text x="714" y="414" font-size="24" font-weight="700" fill="#1F4D78">对抗审稿：审与做永远分离</text>
    <text x="676" y="456" font-size="18" fill="#1D1D1F">
      <tspan x="676" dy="0">· 全新上下文的独立 reviewer；先验证后批评</tspan>
      <tspan x="676" dy="26">  （指控引用造假前必须先跑 verify_entry）</tspan>
      <tspan x="676" dy="34">· 三视角裁决：领域专家 / 方法严谨派 / 期刊编辑</tspan>
      <tspan x="676" dy="34">· 结构化 issue 带 target 阶段，路由回属主返工，</tspan>
      <tspan x="676" dy="26">  上游变更级联重置下游闸门</tspan>
      <tspan x="676" dy="34">· 同一 issue 三轮未收敛升级人类；无回执的 PASS 被账本拒绝</tspan>
    </text>
  </g>
  <g id="p04-footer">
    <text x="72" y="694" font-size="16" fill="#8A94A0">SAGE-Mat · GoAI Research · GOAI 2026 复赛</text>
    <text x="1208" y="694" font-size="16" fill="#8A94A0" text-anchor="end">4 / 12</text>
  </g>
</svg>
