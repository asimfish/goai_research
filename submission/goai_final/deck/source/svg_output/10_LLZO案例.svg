<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif'>
  <g id="p10-bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>
  <g id="p10-header">
    <text x="72" y="96" font-size="40" font-weight="700" fill="#1D1D1F">LLZO 证据综合：三项判别实验贯通工艺—结构—电导</text>
    <rect x="72" y="114" width="72" height="4" fill="#1F4D78"/>
  </g>
  <g id="p10-lead">
    <text x="72" y="166" font-size="26" fill="#1D1D1F">
      <tspan x="72" dy="0">文献丰富并不等于结果可比；最新终稿把组成、锂库存、致密化、界面与测量几何</tspan>
      <tspan x="72" dy="38">串成<tspan fill="#C48A2B" font-weight="700">工艺—结构—输运链</tspan>，并给出统一的最小比较记录。</tspan>
    </text>
  </g>
  <g id="p10-numbers">
    <text x="72" y="286" font-size="56" font-weight="700" fill="#1F4D78">368 / 368</text>
    <text x="72" y="316" font-size="18" fill="#5A6573">引用审计记录全部 PASS</text>
    <text x="72" y="396" font-size="56" font-weight="700" fill="#1F4D78">212 · 378</text>
    <text x="72" y="426" font-size="18" fill="#5A6573">篇正文文献 · 次引用调用</text>
    <text x="72" y="506" font-size="56" font-weight="700" fill="#1F4D78">16 页</text>
    <text x="72" y="536" font-size="18" fill="#5A6573">10 节 · 3 图 · 5 表 · 2 个显示公式</text>
  </g>
  <g id="p10-route">
    <rect x="72" y="566" width="448" height="80" fill="#F3F5F8"/>
    <rect x="72" y="566" width="6" height="80" fill="#1F4D78"/>
    <text x="96" y="596" font-size="18" fill="#1D1D1F"><tspan font-weight="700">核心产出</tspan>  3 个研究提案 + 3 个结构化实验计划</text>
    <text x="96" y="626" font-size="18" fill="#1D1D1F"><tspan font-weight="700">制作状态</tspan>  I22 排版缺陷已修复；独立复审待刷新</text>
  </g>
  <g id="p10-failure-modes">
    <rect x="556" y="236" width="652" height="330" fill="#F3F5F8"/>
    <use data-icon="tabler-outline/shield-check" x="580" y="256" width="28" height="28" fill="#1F4D78" stroke-width="2"/>
    <text x="618" y="278" font-size="24" font-weight="700" fill="#1F4D78">为什么不能只比较一个电导率数字</text>
    <text x="580" y="320" font-size="18" fill="#1D1D1F">
      <tspan x="580" dy="0">· 掺杂与锂库存共同改变相稳定性和载流子占位</tspan>
      <tspan x="580" dy="30">· 前驱体与生坯历史决定反应尺度，烧结决定锂损失与晶界</tspan>
      <tspan x="580" dy="30">· 电极、压力、厚度与拟合模型会改变“测得的电导率”</tspan>
      <tspan x="580" dy="30">· 不控制密度和测量几何，就不能公平排名不同路线</tspan>
      <tspan x="580" dy="30">· 当前证据不支持完整 LLZO 相图或通用最佳路线</tspan>
    </text>
  </g>
  <g id="p10-alternatives">
    <text x="556" y="606" font-size="18" fill="#1D1D1F">
      <tspan x="556" dy="0"><tspan font-weight="700" fill="#1F4D78">三项判别实验</tspan>  锂活度交互图 · 等密度 Ta–LLZO 晶界研究 ·</tspan>
      <tspan x="556" dy="26">超快烧结后表面清理的配对样本测试；每项均预设失败判据。</tspan>
    </text>
  </g>
  <g id="p10-footer">
    <text x="72" y="694" font-size="16" fill="#8A94A0">SAGE-Mat · GOAI 2026 AI for Research 复赛</text>
    <text x="1208" y="694" font-size="16" fill="#8A94A0" text-anchor="end">10 / 13</text>
  </g>
</svg>
