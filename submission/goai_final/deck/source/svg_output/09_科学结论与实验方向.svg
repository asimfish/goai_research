<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif'>
  <g id="p09-bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>
  <g id="p09-header">
    <text x="72" y="96" font-size="40" font-weight="700" fill="#1D1D1F">缺的不是单一配方，而是四元相图与平衡 / 亚稳态判据</text>
    <rect x="72" y="114" width="72" height="4" fill="#1F4D78"/>
  </g>
  <g id="p09-lead">
    <text x="72" y="166" font-size="26" fill="#1D1D1F">系统把“已报道事实—近邻类比—模型候选”分开，给出三个<tspan fill="#C48A2B" font-weight="700">可证伪实验方向</tspan>。</text>
  </g>
  <g id="p09-conclusions">
    <text x="72" y="222" font-size="24" font-weight="700" fill="#1F4D78">既有文献能够确认什么</text>
    <text x="72" y="270" font-size="24" font-weight="700" fill="#C48A2B">1</text>
    <text x="104" y="270" font-size="18" fill="#1D1D1F">
      <tspan x="104" dy="0">513 条核验文献仍未证明可复现的相纯四元晶相；</tspan>
      <tspan x="104" dy="24">邻近硅酸盐只支持结构、路线或热力学边界，</tspan>
      <tspan x="104" dy="24">不能替代 Ba–Y–Zn–Si–O 目标证据。</tspan>
    </text>
    <text x="72" y="366" font-size="24" font-weight="700" fill="#C48A2B">2</text>
    <text x="104" y="366" font-size="18" fill="#1D1D1F">
      <tspan x="104" dy="0">可比较记录须保留实际组成、前驱体、坩埚 / 气氛、</tspan>
      <tspan x="104" dy="24">升降温与淬冷历史、相组成和不确定性；</tspan>
      <tspan x="104" dy="24">字段不全时不做“最佳路线”排名。</tspan>
    </text>
    <text x="72" y="462" font-size="24" font-weight="700" fill="#C48A2B">3</text>
    <text x="104" y="462" font-size="18" fill="#1D1D1F">XRD、EPMA / WDS 与热历史联合判读；</text>
    <text x="104" y="486" font-size="18" fill="#1D1D1F"><tspan font-weight="700">相纯</tspan>、组成漂移与动力学滞留须分别判定。</text>
    <line x1="72" y1="530" x2="628" y2="530" stroke="#D5DBE3" stroke-width="1"/>
    <text x="72" y="564" font-size="18" fill="#5A6573">
      <tspan x="72" dy="0">直接证据不足时明确降级，不把综述覆盖度、</tspan>
      <tspan x="72" dy="24">模型置信度或邻近成功误写成目标相已经合成。</tspan>
    </text>
  </g>
  <g id="p09-directions">
    <rect x="652" y="200" width="556" height="444" fill="#F3F5F8"/>
    <text x="676" y="236" font-size="24" font-weight="700" fill="#1F4D78">三个优先实验（各有失败判据）</text>
    <text x="676" y="282" font-size="24" fill="#1D1D1F"><tspan fill="#C48A2B" font-weight="700">①</tspan> 测量缺失的四元相图子空间</text>
    <text x="712" y="310" font-size="18" fill="#5A6573">组成网格 + 平衡 / 淬冷配对</text>
    <text x="712" y="332" font-size="18" fill="#5A6573">XRD 与 EPMA / WDS 联合判定</text>
    <text x="676" y="372" font-size="24" fill="#1D1D1F"><tspan fill="#C48A2B" font-weight="700">②</tspan> 区分亚稳态与组成漂移</text>
    <text x="712" y="400" font-size="18" fill="#5A6573">时间—温度—冷却路径矩阵</text>
    <text x="712" y="422" font-size="18" fill="#5A6573">联测 Zn 损失、热分析与结构变化</text>
    <text x="676" y="462" font-size="24" fill="#1D1D1F"><tspan fill="#C48A2B" font-weight="700">③</tspan> 不确定性感知的闭环选点</text>
    <text x="712" y="490" font-size="18" fill="#5A6573">盲测 + 重复样；按信息增益评估</text>
    <text x="712" y="512" font-size="18" fill="#5A6573">控制假阳性，不让模型置信度自证</text>
    <line x1="676" y1="548" x2="1184" y2="548" stroke="#D5DBE3" stroke-width="1"/>
    <text x="676" y="576" font-size="18" fill="#1D1D1F">
      <tspan x="676" dy="0"><tspan font-weight="700" fill="#1F4D78">模型候选（待实验验证）</tspan> 氧化物 / 碳酸盐基线；</tspan>
      <tspan x="676" dy="22">其他路线只作对照，不作为目标相阳性证据。</tspan>
      <tspan x="676" dy="22">这里只定义测量问题与判据，不给出实验操作规程。</tspan>
    </text>
  </g>
  <g id="p09-footer">
    <text x="72" y="694" font-size="16" fill="#8A94A0">SAGE-Mat · GOAI 2026 AI for Research 复赛</text>
    <text x="1208" y="694" font-size="16" fill="#8A94A0" text-anchor="end">9 / 13</text>
  </g>
</svg>
