<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif'>
  <g id="p09-bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>
  <g id="p09-header">
    <text x="72" y="96" font-size="40" font-weight="700" fill="#1D1D1F">留出测试集 Combo@1 71.81，比 Retrieval-Retro 高 11.4 点</text>
    <rect x="72" y="114" width="72" height="4" fill="#1F4D78"/>
  </g>
  <g id="p09-lead">
    <text x="72" y="166" font-size="26" fill="#1D1D1F">
      <tspan x="72" dy="0">指标来自随 checkpoint 提交的源包评测汇总（2,558 条留出反应），落在论文三种子区间内；</tspan>
      <tspan x="72" dy="38">逆合成部分只交 checkpoint、最小加载/预测代码与原料库，<tspan fill="#C48A2B" font-weight="700">CPU dry run 保证模型可加载、可预测</tspan>。</tspan>
    </text>
  </g>
  <g id="p09-legend">
    <rect x="140" y="220" width="16" height="16" fill="#8A94A0"/>
    <text x="166" y="233" font-size="16" fill="#5A6573">Retrieval-Retro（先前最优基线）</text>
    <rect x="420" y="220" width="16" height="16" fill="#1F4D78"/>
    <text x="446" y="233" font-size="16" fill="#5A6573">RECIPE（checkpoint 评测汇总，种子 20260504）</text>
  </g>
  <g id="p09-chart" data-pptx-native="chart">
    <metadata data-pptx-native="chart">
      {
        "name": "p09-retro-benchmark",
        "x": 100,
        "y": 240,
        "width": 720,
        "height": 360,
        "type": "column",
        "categories": ["Combo@1", "Combo@5", "Combo@20", "Combo MRR"],
        "series": [
          {"name": "Retrieval-Retro", "values": [60.40, 66.22, 69.00, 63.29]},
          {"name": "RECIPE (checkpoint summary)", "values": [71.81, 84.71, 89.21, 77.48]}
        ],
        "data_labels": {"number_format": "0.00", "font_size": 16},
        "style": {"colors": ["#8A94A0", "#1F4D78"], "font_family": "Microsoft YaHei"}
      }
    </metadata>
    <g id="chartArea">
      <line x1="140" y1="560" x2="800" y2="560" stroke="#E6EAF0" stroke-width="1"/>
      <line x1="140" y1="480" x2="800" y2="480" stroke="#E6EAF0" stroke-width="1"/>
      <line x1="140" y1="400" x2="800" y2="400" stroke="#E6EAF0" stroke-width="1"/>
      <line x1="140" y1="320" x2="800" y2="320" stroke="#E6EAF0" stroke-width="1"/>
      <line x1="140" y1="240" x2="800" y2="240" stroke="#E6EAF0" stroke-width="1"/>
      <text x="128" y="565" font-size="16" fill="#8A94A0" text-anchor="end">0</text>
      <text x="128" y="485" font-size="16" fill="#8A94A0" text-anchor="end">25</text>
      <text x="128" y="405" font-size="16" fill="#8A94A0" text-anchor="end">50</text>
      <text x="128" y="325" font-size="16" fill="#8A94A0" text-anchor="end">75</text>
      <text x="128" y="245" font-size="16" fill="#8A94A0" text-anchor="end">100</text>
      <line x1="140" y1="240" x2="140" y2="560" stroke="#D5DBE3" stroke-width="1.5"/>
      <line x1="140" y1="560" x2="800" y2="560" stroke="#D5DBE3" stroke-width="1.5"/>
      <!-- chart-plot-area: 140,240,800,560 -->
      <rect x="162.5" y="366.7" width="56" height="193.3" fill="#8A94A0"/>
      <text x="190.5" y="358" font-size="16" fill="#5A6573" text-anchor="middle">60.40</text>
      <rect x="226.5" y="330.2" width="56" height="229.8" fill="#1F4D78"/>
      <text x="254.5" y="322" font-size="16" font-weight="700" fill="#1F4D78" text-anchor="middle">71.81</text>
      <text x="222.5" y="590" font-size="18" fill="#1D1D1F" text-anchor="middle">Combo@1</text>
      <rect x="327.5" y="348.1" width="56" height="211.9" fill="#8A94A0"/>
      <text x="355.5" y="340" font-size="16" fill="#5A6573" text-anchor="middle">66.22</text>
      <rect x="391.5" y="288.9" width="56" height="271.1" fill="#1F4D78"/>
      <text x="419.5" y="281" font-size="16" font-weight="700" fill="#1F4D78" text-anchor="middle">84.71</text>
      <text x="387.5" y="590" font-size="18" fill="#1D1D1F" text-anchor="middle">Combo@5</text>
      <rect x="492.5" y="339.2" width="56" height="220.8" fill="#8A94A0"/>
      <text x="520.5" y="331" font-size="16" fill="#5A6573" text-anchor="middle">69.00</text>
      <rect x="556.5" y="274.5" width="56" height="285.5" fill="#1F4D78"/>
      <text x="584.5" y="266" font-size="16" font-weight="700" fill="#1F4D78" text-anchor="middle">89.21</text>
      <text x="552.5" y="590" font-size="18" fill="#1D1D1F" text-anchor="middle">Combo@20</text>
      <rect x="657.5" y="357.5" width="56" height="202.5" fill="#8A94A0"/>
      <text x="685.5" y="349" font-size="16" fill="#5A6573" text-anchor="middle">63.29</text>
      <rect x="721.5" y="312.1" width="56" height="247.9" fill="#1F4D78"/>
      <text x="749.5" y="304" font-size="16" font-weight="700" fill="#1F4D78" text-anchor="middle">77.48</text>
      <text x="717.5" y="590" font-size="18" fill="#1D1D1F" text-anchor="middle">Combo MRR</text>
    </g>
    <text x="140" y="628" font-size="16" fill="#8A94A0">Retro 测试集 2,558 条，精确集合命中率 %，全分母；top_m 30 · pool 15 · 集合 2–5 元</text>
  </g>
  <g id="p09-reading">
    <rect x="840" y="220" width="368" height="410" fill="#F3F5F8"/>
    <text x="864" y="256" font-size="24" font-weight="700" fill="#1F4D78">读数与对照</text>
    <text x="864" y="296" font-size="18" fill="#1D1D1F">
      <tspan x="864" dy="0"><tspan font-weight="700">Stage 1 Top-20 覆盖</tspan></tspan>
      <tspan x="864" dy="26">95.78（基线 92.96）</tspan>
      <tspan x="864" dy="36"><tspan font-weight="700">论文三种子均值</tspan></tspan>
      <tspan x="864" dy="26">71.70 ± 0.10 · 84.52 ± 1.48</tspan>
      <tspan x="864" dy="26">89.82 ± 1.74 · 77.43 ± 0.69</tspan>
      <tspan x="864" dy="36"><tspan font-weight="700">同枚举 product 对照</tspan></tspan>
      <tspan x="864" dy="26">Combo@1 11.65 · MRR 23.24</tspan>
      <tspan x="864" dy="26">→ 增益来自<tspan fill="#C48A2B" font-weight="700">学习到的集合级排序</tspan>，</tspan>
      <tspan x="864" dy="26">   而非候选枚举或过滤本身</tspan>
    </text>
    <text x="864" y="592" font-size="16" fill="#5A6573">
      <tspan x="864" dy="0">来源：vendor/two_stage_retro/checkpoints/</tspan>
      <tspan x="864" dy="24">stage1_summary.json · stage2_summary.json</tspan>
      <tspan x="864" dy="24">dry run：tools/retro_dry_run.py（CPU 数秒）</tspan>
    </text>
  </g>
  <g id="p09-footer">
    <text x="72" y="694" font-size="16" fill="#8A94A0">SAGE-Mat · GoAI Research · GOAI 2026 复赛</text>
    <text x="1208" y="694" font-size="16" fill="#8A94A0" text-anchor="end">9 / 12</text>
  </g>
</svg>
