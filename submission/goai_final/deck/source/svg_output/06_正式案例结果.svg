<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif'>
  <g id="p06-bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>
  <g id="p06-header">
    <text x="72" y="96" font-size="40" font-weight="700" fill="#1D1D1F">纯主题冷启动：51 篇文献全部核验、100 条结论全部可追溯</text>
    <rect x="72" y="114" width="72" height="4" fill="#1F4D78"/>
  </g>
  <g id="p06-lead">
    <text x="72" y="166" font-size="26" fill="#1D1D1F">
      <tspan x="72" dy="0">唯一输入是一行主题“Ba5Y12Zn[O(SiO4)]8 及其结构相近化合物的合成条件”；系统在 4 个</tspan>
      <tspan x="72" dy="38">人工停点续跑后交出 20 页综述，再按材料专家 8 条意见修订为 <tspan fill="#C48A2B" font-weight="700">23 页正式稿</tspan>。</tspan>
    </text>
  </g>
  <g id="p06-kpi-1">
    <rect x="72" y="236" width="272" height="114" fill="#F3F5F8"/>
    <rect x="72" y="236" width="272" height="4" fill="#1F4D78"/>
    <text x="92" y="300" font-size="56" font-weight="700" fill="#1F4D78">51 / 51</text>
    <text x="92" y="332" font-size="18" fill="#5A6573">文献三轴核验全部 PASS</text>
  </g>
  <g id="p06-kpi-2">
    <rect x="360" y="236" width="272" height="114" fill="#F3F5F8"/>
    <rect x="360" y="236" width="272" height="4" fill="#1F4D78"/>
    <text x="380" y="300" font-size="56" font-weight="700" fill="#1F4D78">219</text>
    <text x="380" y="332" font-size="18" fill="#5A6573">次引用，整合率 100%</text>
  </g>
  <g id="p06-kpi-3">
    <rect x="648" y="236" width="272" height="114" fill="#F3F5F8"/>
    <rect x="648" y="236" width="272" height="4" fill="#1F4D78"/>
    <text x="668" y="300" font-size="56" font-weight="700" fill="#1F4D78">3 张</text>
    <text x="668" y="332" font-size="18" fill="#5A6573">figspec 同源可编辑图</text>
  </g>
  <g id="p06-kpi-4">
    <rect x="936" y="236" width="272" height="114" fill="#F3F5F8"/>
    <rect x="936" y="236" width="272" height="4" fill="#C48A2B"/>
    <text x="956" y="300" font-size="56" font-weight="700" fill="#1F4D78">0</text>
    <text x="956" y="332" font-size="18" fill="#5A6573">两轮对抗审稿的终审 issue 数</text>
  </g>
  <g id="p06-figure">
    <rect x="72" y="376" width="477" height="268" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1"/>
    <image href="../images/byzso_roadmap.png" x="72" y="376" width="477" height="268" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="p06-run-facts">
    <text x="588" y="404" font-size="24" font-weight="700" fill="#1F4D78">运行事实（全部留痕于 submission/goai_final/run）</text>
    <text x="588" y="442" font-size="18" fill="#1D1D1F">
      <tspan x="588" dy="0">· 顶层编排器 5 次调用（首轮 + 4 次续跑），29 批 / 40 个子任务</tspan>
      <tspan x="588" dy="30">· 63 条候选 → 51 篇入库；5 条作者名 MISMATCH 经人工停点删除</tspan>
      <tspan x="588" dy="30">· 两轮对抗审稿：首轮 7 项 issue 路由返工，第二轮 0 / 0 / 0</tspan>
      <tspan x="588" dy="30">· 正式报告调用前驱体预测 3 次（Zn / Mg / Co 目标）</tspan>
      <tspan x="588" dy="30">· 专家反馈修订：正规论文语言、同类体系单独成节、前人结论汇总、</tspan>
      <tspan x="588" dy="26">  方向落到工艺与前驱体、相图讨论、学术排版图、去除工程术语</tspan>
    </text>
    <text x="588" y="632" font-size="18" fill="#5A6573">左图：正式报告研究路线图（第三轮学术化重绘）</text>
  </g>
  <g id="p06-footer">
    <text x="72" y="694" font-size="16" fill="#8A94A0">SAGE-Mat · GoAI Research · GOAI 2026 复赛</text>
    <text x="1208" y="694" font-size="16" fill="#8A94A0" text-anchor="end">6 / 12</text>
  </g>
</svg>
