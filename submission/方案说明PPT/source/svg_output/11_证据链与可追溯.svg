<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif'>
  <g id="p11-bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>
  <g id="p11-header">
    <text x="72" y="96" font-size="40" font-weight="700" fill="#1D1D1F">Demo：一行主题发起，实时看九个角色如何把它变成综述</text>
    <rect x="72" y="114" width="72" height="4" fill="#1F4D78"/>
  </g>
  <g id="p11-lead">
    <text x="72" y="166" font-size="26" fill="#1D1D1F">
      <tspan x="72" dy="0">演示用自研「循证台」控制台：一行主题发起研究，实时看到<tspan fill="#C48A2B" font-weight="700">各角色在做什么</tspan>、</tspan>
      <tspan x="72" dy="32">推进到哪个阶段、九项质量检查过了几项、审稿意见回到哪个角色返工；过程可回放。</tspan>
    </text>
  </g>
  <g id="p11-shot">
    <rect x="72" y="222" width="760" height="428" fill="#F3F5F8"/>
    <image href="../images/console_run.png" x="76" y="226" width="752" height="420" preserveAspectRatio="xMidYMid meet"/>
    <rect x="72" y="222" width="760" height="428" fill="none" stroke="#D5DBE3" stroke-width="1"/>
    <text x="72" y="668" font-size="16" fill="#8A94A0">截图为正在运行的主题「LLZO 合成方法调研」：文献检索阶段，6 个角色并行，质量检查 1 / 9。</text>
  </g>
  <g id="p11-points">
    <rect x="856" y="222" width="352" height="78" fill="#F3F5F8"/>
    <rect x="856" y="222" width="6" height="78" fill="#1F4D78"/>
    <text x="880" y="250" font-size="18" font-weight="700" fill="#1F4D78">① 发起研究</text>
    <text x="880" y="276" font-size="16" fill="#1D1D1F">一行主题；可选私有全文库、交付语言、模型</text>

    <rect x="856" y="310" width="352" height="78" fill="#F3F5F8"/>
    <rect x="856" y="310" width="6" height="78" fill="#1F4D78"/>
    <text x="880" y="338" font-size="18" font-weight="700" fill="#1F4D78">② 角色实时</text>
    <text x="880" y="364" font-size="16" fill="#1D1D1F">每个角色正在做的动作、最近产出与用时</text>

    <rect x="856" y="398" width="352" height="78" fill="#F3F5F8"/>
    <rect x="856" y="398" width="6" height="78" fill="#C48A2B"/>
    <text x="880" y="426" font-size="18" font-weight="700" fill="#1F4D78">③ 研究推进</text>
    <text x="880" y="452" font-size="16" fill="#1D1D1F">11 个阶段、并行段、当前阶段与负责角色</text>

    <rect x="856" y="486" width="352" height="78" fill="#F3F5F8"/>
    <rect x="856" y="486" width="6" height="78" fill="#C48A2B"/>
    <text x="880" y="514" font-size="18" font-weight="700" fill="#1F4D78">④ 质量检查与审稿</text>
    <text x="880" y="540" font-size="16" fill="#1D1D1F">9 项通过 / 待完成，意见带责任角色与返工</text>

    <rect x="856" y="574" width="352" height="78" fill="#F3F5F8"/>
    <rect x="856" y="574" width="6" height="78" fill="#4F8A9E"/>
    <text x="880" y="602" font-size="18" font-weight="700" fill="#1F4D78">⑤ 成果与回放</text>
    <text x="880" y="628" font-size="16" fill="#1D1D1F">综述 PDF、交付清单、可核验摘要，可回放</text>
  </g>
  <g id="p11-footer">
    <text x="72" y="694" font-size="16" fill="#8A94A0">SAGE-Mat · GOAI 2026 AI for Research 复赛</text>
    <text x="1208" y="694" font-size="16" fill="#8A94A0" text-anchor="end">11 / 13</text>
  </g>
</svg>
