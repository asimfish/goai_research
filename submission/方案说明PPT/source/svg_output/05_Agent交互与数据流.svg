<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif'>
  <defs>
    <marker id="flowArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#1F4D78"/></marker>
    <marker id="reworkArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#C48A2B"/></marker>
    <marker id="loopArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#4F8A9E"/></marker>
  </defs>
  <g id="p05-bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>
  <g id="p05-header">
    <text x="72" y="96" font-size="40" font-weight="700" fill="#1D1D1F">Agent 通过产物文件与共享进度记录交接，每一步都可审计</text>
    <rect x="72" y="114" width="72" height="4" fill="#1F4D78"/>
  </g>
  <g id="p05-lead">
    <text x="72" y="166" font-size="26" fill="#1D1D1F">产物在 Agent 之间逐级流转：<tspan fill="#C48A2B" font-weight="700">写作·图纸与想法方案并行</tspan>，审稿覆盖三者并把 issue 沿原路返工。</text>
  </g>
  <g id="p05-lane-rule">
    <text x="72" y="224" font-size="16" fill="#8A94A0">Agent</text>
    <text x="72" y="244" font-size="16" fill="#8A94A0">Codex 执行 skill</text>
    <text x="72" y="339" font-size="16" fill="#8A94A0">MCP 工具</text>
    <text x="72" y="384" font-size="16" fill="#8A94A0">交接产物</text>
    <line x1="72" y1="396" x2="1208" y2="396" stroke="#D5DBE3" stroke-width="1"/>
  </g>
  <g id="step-1-orchestrator">
    <rect x="200" y="200" width="170" height="60" fill="#1F4D78"/>
    <text x="285" y="227" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">编排器</text>
    <text x="285" y="248" font-size="16" fill="#FFFFFF" fill-opacity="0.85" text-anchor="middle">orchestrator</text>
    <rect x="200" y="312" width="170" height="44" fill="#F3F5F8"/>
    <text x="285" y="339" font-size="16" fill="#1D1D1F" text-anchor="middle">读进度 · 分派任务</text>
    <text x="285" y="384" font-size="16" font-weight="700" fill="#C48A2B" text-anchor="middle">主题 → scope.md</text>
    <line x1="372" y1="230" x2="396" y2="230" stroke="#1F4D78" stroke-width="2" marker-end="url(#flowArrow)"/>
  </g>
  <g id="step-2-litsearch">
    <rect x="400" y="200" width="170" height="60" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <text x="485" y="227" font-size="18" font-weight="700" fill="#1F4D78" text-anchor="middle">文献检索</text>
    <text x="485" y="248" font-size="16" fill="#5A6573" text-anchor="middle">lit-search</text>
    <rect x="400" y="312" width="170" height="44" fill="#F3F5F8"/>
    <text x="485" y="339" font-size="16" fill="#1D1D1F" text-anchor="middle">五源检索 · 本地库</text>
    <text x="485" y="384" font-size="16" font-weight="700" fill="#C48A2B" text-anchor="middle">papers.jsonl</text>
    <line x1="572" y1="230" x2="596" y2="230" stroke="#1F4D78" stroke-width="2" marker-end="url(#flowArrow)"/>
  </g>
  <g id="step-3-refguard">
    <rect x="600" y="200" width="170" height="60" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <text x="685" y="227" font-size="18" font-weight="700" fill="#1F4D78" text-anchor="middle">引用核验</text>
    <text x="685" y="248" font-size="16" fill="#5A6573" text-anchor="middle">ref-guard</text>
    <rect x="600" y="312" width="170" height="44" fill="#F3F5F8"/>
    <text x="685" y="339" font-size="16" fill="#1D1D1F" text-anchor="middle">题录与作者比对</text>
    <text x="685" y="384" font-size="16" font-weight="700" fill="#C48A2B" text-anchor="middle">bib 51/51 通过</text>
    <line x1="772" y1="230" x2="796" y2="218" stroke="#1F4D78" stroke-width="2" marker-end="url(#flowArrow)"/>
    <line x1="772" y1="230" x2="796" y2="268" stroke="#1F4D78" stroke-width="2" marker-end="url(#flowArrow)"/>
  </g>
  <g id="step-4-writer-figure">
    <rect x="800" y="196" width="170" height="44" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <text x="885" y="214" font-size="18" font-weight="700" fill="#1F4D78" text-anchor="middle">写作 · 图纸</text>
    <text x="885" y="234" font-size="16" fill="#5A6573" text-anchor="middle">writer · figure</text>
    <line x1="972" y1="218" x2="996" y2="230" stroke="#1F4D78" stroke-width="2" marker-end="url(#flowArrow)"/>
  </g>
  <g id="step-5-ideaforge">
    <rect x="800" y="246" width="170" height="44" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <text x="885" y="264" font-size="18" font-weight="700" fill="#1F4D78" text-anchor="middle">想法生成</text>
    <text x="885" y="284" font-size="16" fill="#5A6573" text-anchor="middle">idea-forge</text>
    <rect x="800" y="312" width="170" height="44" fill="#4F8A9E"/>
    <text x="885" y="331" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">figspec 双渲染</text>
    <text x="885" y="350" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">RECIPE 前驱体预测</text>
    <text x="885" y="384" font-size="16" font-weight="700" fill="#C48A2B" text-anchor="middle">tex · 图源 · 候选路线</text>
    <line x1="972" y1="268" x2="996" y2="230" stroke="#1F4D78" stroke-width="2" marker-end="url(#flowArrow)"/>
  </g>
  <g id="step-6-reviewer">
    <rect x="1000" y="200" width="170" height="60" fill="#FFFFFF" stroke="#C48A2B" stroke-width="1.5"/>
    <text x="1085" y="227" font-size="18" font-weight="700" fill="#1F4D78" text-anchor="middle">对抗审稿</text>
    <text x="1085" y="248" font-size="16" fill="#5A6573" text-anchor="middle">reviewer</text>
    <rect x="1000" y="312" width="170" height="44" fill="#F3F5F8"/>
    <text x="1085" y="339" font-size="16" fill="#1D1D1F" text-anchor="middle">全新上下文 · 三视角</text>
    <text x="1085" y="384" font-size="16" font-weight="700" fill="#C48A2B" text-anchor="middle">issue · 审稿记录</text>
  </g>
  <g id="rework-route">
    <path d="M1085,262 L1085,302 L885,302 L885,294" fill="none" stroke="#C48A2B" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#reworkArrow)"/>
  </g>
  <g id="ledger-bar">
    <rect x="72" y="410" width="1136" height="44" fill="#F3F5F8"/>
    <text x="88" y="438" font-size="18" font-weight="700" fill="#1F4D78">共享进度记录</text>
    <text x="248" y="438" font-size="16" fill="#1D1D1F">记录每一步是否通过、待返工问题与产物版本；上游一变，下游自动重查</text>
    <circle cx="1000" cy="432" r="6" fill="#1F4D78"/><circle cx="1024" cy="432" r="6" fill="#C48A2B"/><circle cx="1048" cy="432" r="6" fill="#C48A2B"/><circle cx="1072" cy="432" r="6" fill="#1F4D78"/><circle cx="1096" cy="432" r="6" fill="#1F4D78"/><circle cx="1120" cy="432" r="6" fill="#1F4D78"/><circle cx="1144" cy="432" r="6" fill="#1F4D78"/><circle cx="1168" cy="432" r="6" fill="#C48A2B"/><circle cx="1192" cy="432" r="6" fill="#1F4D78"/>
  </g>
  <g id="loop-output">
    <rect x="72" y="476" width="340" height="86" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <rect x="72" y="476" width="340" height="5" fill="#1F4D78"/>
    <text x="92" y="508" font-size="18" font-weight="700" fill="#1F4D78">本轮输出</text>
    <text x="92" y="534" font-size="16" fill="#1D1D1F">综述 PDF · claim_evidence.jsonl</text>
    <text x="92" y="554" font-size="16" fill="#1D1D1F">候选路线 + 前驱体 + 表征方案 + 失败判据</text>
    <line x1="414" y1="519" x2="464" y2="519" stroke="#4F8A9E" stroke-width="2" marker-end="url(#loopArrow)"/>
  </g>
  <g id="loop-lab">
    <rect x="468" y="476" width="340" height="86" fill="#FFFFFF" stroke="#4F8A9E" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="468" y="476" width="340" height="5" fill="#4F8A9E"/>
    <text x="488" y="508" font-size="18" font-weight="700" fill="#4F8A9E">自动化实验室（下一环）</text>
    <text x="488" y="534" font-size="16" fill="#1D1D1F">按方案合成 · PXRD / 单晶 / EDS 表征</text>
    <text x="488" y="554" font-size="16" fill="#1D1D1F">结构化结果与失败判据同格式记录</text>
    <line x1="810" y1="519" x2="860" y2="519" stroke="#4F8A9E" stroke-width="2" marker-end="url(#loopArrow)"/>
  </g>
  <g id="loop-feedback">
    <rect x="864" y="476" width="344" height="86" fill="#FFFFFF" stroke="#4F8A9E" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="864" y="476" width="344" height="5" fill="#4F8A9E"/>
    <text x="884" y="508" font-size="18" font-weight="700" fill="#4F8A9E">结果回写为证据</text>
    <text x="884" y="534" font-size="16" fill="#1D1D1F">实验记录进入证据库与共享进度记录</text>
    <text x="884" y="554" font-size="16" fill="#1D1D1F">触发新一轮检索、假设与路线更新</text>
    <path d="M1036,564 L1036,580 L56,580 L56,188 L285,188 L285,196" fill="none" stroke="#4F8A9E" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#loopArrow)"/>
    <text x="640" y="600" font-size="16" fill="#4F8A9E" text-anchor="middle">闭环：新证据回到编排器，开启下一轮检索、核验与假设</text>
  </g>
  <g id="takeaway">
    <rect x="72" y="614" width="6" height="52" fill="#C48A2B"/>
    <text x="96" y="634" font-size="18" fill="#1D1D1F"><tspan font-weight="700" fill="#1F4D78">解决的科学问题</tspan>　文献能限定什么、哪些近邻条件可迁移、下一步做什么实验最有发现价值</text>
    <text x="96" y="662" font-size="18" fill="#1D1D1F"><tspan font-weight="700" fill="#1F4D78">对闭环探索的关键</tspan>　每条建议都带证据、可执行、可回写；需要人确认的节点与程序质量检查保证可信而不失自动化</text>
  </g>
  <g id="p05-footer">
    <text x="72" y="694" font-size="16" fill="#8A94A0">SAGE-Mat · GOAI 2026 AI for Research 复赛</text>
    <text x="1208" y="694" font-size="16" fill="#8A94A0" text-anchor="end">5 / 13</text>
  </g>
</svg>
