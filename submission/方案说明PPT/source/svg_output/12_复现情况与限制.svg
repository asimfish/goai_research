<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif'>
  <g id="p12-bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>
  <g id="p12-header">
    <text x="72" y="96" font-size="40" font-weight="700" fill="#1D1D1F">相比通用文献综述 Agent 的四点不同，且全部开源可复现</text>
    <rect x="72" y="114" width="72" height="4" fill="#1F4D78"/>
  </g>
  <g id="p12-lead">
    <text x="72" y="166" font-size="26" fill="#1D1D1F">
      <tspan x="72" dy="0">通用 Deep Research 工具给出一段带引用的总结；SAGE-Mat 面向<tspan fill="#C48A2B" font-weight="700">合成实验方案</tspan>做特化，</tspan>
      <tspan x="72" dy="36">并把「做完了」交给程序判定，每一步留痕、可回放、失败可迭代。</tspan>
    </text>
  </g>
  <g id="p12-commands">
    <rect x="72" y="228" width="556" height="172" fill="#F3F5F8"/>
    <use data-icon="tabler-outline/shield-check" x="96" y="250" width="28" height="28" fill="#1F4D78" stroke-width="2"/>
    <text x="134" y="272" font-size="24" font-weight="700" fill="#1F4D78">1  引用零信任，而非生成式引用</text>
    <text x="96" y="310" font-size="18" fill="#1D1D1F">
      <tspan x="96" dy="0">只引用检索到且逐条核对过的文献（存在·题录·作者顺序）；</tspan>
      <tspan x="96" dy="28">查无此文直接删除并换证据。正式案例 51 / 51 通过。</tspan>
    </text>
    <rect x="72" y="416" width="556" height="172" fill="#F3F5F8"/>
    <use data-icon="tabler-outline/list-check" x="96" y="438" width="28" height="28" fill="#1F4D78" stroke-width="2"/>
    <text x="134" y="460" font-size="24" font-weight="700" fill="#1F4D78">3  完成由程序判定，而非模型自报</text>
    <text x="96" y="498" font-size="18" fill="#1D1D1F">
      <tspan x="96" dy="0">九项质量检查、写稿与审稿分离、审稿意见按角色返工；</tspan>
      <tspan x="96" dy="28">失败与返工都记入共享进度记录，成为下一轮的证据。</tspan>
    </text>
  </g>
  <g id="p12-limitations">
    <rect x="652" y="228" width="556" height="172" fill="#F3F5F8"/>
    <use data-icon="tabler-outline/atom-2" x="676" y="250" width="28" height="28" fill="#1F4D78" stroke-width="2"/>
    <text x="714" y="272" font-size="24" font-weight="700" fill="#1F4D78">2  前驱体由训练好的模型预测</text>
    <text x="676" y="310" font-size="18" fill="#1D1D1F">
      <tspan x="676" dy="0">接入两阶段前驱体预测模型 RECIPE（NeurIPS 2026 投稿）；</tspan>
      <tspan x="676" dy="28">温度 / 气氛从近邻体系按证据等级类比，并标出不可迁移边界。</tspan>
    </text>
    <rect x="652" y="416" width="556" height="172" fill="#F3F5F8"/>
    <use data-icon="tabler-outline/brand-github" x="676" y="438" width="28" height="28" fill="#1F4D78" stroke-width="2"/>
    <text x="714" y="460" font-size="24" font-weight="700" fill="#1F4D78">4  全流程开源，可一键复现</text>
    <text x="676" y="498" font-size="18" fill="#1D1D1F">
      <tspan x="676" dy="0">Codex CLI 宿主 + 4 个自研 MCP 服务 + 控制台，MIT 开源；</tspan>
      <tspan x="676" dy="28">一键安装、冒烟 1–2 分钟、同一主题重跑，关卡全过才算复现</tspan>
    </text>
    <rect x="72" y="604" width="1136" height="60" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1"/>
    <use data-icon="tabler-outline/alert-triangle" x="92" y="620" width="28" height="28" fill="#C48A2B" stroke-width="2"/>
    <text x="132" y="630" font-size="18" fill="#1D1D1F">
      <tspan x="132" dy="0"><tspan font-weight="700" fill="#1F4D78">边界</tspan>　目标相仅 1 篇直接报道；大模型步骤不可逐字复现，以关卡全部通过为复现判据。</tspan>
      <tspan x="132" dy="24">同一系统对三个新主题各冷启动一次（LLZO 16 页 · BaZn2Si2O7 4 页 · Ba–Y–Zn–Si–O 相图 35 页），随包提交。</tspan>
    </text>
  </g>
  <g id="p12-footer">
    <text x="72" y="694" font-size="16" fill="#8A94A0">SAGE-Mat · GOAI 2026 AI for Research 复赛</text>
    <text x="1208" y="694" font-size="16" fill="#8A94A0" text-anchor="end">12 / 13</text>
  </g>
</svg>
