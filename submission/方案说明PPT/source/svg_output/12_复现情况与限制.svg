<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif'>
  <g id="p12-bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>
  <g id="p12-header">
    <text x="72" y="96" font-size="40" font-weight="700" fill="#1D1D1F">复现与开源：Codex 宿主 + 自研 MCP，仓库 MIT 全开源</text>
    <rect x="72" y="114" width="72" height="4" fill="#1F4D78"/>
  </g>
  <g id="p12-lead">
    <text x="72" y="166" font-size="26" fill="#1D1D1F">
      <tspan x="72" dy="0">复现不靠截图：可读的角色说明、可运行的工具和开源产物，加上同一主题可重跑整条流水线，</tspan>
      <tspan x="72" dy="36"><tspan fill="#C48A2B" font-weight="700">全部质量关卡通过</tspan>才算复现成功。</tspan>
    </text>
  </g>
  <g id="p12-commands">
    <rect x="72" y="228" width="556" height="172" fill="#F3F5F8"/>
    <use data-icon="tabler-outline/cpu" x="96" y="250" width="28" height="28" fill="#1F4D78" stroke-width="2"/>
    <text x="134" y="272" font-size="24" font-weight="700" fill="#1F4D78">1  开源的 Codex CLI 做宿主</text>
    <text x="96" y="310" font-size="18" fill="#1D1D1F">
      <tspan x="96" dy="0">9 个 Agent 角色都是纯 Markdown 说明，任何宿主都能读；</tspan>
      <tspan x="96" dy="28">模型 gpt-5.6-sol、推理强度 xhigh，写进配置随包提交。</tspan>
    </text>
    <rect x="72" y="416" width="556" height="172" fill="#F3F5F8"/>
    <use data-icon="tabler-outline/database" x="96" y="438" width="28" height="28" fill="#1F4D78" stroke-width="2"/>
    <text x="134" y="460" font-size="24" font-weight="700" fill="#1F4D78">3  知识库与数据边界</text>
    <text x="96" y="498" font-size="18" fill="#1D1D1F">
      <tspan x="96" dy="0">被引 51 篇中 21 篇全文进入公开知识库，其余 30 篇给 DOI；</tspan>
      <tspan x="96" dy="28">在线检索 arXiv / OpenAlex / Crossref / Semantic Scholar 不受影响。</tspan>
    </text>
  </g>
  <g id="p12-limitations">
    <rect x="652" y="228" width="556" height="172" fill="#F3F5F8"/>
    <use data-icon="tabler-outline/network" x="676" y="250" width="28" height="28" fill="#1F4D78" stroke-width="2"/>
    <text x="714" y="272" font-size="24" font-weight="700" fill="#1F4D78">2  四个自研 MCP 服务</text>
    <text x="676" y="310" font-size="18" fill="#1D1D1F">
      <tspan x="676" dy="0">文献检索、引用核对、绘图、RECIPE 前驱体预测；</tspan>
      <tspan x="676" dy="28">全部可离线测试，每次调用写入审计日志。</tspan>
    </text>
    <rect x="652" y="416" width="556" height="172" fill="#F3F5F8"/>
    <use data-icon="tabler-outline/repeat" x="676" y="438" width="28" height="28" fill="#1F4D78" stroke-width="2"/>
    <text x="714" y="460" font-size="24" font-weight="700" fill="#1F4D78">4  一键安装、冒烟、复跑</text>
    <text x="676" y="498" font-size="18" fill="#1D1D1F">
      <tspan x="676" dy="0">install.sh 锁定依赖；smoke test 无网络、无 LLM，1–2 分钟；</tspan>
      <tspan x="676" dy="28">reproduce_core 同一主题重跑，关卡全过才返回 0。</tspan>
    </text>
    <rect x="72" y="604" width="1136" height="60" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1"/>
    <use data-icon="tabler-outline/alert-triangle" x="92" y="620" width="28" height="28" fill="#C48A2B" stroke-width="2"/>
    <text x="132" y="630" font-size="18" fill="#1D1D1F">
      <tspan x="132" dy="0"><tspan font-weight="700" fill="#1F4D78">边界</tspan>　目标相仅 1 篇直接报道；大模型步骤不可逐字复现，以关卡全部通过为复现判据。</tspan>
      <tspan x="132" dy="24">09-03 用同一系统对三个新主题各冷启动一次（LLZO 16 页 · BaZn2Si2O7 4 页 · Ba–Y–Zn–Si–O 相图 35 页），随包提交。</tspan>
    </text>
  </g>
  <g id="p12-footer">
    <text x="72" y="694" font-size="16" fill="#8A94A0">SAGE-Mat · GOAI 2026 AI for Research 复赛</text>
    <text x="1208" y="694" font-size="16" fill="#8A94A0" text-anchor="end">12 / 13</text>
  </g>
</svg>
