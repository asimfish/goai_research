<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif'>
  <defs>
    <marker id="sysArrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1F4D78"/>
    </marker>
    <marker id="sysRework" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#C48A2B"/>
    </marker>
  </defs>
  <g id="p04-bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>
  <g id="p04-header">
    <text x="72" y="96" font-size="40" font-weight="700" fill="#1D1D1F">系统把“生成像论文的结论”改为“保存证据与判定过程”</text>
    <rect x="72" y="114" width="72" height="4" fill="#1F4D78"/>
  </g>
  <g id="p04-lead">
    <text x="72" y="166" font-size="26" fill="#1D1D1F">三层分离：认知交给宿主模型，确定性工作进 MCP 服务，<tspan fill="#C48A2B" font-weight="700">“做完了”由程序检查</tspan>。</text>
  </g>
  <g id="p04-figure">
    <rect x="72" y="206" width="700" height="36" fill="#1F4D78"/>
    <text x="84" y="230" font-size="16" font-weight="700" fill="#FFFFFF">① 编排器 orchestrator：读共享进度记录 · 分派任务 · 验收每一步产物 · 路由返工</text>
    <rect x="72" y="262" width="160" height="44" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <text x="82" y="280" font-size="16" font-weight="700" fill="#1F4D78">② 文献检索</text>
    <text x="82" y="298" font-size="16" fill="#5A6573">在线五源 + 本地库</text>
    <rect x="72" y="330" width="160" height="44" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <text x="82" y="348" font-size="16" font-weight="700" fill="#1F4D78">④ 引用核对</text>
    <text x="82" y="366" font-size="16" fill="#5A6573">题录与作者逐条比对</text>
    <rect x="72" y="420" width="160" height="44" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <text x="82" y="438" font-size="16" font-weight="700" fill="#1F4D78">③ 写作风格学习</text>
    <text x="82" y="456" font-size="16" fill="#5A6573">30 篇经典综述</text>
    <rect x="262" y="330" width="150" height="44" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <text x="272" y="348" font-size="16" font-weight="700" fill="#1F4D78">⑤ 分类与写作</text>
    <text x="272" y="366" font-size="16" fill="#5A6573">分类法 → 章节</text>
    <rect x="442" y="262" width="160" height="44" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <text x="452" y="280" font-size="16" font-weight="700" fill="#1F4D78">⑥ 学术插图绘制</text>
    <text x="452" y="298" font-size="16" fill="#5A6573">图源 → 论文图</text>
    <rect x="442" y="330" width="160" height="44" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <text x="452" y="348" font-size="16" font-weight="700" fill="#1F4D78">⑦ 旧图可编辑化</text>
    <text x="452" y="366" font-size="16" fill="#5A6573">位图 → draw.io</text>
    <rect x="442" y="398" width="160" height="44" fill="#FFFFFF" stroke="#1F4D78" stroke-width="1.5"/>
    <text x="452" y="416" font-size="16" font-weight="700" fill="#1F4D78">⑧ 想法与实验方案</text>
    <text x="452" y="434" font-size="16" fill="#5A6573">调用前驱体预测</text>
    <rect x="632" y="330" width="140" height="44" fill="#FFFFFF" stroke="#C48A2B" stroke-width="1.5"/>
    <text x="642" y="348" font-size="16" font-weight="700" fill="#1F4D78">⑨ 对抗审稿</text>
    <text x="642" y="366" font-size="16" fill="#5A6573">新上下文 · 三视角</text>
    <line x1="152" y1="308" x2="152" y2="326" stroke="#1F4D78" stroke-width="2" marker-end="url(#sysArrow)"/>
    <path d="M232,352 L258,352" fill="none" stroke="#1F4D78" stroke-width="2" marker-end="url(#sysArrow)"/>
    <path d="M232,442 L247,442 L247,352" fill="none" stroke="#1F4D78" stroke-width="2"/>
    <path d="M412,352 L427,352 M427,284 L427,420" fill="none" stroke="#1F4D78" stroke-width="2"/>
    <line x1="427" y1="284" x2="438" y2="284" stroke="#1F4D78" stroke-width="2" marker-end="url(#sysArrow)"/>
    <line x1="427" y1="352" x2="438" y2="352" stroke="#1F4D78" stroke-width="2" marker-end="url(#sysArrow)"/>
    <line x1="427" y1="420" x2="438" y2="420" stroke="#1F4D78" stroke-width="2" marker-end="url(#sysArrow)"/>
    <path d="M602,284 L617,284 M602,352 L617,352 M602,420 L617,420 M617,284 L617,420" fill="none" stroke="#1F4D78" stroke-width="2"/>
    <line x1="617" y1="352" x2="628" y2="352" stroke="#1F4D78" stroke-width="2" marker-end="url(#sysArrow)"/>
    <path d="M702,374 L702,478 L337,478 L337,378" fill="none" stroke="#C48A2B" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#sysRework)"/>
    <text x="520" y="496" font-size="16" fill="#C48A2B" text-anchor="middle">审稿 issue 沿原路返工（稿件、图、想法方案）</text>
    <text x="152" y="530" font-size="16" fill="#8A94A0" text-anchor="middle">发现</text>
    <text x="337" y="530" font-size="16" fill="#8A94A0" text-anchor="middle">写作</text>
    <text x="522" y="530" font-size="16" fill="#8A94A0" text-anchor="middle">生产（并行）</text>
    <text x="702" y="530" font-size="16" fill="#8A94A0" text-anchor="middle">质量</text>
    <line x1="72" y1="546" x2="772" y2="546" stroke="#D5DBE3" stroke-width="1"/>
    <text x="72" y="574" font-size="16" fill="#5A6573">4 个自研 MCP 服务：② 文献检索 · ④ 引用核对 · ⑥⑦ 绘图 · ⑧ 前驱体预测（RECIPE）</text>
  </g>
  <g id="p04-layer-cognitive">
    <rect x="812" y="206" width="6" height="150" fill="#1F4D78"/>
    <use data-icon="tabler-outline/hierarchy-2" x="836" y="210" width="28" height="28" fill="#1F4D78" stroke-width="2"/>
    <text x="874" y="232" font-size="24" font-weight="700" fill="#1F4D78">认知层 · 9 个 Agent 角色</text>
    <text x="836" y="264" font-size="18" fill="#1D1D1F">
      <tspan x="836" dy="0">① 编排　② 文献检索　③ 写作风格学习</tspan>
      <tspan x="836" dy="26">④ 引用核对　⑤ 分类与写作　⑥ 学术插图绘制</tspan>
      <tspan x="836" dy="26">⑦ 旧图可编辑化　⑧ 想法与实验方案</tspan>
      <tspan x="836" dy="26">⑨ 对抗审稿（全新上下文，先核对再批评）</tspan>
    </text>
  </g>
  <g id="p04-layer-deterministic">
    <rect x="812" y="372" width="6" height="150" fill="#4F8A9E"/>
    <use data-icon="tabler-outline/database" x="836" y="376" width="28" height="28" fill="#1F4D78" stroke-width="2"/>
    <text x="874" y="398" font-size="24" font-weight="700" fill="#1F4D78">确定性层 · 4 个自研 MCP 服务</text>
    <text x="836" y="430" font-size="18" fill="#1D1D1F">
      <tspan x="836" dy="0"><tspan font-weight="700" fill="#1F4D78">文献检索</tspan>：arXiv、OpenAlex、Crossref、</tspan>
      <tspan x="836" dy="26">Semantic Scholar 在线库 + 本地全文库</tspan>
      <tspan x="836" dy="26"><tspan font-weight="700" fill="#1F4D78">引用核对</tspan>：逐条比对题录与作者顺序</tspan>
      <tspan x="836" dy="26"><tspan font-weight="700" fill="#1F4D78">绘图</tspan>：一份图源同时出论文图与可编辑图</tspan>
      <tspan x="836" dy="26"><tspan font-weight="700" fill="#1F4D78">前驱体预测</tspan>：RECIPE 两阶段模型</tspan>
    </text>
  </g>
  <g id="p04-layer-control">
    <rect x="812" y="556" width="6" height="112" fill="#C48A2B"/>
    <use data-icon="tabler-outline/repeat" x="836" y="560" width="28" height="28" fill="#1F4D78" stroke-width="2"/>
    <text x="874" y="582" font-size="24" font-weight="700" fill="#1F4D78">控制层 · 流程与质量把关</text>
    <text x="836" y="614" font-size="18" fill="#1D1D1F">
      <tspan x="836" dy="0">每个阶段有明确完成标准：文献覆盖、引用全部</tspan>
      <tspan x="836" dy="24">核对、图文齐全、审稿通过；由程序检查，</tspan>
      <tspan x="836" dy="24">不由模型自己宣布完成；写稿与审稿分离。</tspan>
    </text>
  </g>
  <g id="p04-footer">
    <text x="72" y="694" font-size="16" fill="#8A94A0">SAGE-Mat · GOAI 2026 AI for Research 复赛</text>
    <text x="1208" y="694" font-size="16" fill="#8A94A0" text-anchor="end">4 / 13</text>
  </g>
</svg>
