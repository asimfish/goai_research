<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family='"Microsoft YaHei", "PingFang SC", Arial, sans-serif'>
  <g id="p08-bg">
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  </g>
  <g id="p08-header">
    <text x="72" y="96" font-size="40" font-weight="700" fill="#1D1D1F">相图导向冷启动：513 篇文献闭环，三个实验方向可检验</text>
    <rect x="72" y="114" width="72" height="4" fill="#1F4D78"/>
  </g>
  <g id="p08-lead">
    <text x="72" y="166" font-size="26" fill="#1D1D1F">
      <tspan x="72" dy="0">唯一输入是 Ba–Y–Zn–Si–O 硅酸盐的相图、合成与亚稳相问题；系统在直接证据稀疏时</tspan>
      <tspan x="72" dy="38">仍完成 <tspan fill="#C48A2B" font-weight="700">35 页终稿</tspan>，并把近邻证据、动力学边界与模型候选分层呈现。</tspan>
    </text>
  </g>
  <g id="p08-kpi-1">
    <rect x="72" y="236" width="272" height="114" fill="#F3F5F8"/>
    <rect x="72" y="236" width="272" height="4" fill="#1F4D78"/>
    <text x="92" y="300" font-size="48" font-weight="700" fill="#1F4D78">513 / 513</text>
    <text x="92" y="332" font-size="18" fill="#5A6573">引用记录逐条核对通过</text>
  </g>
  <g id="p08-kpi-2">
    <rect x="360" y="236" width="272" height="114" fill="#F3F5F8"/>
    <rect x="360" y="236" width="272" height="4" fill="#1F4D78"/>
    <text x="380" y="300" font-size="56" font-weight="700" fill="#1F4D78">757</text>
    <text x="380" y="332" font-size="18" fill="#5A6573">次正文引用，整合率 100%</text>
  </g>
  <g id="p08-kpi-3">
    <rect x="648" y="236" width="272" height="114" fill="#F3F5F8"/>
    <rect x="648" y="236" width="272" height="4" fill="#1F4D78"/>
    <text x="668" y="300" font-size="56" font-weight="700" fill="#1F4D78">3 + 3</text>
    <text x="668" y="332" font-size="18" fill="#5A6573">可编辑图 · 可检验实验设计</text>
  </g>
  <g id="p08-kpi-4">
    <rect x="936" y="236" width="272" height="114" fill="#F3F5F8"/>
    <rect x="936" y="236" width="272" height="4" fill="#C48A2B"/>
    <text x="956" y="300" font-size="56" font-weight="700" fill="#1F4D78">0 / 0</text>
    <text x="956" y="332" font-size="18" fill="#5A6573">终审 blocker / major</text>
  </g>
  <g id="p08-figure">
    <rect x="72" y="376" width="477" height="268" fill="#FFFFFF" stroke="#D5DBE3" stroke-width="1"/>
    <image href="../images/byzso_latest_taxonomy.png" x="72" y="376" width="477" height="268" preserveAspectRatio="xMidYMid meet"/>
  </g>
  <g id="p08-run-facts">
    <text x="588" y="404" font-size="24" font-weight="700" fill="#1F4D78">运行事实（全部过程留痕）</text>
    <text x="588" y="442" font-size="18" fill="#1D1D1F">
      <tspan x="588" dy="0">· 15 批 / 24 个任务轨迹，42 次工具调用；输入、异常与审稿均留痕</tspan>
      <tspan x="588" dy="30">· 516 条检索记录 → 513 条去重文献；七个子主题无关键词缺口</tspan>
      <tspan x="588" dy="30">· 三个方向：相纯窗口、亚稳态热历史、带盲测的闭环相图设计</tspan>
      <tspan x="588" dy="30">· 三图均保留 figspec / SVG / draw.io 同源可编辑版本</tspan>
      <tspan x="588" dy="30">· 格式终审 0 blocker / 0 major；仅 1 个参考文献元数据 minor</tspan>
      <tspan x="588" dy="26">· 边界：未见可复现相纯四元晶相；模型候选不是实验事实</tspan>
    </text>
    <text x="72" y="666" font-size="16" fill="#5A6573">左图：最新终稿中的 Ba–Y–Zn–Si–O 证据分类图</text>
  </g>
  <g id="p08-footer">
    <text x="72" y="694" font-size="16" fill="#8A94A0">SAGE-Mat · GOAI 2026 AI for Research 复赛</text>
    <text x="1208" y="694" font-size="16" fill="#8A94A0" text-anchor="end">8 / 13</text>
  </g>
</svg>
